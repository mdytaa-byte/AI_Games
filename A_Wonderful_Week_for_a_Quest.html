<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A Wonderful Week for a Quest</title>
<meta name="description" content="A 16-bit RPG of Michael D. Young’s A Wonderful Week for a Quest. Books I–VII plus the Book I epilogue: statue, restored Meriwethers, and reasonably happy.">
<style>
  :root {
    --ink: #0a0714;
    --navy: #14204a;
    --navy2: #1c2e6b;
    --gold: #e6c15a;
    --gold2: #f8e39a;
    --cream: #fff4d2;
    --muted: #c9b88a;
    --hp: #d94c4c;
    --mp: #4aa3e8;
    --ok: #4cbf7a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #05040a; color: var(--cream);
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden; user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #wrap {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 256 / 224));
    height: min(100vh, calc(100vw * 224 / 256));
    background: #000;
    box-shadow: 0 0 0 3px #3a2a12, 0 0 0 6px #e6c15a, 0 0 40px #e6c15a44;
    image-rendering: pixelated;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  .panel {
    position: absolute; left: 3%; right: 3%;
    background: linear-gradient(#1a2760, #10183c);
    border: 3px solid #e6c15a;
    box-shadow: inset 0 0 0 2px #8a6a22, 0 8px 24px #000a;
    color: var(--cream);
    padding: 10px 12px;
    font-size: clamp(11px, 2.4vw, 15px);
    line-height: 1.35;
    letter-spacing: .02em;
  }
  #hud {
    top: 2%; display: none; pointer-events: none;
  }
  #hud.show { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .stat { display: flex; gap: 10px; align-items: center; }
  .bar {
    width: 88px; height: 8px; background: #0008; border: 1px solid #e6c15a88;
  }
  .bar > i { display: block; height: 100%; }
  #dialog {
    bottom: 3%; display: none; min-height: 28%;
  }
  #dialog.show { display: block; }
  #who {
    position: absolute; top: -13px; left: 14px;
    background: #14204a; border: 2px solid #e6c15a; padding: 1px 10px;
    font-size: .85em; color: var(--gold2); letter-spacing: .12em;
    text-transform: uppercase;
  }
  #line { min-height: 3.2em; white-space: pre-wrap; }
  #choices { margin-top: 8px; display: none; }
  #choices.show { display: grid; gap: 4px; }
  .choice {
    border: 1px solid #e6c15a55; padding: 5px 8px; cursor: pointer;
    background: #0003;
  }
  .choice.on, .choice:hover { background: #e6c15a22; border-color: #e6c15a; }
  #next {
    position: absolute; right: 10px; bottom: 6px; color: var(--gold);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #footnote {
    position: absolute; left: 3%; right: 3%; bottom: 34%;
    display: none; font-size: clamp(10px, 2vw, 13px);
    color: #d7ecff; background: #0c1230ee;
  }
  #footnote.show { display: block; }
  #menu, #battle, #titleui, #pause {
    position: absolute; inset: 0; display: none;
  }
  #menu.show, #battle.show, #titleui.show, #pause.show { display: block; }
  #titleui {
    background: transparent; pointer-events: none;
  }
  #titleui .inner {
    position: absolute; left: 8%; right: 8%; bottom: 8%;
    text-align: center; pointer-events: auto;
  }
  h1 {
    margin: 0 0 6px; font-size: clamp(18px, 4.2vw, 32px);
    color: var(--gold2); letter-spacing: .16em; text-transform: uppercase;
    text-shadow: 0 3px 0 #5a3a10, 0 0 18px #e6c15a88;
  }
  .sub { color: var(--muted); letter-spacing: .2em; font-size: .78em; text-transform: uppercase; }
  .blink { margin-top: 16px; color: var(--gold); animation: blink 1.2s steps(2) infinite; }
  .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    font: inherit; cursor: pointer; color: #1a1208;
    background: linear-gradient(#f4dc8a, #c9962e);
    border: 2px solid #fff4c4; box-shadow: inset 0 0 0 2px #6a4a12;
    padding: 8px 14px; letter-spacing: .08em; text-transform: uppercase;
  }
  button.ghost {
    color: var(--cream); background: #14204acc; border-color: #e6c15a; box-shadow: none;
  }
  #pause .panel, #menu .panel { top: 12%; bottom: 12%; overflow: auto; }
  #battle .panel { bottom: 3%; top: auto; }
  #bLog { min-height: 2.4em; margin-bottom: 8px; }
  #bActs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .act {
    border: 1px solid #e6c15a66; padding: 7px 8px; cursor: pointer; background: #0003;
  }
  .act.on { border-color: #e6c15a; background: #e6c15a22; }
  #touch {
    display: none; position: absolute; inset: 0; pointer-events: none;
  }
  .pad, .a-btn {
    pointer-events: auto; position: absolute; opacity: .78;
  }
  .pad {
    left: 12px; bottom: 12px; width: 132px; height: 132px;
  }
  .pad b {
    position: absolute; width: 42px; height: 42px; background: #14204acc;
    border: 2px solid #e6c15a; color: var(--gold2);
    display: grid; place-items: center; font-size: 16px;
  }
  .pad .u { left: 45px; top: 0; } .pad .d { left: 45px; bottom: 0; }
  .pad .l { left: 0; top: 45px; } .pad .r { right: 0; top: 45px; }
  .a-btn {
    right: 18px; bottom: 28px; width: 64px; height: 64px; border-radius: 50%;
    background: #c9962ecc; border: 3px solid #fff4c4; color: #1a1208;
    font-weight: 800; display: grid; place-items: center; font-size: 22px;
  }
  .b-btn {
    right: 92px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%;
    background: #4aa3e8cc; border: 2px solid #d7ecff; color: #081018;
    font-weight: 800; display: grid; place-items: center; pointer-events: auto;
    position: absolute;
  }
  @media (pointer: coarse) { #touch { display: block; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="c" width="256" height="224" aria-label="Game screen"></canvas>
      <div id="hud" class="panel">
        <div class="stat">
          <strong id="pName">SQUIRES</strong>

        </div>
        <div id="loc" style="color:var(--gold2)">Beanvale</div>
      </div>
      <div id="dialog" class="panel" role="dialog" aria-live="polite">
        <div id="who">Jackdaw</div>
        <div id="line"></div>
        <div id="choices"></div>
        <div id="next">▼</div>
      </div>
      <div id="footnote" class="panel"></div>
      <div id="titleui">
        <div class="inner">
          <div class="sub">Michael D. Young · Books 1–7 + Epilogue</div>
          <h1>A Wonderful Week<br>for a Quest</h1>
          <div class="sub">A 16-bit love letter to the genre</div>
          <div class="blink" id="press">Press Start / Enter / Tap</div>
          <div class="btns">
            <button id="btnNew">Book I</button>
            <button id="btnBook2">Book II</button>
            <button id="btnBook3">Book III</button>
            <button id="btnBook4">Book IV</button>

            <button id="btnBook6">Book VI</button>
            <button id="btnBook7">Book VII</button>
            <button id="btnEpi">Epilogue</button>
            <button id="btnCont" class="ghost">Continue</button>
            <button id="btnMute" class="ghost">Sound: On</button>
          </div>
        </div>
      </div>
      <div id="menu">
        <div class="panel">
          <div class="sub">Quest Log · Beandom</div>
          <h2 id="mTitle" style="color:var(--gold2);margin:.3em 0">Party</h2>
          <div id="mBody"></div>
          <div class="btns">
            <button id="btnSave">Save</button>
            <button id="btnClose" class="ghost">Close</button>
            <button id="btnTitle" class="ghost">Title</button>
          </div>
        </div>
      </div>
      <div id="battle">
        <div class="panel">
          <div id="bLog"></div>
          <div id="bActs"></div>
        </div>
      </div>
      <div id="touch">
        <div class="pad">
          <b class="u" data-k="ArrowUp">▲</b>
          <b class="d" data-k="ArrowDown">▼</b>
          <b class="l" data-k="ArrowLeft">◀</b>
          <b class="r" data-k="ArrowRight">▶</b>
        </div>
        <div class="a-btn" data-k="Enter">A</div>
        <div class="b-btn" data-k="Escape">B</div>
      </div>
    </div>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>

  /* ---------- dialogue ---------- */
  function say(lines, after) {
    G.mode = "dialog";
    G.dialog = { lines, i: 0, after, choice: 0 };
    renderDialog();
    $("dialog").classList.add("show");
    $("footnote").classList.remove("show");
  }
  function renderDialog() {
    const d = G.dialog;
    if (!d) return;
    const line = d.lines[d.i];
    $("who").textContent = line.who || "???";
    $("line").textContent = line.text;
    $("live").textContent = (line.who || "") + ": " + line.text;
    const box = $("choices");
    box.innerHTML = "";
    if (line.choices) {
      box.classList.add("show");
      line.choices.forEach((c, i) => {
        const div = document.createElement("div");
        div.className = "choice" + (i === d.choice ? " on" : "");
        div.textContent = (i === d.choice ? "► " : "  ") + c.label;
        div.onclick = () => { d.choice = i; pickChoice(); };
        box.appendChild(div);
      });
      $("next").style.display = "none";
    } else {
      box.classList.remove("show");
      $("next").style.display = "block";
    }
    if (line.note) {
      G.footnote = line.note;
      $("footnote").textContent = "Jackdaw’s footnote: " + line.note;
      $("footnote").classList.add("show");
    } else {
      $("footnote").classList.remove("show");
    }
  }
  function advanceDialog() {
    const d = G.dialog;
    if (!d) return;
    const line = d.lines[d.i];
    if (line.choices) { pickChoice(); return; }
    d.i++;
    if (d.i >= d.lines.length) {
      closeDialog();
      if (d.after) d.after();
    } else renderDialog();
  }
  function pickChoice() {
    const d = G.dialog;
    const line = d.lines[d.i];
    const c = line.choices[d.choice];
    closeDialog();
    if (c.fn) c.fn();
  }
  function closeDialog() {
    G.dialog = null;
    G.mode = "explore";
    $("dialog").classList.remove("show");
    $("footnote").classList.remove("show");
  }

    if (G.flags.prophecy) {
      say([
        { who: "Jackdaw", text: "Still here? The prophecy will not fulfill itself, goat boy. Also, stop yawning at my sunrises." },
        { who: "Jackdaw", text: "Sir Roderick is posing somewhere photogenic. You might try talking to him. Or not. Narrators are famously unhelpful." }
      ]);
      return;
    }
    say([
      { who: "Jackdaw", text: "Hey, you! Yes, you with the drooping eyes. I saw you yawn. Don’t you like idyllic pastoral scenes?" },
      { who: "Jackdaw", text: "Fine. No more sunrises. Just a trio of country bumpkins with the best kind of adventure in store." },
      { who: "Jackdaw", text: "I have successfully deciphered… the Prophecy!", note: "Capital P. Ten points for a Chosen One, extra for a Dark Lord, and more for each capitalized noun." },
      { who: "Jackdaw", text: "“A great evil shall rise… unless the Hero of Legend shall vanquish this evil through courage, cunning, and undeniable good looks. This Hero shall rise from the valley and his name shall be Rod…”" },
      { who: "Jackdaw", text: "That’s it. The scroll trails off mid-sentence. I was simply preserving the character of the piece." },
      { who: "Squires", text: "Did you hear that, neighbors? Rod-something! Does that ring any bells?" },
      { who: "Bellissimo", text: "Roddy Squires, sub-assistant goat herder, hero of all the land? Doesn’t seem like much of a prospect." },
      { who: "Jackdaw", text: "Go on. Talk to the knight with the bleached horse. This is the part where destinies get messy." }
    ], () => {
      G.flags.prophecy = true;
      G.quest = "Talk to Sir Roderick 3RG about joining his quest. (He will be insufferable.)";
      save();
    });
  }

  function talkRoderick() {
    if (isB2()) return talkRoderickB2();
    if (!G.flags.prophecy) {
      say([{ who: "Sir Roderick 3RG", text: "Do you speak to all heroes like that? Come back when a prophecy is involved. I have damsels to schedule." }]);
      return;
    }
    say([
      { who: "Sir Roderick 3RG", text: "What about Sir Roderick the Really, Really, Really Great? That’s me, by the way. I shorten it to 3RG for peasants." },
      { who: "Squires", text: "Sir! I want to go with you. I’m eminently qualified. Mysterious orphan, short stature, shiny pendant, never left the valley…" },
      { who: "Sir Roderick 3RG", text: "Stop! You’re making my head hurt. I don’t do sidekicks, just front ones. Says so in my contract.", note: "The contract does contain a sidekick clause for times of great distress. He has not read that far." },
      { who: "Squires", text: "You’ll regret this! I’ll be a greater hero than you ever were!" },
      { who: "Jackdaw", text: "Which is proof that sometimes you don’t need strange candles to wax a bit prophetic. That’s four-shadowing." }
    ], () => {
      G.flags.rejected = true;
      G.flags.roderickGone = true;
      G.quest = "Leave Beanvale. Pity parties often meet on the east road.";
      save();
    });
  }

  function talkBell() {
    const lines = [
      { who: "Bellissimo", text: "He only rescues damsels in distress. Dis-stress. I threw myself in that puddle and he still galloped off." },
      { who: "Bellissimo", text: "There could have been alligators. Or really aggressive catfish." , note: "Only one documented death by catfish: Theopholis, rumored to have dragon blood." }
    ];
    if (G.flags.prophecy) lines.push({ who: "Bellissimo", text: "If you become a hero, try noticing the people standing right in front of you. My real name is Mary Sue Bellmont, by the way. Later." });
    say(lines);
  }

  function talkMordeck() {
    if (isEpi()) return talkMordeckEpi();
    if (isB6()) {
      say([
        { who: "Mordeck", text: "Bards. I have a column. It is louder than the harvest and less useful." },
        { who: "Mordeck", text: "If Merlin sent a letter, hide the good beans. Visiting wizards eat like prophecies." }
      ]);
      return;
    }
    if (isB7()) {
      say([
        { who: "Mordeck", text: "Gears. I have a column. It is twenty-one items long and none of them agree." },
        { who: "Mordeck", text: "If a ghost with goat legs asks for a briefing, file it under sequel. The harvest is not coming." }
      ]);
      return;
    }
    if (isB5()) {
      say([
        { who: "Mordeck", text: "Phoenixes, pies, and police. I have columns. None of them agree." },
        { who: "Mordeck", text: "If a giant is missing a left sock, that is not a new case. That is a sequel." }
      ]);
      return;
    }
    if (isB4()) {
      say([
        { who: "Mordeck", text: "Left socks. I have a column for that. It is longer than the column for dragons." },
        { who: "Mordeck", text: "If you find the missing halves, do not bring them here. The ledger is already full." }
      ]);
      return;
    }
    if (isB3()) {
      say([
        { who: "Mordeck", text: "The palace went quiet. I prefer a ledger that shouts. Quiet is expensive." },
        { who: "Mordeck", text: "If you’re collecting a squad, try not to name it in front of the statue. The statue already has a name." }
      ]);
      return;
    }
    if (isB2()) {
      say([
        { who: "Mordeck", text: "Taco Tuesday has consequences. I have them on the ledger. Also on the floor." },
        { who: "Mordeck", text: "If you’re hunting oxymorons, try not to let them eat the inventory. Beans are not a suggestion." }
      ]);
      return;
    }
    say([
      { who: "Mordeck", text: "Last time Jackdaw had big news, his beard broke the kingdom’s length record. Personally, I couldn’t give a bean." },
      { who: "Mordeck", text: "If the river fails, the beanstalks wither, and giants fall out of the sky. Try not to let that happen on a Tuesday." }
    ]);
  }

  function talkEllie() {
    if (isEpi()) {
      say([
        { who: "Ellie", text: "The Hero Call worked. I blew the ram’s horn. You tripped on a pebble. The harvest came back anyway." },
        { who: "Ellie", text: "Bean farmers are in the fields again. If another river dries up, I still have the horn. Try not to need it before lunch." }
      ]);
      return;
    }
    say([
      { who: "Ellie", text: "Any certified Hero is oath-bound to answer the Hero Call. I have the ram’s horn ready." },
      { who: "Ellie", text: "If Roderick doesn’t show, maybe we need a new hero. Don’t look at me. Look at the guy with goat smell and a prophecy." }
    ]);
  }

  function talkInn() {
    say([{
      who: "Innkeeper",
      text: "Welcome to the Hungry Hedgehog. Taco Tuesday leftovers, luna beans, and beds that only slightly smell of goat. Rest for 5 beans?",
      choices: [
        { label: "Rest (5 beans)", fn: () => {
          if (G.gold < 5) { say([{ who: "Innkeeper", text: "That’s not even a lima. Come back when you can give a bean." }]); return; }
          G.gold -= 5;
          G.party.forEach((p) => { p.hp = p.maxHp; p.mp = p.maxMp; });
          hud();
          say([{ who: "Innkeeper", text: "You sleep. Jackdaw narrates your dreams in footnotes. HP and MP restored." }]);
        }},
        { label: "Buy luna bean (8 beans)", fn: () => {
          if (G.gold < 8) { say([{ who: "Innkeeper", text: "No credit. This is a cash-bean establishment." }]); return; }
          G.gold -= 8;
          const it = G.inv.find((i) => i.id === "luna");
          if (it) it.n++; else G.inv.push({ id: "luna", n: 1 });
          hud();
          say([{ who: "Innkeeper", text: "Tastes terrible. Makes excellent board-game pieces. Also heals." }]);
        }},
        { label: "Just looking", fn: () => say([{ who: "Innkeeper", text: "If you see Sir Roderick, tell him his tab is still open. Heroes." }]) }
      ]
    }]);
  }

  function talkGrimbleMeet() {
    say([
      { who: "Grimblewaith", text: "What you lookin’ at, kid? Try working for a villain. That’ll make you count your blessings twice." },
      { who: "Squires", text: "There’s a prophecy about me. I’m supposed to take down the Lord of Darkness and foil his Master Plan." },
      { who: "Grimblewaith", text: "ELM always spoke of a Master Plan. He’s a jerk. He deserves a good foiling. I’ll be your… actor in a supporting role." },
      { who: "Grimblewaith", text: "First we see this wizard of yours. He lives on Mount Ominous. Don’t say the name too loudly. Thunder’s jumpy.", note: "Wizards live in high places because the H.O.M.E. Tome requires it. When it comes to magic, there’s no place like H.O.M.E." },
      { who: "Squires", text: "I know a mountain climbing song. It gets higher the higher you climb—" },
      { who: "Grimblewaith", text: "No." }
    ], () => {
      G.flags.grimble = true;
      G.flags.grimbleJoin = true;
      if (!G.party.find((p) => p.id === "grimble")) G.party.push(grimble());
      G.quest = "Climb Mount Ominous (northeast) and show Jackdaw the prophecy wasn’t upside-down.";
      save();
    });
  }

  function talkJackdawTower() {
    if (isB5()) {
      say([
        { who: "Jackdaw", text: "If you type Phoenixfinder.bean with a phonic, you get a lecture. I have given that lecture." },
        { who: "Jackdaw", text: "Joaquin wants sweets, not brimwort. Yeahrti wants quiet. Rightbeard wants the other sock. Try not to become faekind in a hallway." , note: "He will become faekind in a cavern. Hallways were a suggestion." }
      ]);
      return;
    }
    if (isB4()) {
      say([
        { who: "Jackdaw", text: "Pirates. I told you wells were worse. I was wrong. Unmatched laundry is worse." },
        { who: "Jackdaw", text: "If a skeletal bird asks for a song, sing. If a chest asks for a guess, do not. I have footnotes about both." , note: "Leftbeard collected only left socks. The right ones remain a domestic tragedy." }
      ]);
      return;
    }
    if (isB3()) {
      say([
        { who: "Jackdaw", text: "Wells. I told you wells were worse. One wish per person, blessing plus curse, and the well has a lawyer." },
        { who: "Jackdaw", text: "If you asked to be safe from lies, check whether your villain prefers the truth. I charge extra for that footnote." , note: "The Wunderwell is technically honest. That is the problem." }
      ]);
      return;
    }
    if (isB2()) return talkJackdawB2Tower();
    if (G.flags.quest) {
      if (G.flags.secretL && G.flags.secretE && G.flags.secretM) {
        say([
          { who: "Jackdaw", text: "Elisabeth Louisa Meriwether. Of course it is. ELM couldn’t even villain-name himself properly." },
          { who: "Jackdaw", text: "Roderick has been added to ELM’s statue collection. He makes a great doorstop. That leaves you, Roddy." },
          { who: "Jackdaw", text: "Go to the rally on the central hill. I’ll stall him with a singing duel. I soundly beat arias. He trounces ballads. Orkengwarf is a tie nobody wanted." }
        ], () => {
          G.flags.finale = true;
          G.quest = "Walk onto the golden P on the world map. Speak the Great Secret. Try not to aim.";
          G.party.forEach((p) => { p.hp = p.maxHp; p.mp = p.maxMp; });
          hud();
          save();
        });
        return;
      }
      say([
        { who: "Jackdaw", text: "Three pieces. Elves in the clump of trees south of the highway (they look like dwarves). Dwarves in the stone ring to the southeast (they look like giants). Goblins in the eastern caves (they like vegetables, mostly)." },
        { who: "Jackdaw", text: "If you hold my map upside-down, that is a you problem. The runic N is a 10,000-year tradition." }
      ]);
      return;
    }
    say([
      { who: "Jackdaw", text: "Ah. The goat herder and the unemployed Whatsit. Come in. Don’t sit on the cauldron." },
      { who: "Jackdaw", text: "ELM—lowercase dark lord, receding hairline, lives in an old troll latrine cave—joined the Viler Villains Society. He’s damming the enchanted river with a pebble." },
      { who: "Jackdaw", text: "No water, no magic beans, no Beandom. The Great Secret can unmake him. It is split among elves, dwarves, and goblins, because of course it is." },
      { who: "Jackdaw", text: "Bring me all three parts. Try not to die. If you do, I shall narrate it wittily." }
    ], () => {
      G.flags.quest = true;
      G.quest = "Collect the Great Secret: elves in the southern trees, dwarves in the SE stone ring, goblins in the eastern caves.";
      G.inv.push({ id: "magic", n: 2 });
      save();
    });
  }

  function talkElf() {
    if (G.flags.secretL) {
      say([{ who: "Elder Elf", text: "The first part remains Louisa. Wrong answers still become trees. Cobbler is doing a moss fresco of a dragon. You’ve seen it." }]);
      return;
    }
    say([
      { who: "Squires", text: "I’ve never eaten with dwarves before!" },
      { who: "Elder Elf", text: "We’re elves, of course. We live in mountains, ski, and hold records for snow-angel wingspan. The cookie elves are a different union." },
      { who: "Elder Elf", text: "To obtain our part of the Great Secret, you must answer the Riddle of Ages." }
    ], () => {
      say([{
        who: "Elves",
        text: "Peter Piper picked a peck of pickled peppers… If Peter Piper picked a peck of pickled peppers, where’s the peck of pickled peppers Peter Piper picked?",
        choices: [
          { label: "In the basement, probably. (Grimble)", fn: () => say([
            { who: "Elder Elf", text: "Incorrect. Traditionally we would turn you into trees. Today I am feeling merciful and merely disappointed." },
            { who: "Squires", text: "Let me try. Peppers can’t be pickled until after you pick them!" }
          ], giveLouisa) },
          { label: "Peppers can’t be pickled until after you pick them.", fn: giveLouisa },
          { label: "A dragon did it. The moss told me.", fn: () => say([
            { who: "Elder Elf", text: "Moss prophecy is a C.O.W.S. technique, not an elven one. Try thinking with your mouth for once." }
          ], talkElf) }
        ]
      }]);
    });
  }
  function giveLouisa() {
    say([
      { who: "Elder Elf", text: "Yes! And how much wood could a woodchuck chuck if a woodchuck could chuck wood?" },
      { who: "Squires", text: "A woodchuck would chuck as much as he could chuck if a woodchuck could chuck wood." },
      { who: "Elder Elf", text: "I would also have accepted 253 square feet. The first part of the Great Secret is… Louisa!" },
      { who: "Grimblewaith", text: "Louisa who?" },
      { who: "Elder Elf", text: "It will all become clear when you have the other two pieces. Wrong answers become trees. That’s why there are so many." }
    ], () => {
      G.flags.secretL = true;
      updateQuestSecrets();
      save();
    });
  }

  function talkDwarf() {
    if (G.flags.secretE) {
      say([{ who: "Dwarven Elder", text: "Our part is Elisabeth. The champion is in a coma and will later found a habitat for fuzzy creatures. Watch your step." }]);
      return;
    }
    say([{ who: "Dwarven Elder", text: "We do not part with the Great Secret lightly. You must defeat our champion. Also, we do not all like dirt and axes. Stereotypes are exhausting." }]);
  }
  function talkChamp() {
    say([
      { who: "Champion", text: "WHO WILL FIGHT ME?" },
      { who: "Squires", text: "You said you were dwarves! He’s a giant!" },
      { who: "Dwarven Elder", text: "You probably think we like to dig in the dirt, too." }
    ], () => startBattle([enemy("champ")], { canFlee: false, boss: true, onWin: dwarfWin }));
  }
  function dwarfWin() {
    say([
      { who: "Dwarven Elder", text: "Your clumsiness overcame your fear. You have a great gift." },
      { who: "Squires", text: "Of clumsiness? That’s a curse." },
      { who: "Dwarven Elder", text: "Do not discount your abilities. The secret is… Elisabeth!" }
    ], () => {
      G.flags.secretE = true;
      updateQuestSecrets();
      save();
    });
  }

  function talkHob() {
    if (G.flags.secretM) {
      say([{ who: "Chieftain", text: "Meriwether. Now go. We have meat, ale, and a game that is definitely not Duck, Duck, Goose." }]);
      return;
    }
    say([
      { who: "Hobgoblin", text: "Did you come for dinner?" },
      { who: "Squires", text: "We didn’t come AS dinner, if that’s what you mean." },
      { who: "Grimblewaith", text: "Goblins don’t eat people. They rather like their vegetables. Also I have no idea what I am. Whatsit is a working title." },
      { who: "Chieftain", text: "Family first. Then secrets. Sit. Endure the Johnnybeans. The last part of the Great Secret is… Meriwether!" }
    ], () => startBattle([enemy("goblin"), enemy("hob")], { canFlee: true, onWin: goblinWin }));
  }
  function goblinWin() {
    say([
      { who: "Squires", text: "Elisabeth Louisa Meriwether. What kind of secret is that?" },
      { who: "Grimblewaith", text: "I think I’m going to stay. I have catching up to do with my family. Who’s up for Goblin, Goblin, Hobgoblin?" },
      { who: "Squires", text: "I’ll come back when I’m a big-shot hero. Maybe." }
    ], () => {
      G.flags.secretM = true;
      G.party = G.party.filter((p) => p.id !== "grimble");
      const s = G.party[0];
      if (s) { s.hp = s.maxHp; s.mp = s.maxMp; }
      updateQuestSecrets();
      save();
    });
  }

  function talkElmLair() {
    say([
      { who: "ELM", text: "Ah! The morning mail! Grimblewaith, go fetch—oh. You’re not him. Membership in the Viler Villains Society is not a visitor’s pass." },
      { who: "ELM", text: "Dastardly list: 1) stench demon 2) orphanage 3) imprison a damsel 4) evil laughing lessons." },
      { who: "Jackdaw", text: "His laugh is two parts chuckle, one part whooping cough, pinch of evil. Understatement of the Year. I checked." }
    ], () => startBattle([enemy("hench"), enemy("hench")], { onWin: () => {
      G.gold += 20;
      say([{ who: "ELM", text: "You’ll never stop the pebble! Also, stop saying my name like it’s a gardener’s." }]);
    }}));
  }

  function talkElmRally() {
    if (!(G.flags.secretL && G.flags.secretE && G.flags.secretM)) {
      say([{ who: "ELM", text: "Swear allegiance by sundown or you’ll never see another drop of enchanted water. Your hero is a doorstop." }]);
      return;
    }
    say([
      { who: "ELM", text: "Quiet! You may only compliment me or insult my enemies. Sneezes must be incorporated." },
      { who: "Squires", text: "Oh great one, did you achoo-se your own name?" },
      { who: "ELM", text: "That wasn’t a compliment! Who in the beanstalk are you?" }
    ], () => startBattle([enemy("elm")], { canFlee: false, boss: true, heal: true, onWin: elmWin }));
  }
  function elmWin() {
    say([
      { who: "Squires", text: "Just an underling, Elisabeth. Nice middle name, too. Louisa. And M… for Meriwether." },
      { who: "ELM", text: "Minions, take him away—! Mother—" },
      { who: "Wormtoe", text: "I always knew you were a pathetic crybaby. The pebble still blocks the river. Only the one who placed it—or someone who moves it by accident—can free the water." },
      { who: "Squires", text: "Look out. No one can beat my powers of acidentiality." }
    ], () => {
      G.flags.elmDown = true;
      G.quest = "Trip. Fall. Save the Beandom by accident.";
      save();
    });
  }

  function talkWorm() {
    say([{ who: "Wormtoe", text: "Ten tries, ten bruised toes. That pebble doesn’t care about prophecies." }],
      () => startBattle([enemy("worm")], { canFlee: false, boss: true, heal: true, onWin: wormWin }));
  }
  function wormWin() {
    say([
      { who: "Wormtoe", text: "No, not water! What a cruel world!" },
      { who: "Jackdaw", text: "Actually, it’s quite a wonderful world, and you’ll be seeing much more of it… as a goat!" },
      { who: "Crowd", text: "Three cheers for the hero!" },
      { who: "Jackdaw", text: "They will unveil a statue. Grimble will complain. I have exactly seventy words and a vacation tower with indoor plumbing." }
    ], () => {
      G.flags.wormDown = true;
      G.flags.saved = true;
      G.quest = "Attend the statue unveiling. Ignore Mordeck’s epic poetry.";
      G.map = "village";
      G.px = 16; G.py = 8;
      hud();
      save();
      say([
        { who: "Mordeck", text: "FREE FOOD AND ALE FOR ALL! …Now that I have your attention: a statue of Roddy Squires, who I would not have bet a bean on." },
        { who: "Jackdaw", text: "Henceforth the Meriwethers revert to Michelle, Petronella, Theodora, and Kumquat. Rutabaga, quixotic, anthropomorphic." },
        { who: "ELM", text: "Don’t you dare end with an H.E.A. It’s so cliché. End it properly." },
        { who: "Jackdaw", text: "Very well. And many of them lived reasonably happy for some time thereafter." },
        { who: "Jackdaw", text: "There are six more days in this wonderful week—ogres, wells, pirates, phoenixes, bards, and the end of the quest as we know it. But this, goat boy, is your statue. Well done." }
      ], () => {
        G.flags.credits = true;
        G.mode = "credits";
        G.creditT = 0;
        $("hud").classList.remove("show");
        $("dialog").classList.remove("show");
        save();
      });
    });
  }

  function talkEnding() {
    say([{ who: "Mordeck", text: "One statue per world-saving victory. House policy. Now eat something before the elves start a food chant." }]);
  }

  function talkMordeckEpi() {
    if (G.flags.epiStatue) {
      say([
        { who: "Mordeck", text: "FREE FOOD AND ALE remains in effect. If the elves start a food chant, I am not translating." },
        { who: "Mordeck", text: "Jackdaw still owes the statue a shorter speech. I would not have bet a bean on you. I am eating that sentence with gravy." }
      ]);
      return;
    }
    say([
      { who: "Mordeck", text: "FREE FOOD AND ALE FOR ALL! …Now that I have your attention: a statue of Roddy Squires, who I would not have bet a bean on." },
      { who: "Mordeck", text: "The river runs. The beans remember how to be magical. If an ogre asks about the harvest, I still have the pitchfork." },
      { who: "Squires", text: "I tripped. The pebble moved. I am not sure that is a technique." },
      { who: "Mordeck", text: "House policy: one statue per world-saving accident. Eat something. Then let Jackdaw ruin the ending on purpose." }
    ], () => {
      G.flags.epiStatue = true;
      G.quest = "Jackdaw has seventy words and a refusal to say happily ever after.";
      save();
    });

  function talkJackdawEpi() {
    if (!G.flags.epiStatue) {
      say([{ who: "Jackdaw", text: "Mordeck first. He paid for the statue. I am only here for the ending, and I will not start until the ale has a witness." }]);

    }
    if (G.flags.epiJackdaw) {
      say([
        { who: "Jackdaw", text: "Mother Merry’s cottage is the northeast gap. Shortcakes. A husband who is no longer landscaping. Do not offer household advice." },
        { who: "Jackdaw", text: "I have used my seventy words. Indoor plumbing is waiting. The sequel can find its own narrator." , note: "It will not. I am contractually the sequel." }
      ]);
      return;
    }
    say([
      { who: "Jackdaw", text: "Henceforth the Meriwethers revert to Michelle, Petronella, Theodora, and Kumquat. Rutabaga, quixotic, anthropomorphic." , note: "I cursed the names. I un-cursed the names. The footnotes remain cursed." },
      { who: "Jackdaw", text: "Mr. Meriwether is a man again. Permanently. Mother Merry has shortcakes and a tilted cottage. Visit before I spend my remaining words on plumbing." },
      { who: "ELM", text: "Don’t you dare end with an H.E.A. It’s so cliché. End it properly." },
      { who: "Jackdaw", text: "Very well. And many of them lived reasonably happy for some time thereafter." },
      { who: "Jackdaw", text: "That is the ending. The mountain still wants a visit. Northeast gap. Do not skip the matriarch. She kept this family standing while I was being clever." }
    ], () => {

      G.quest = "Visit Mother Merry’s mountain cottage (northeast). Shortcakes are not optional.";
      save();
    });

  function talkBellEpi() {
    say([
      { who: "Bellissimo", text: "They spelled your name right. They did not spell mine on anything. I am still not a damsel." },
      { who: "Bellissimo", text: "If the next quest involves a bell, that is me. I will be napping until then. Wake me with tacos, not a horn." }
    ]);
  }

  function talkGrimbleEpi() {
    say([
      { who: "Grimblewaith", text: "A statue. Of you. I did the supporting. The sculptor did the standing around." },
      { who: "Grimblewaith", text: "ELM is still a jerk. He is also at the buffet. I am counting that as character development." }
    ]);
  }

    }

      return;
    }
    say([

      { who: "Jackdaw", text: "If you scramble the alphabet I will narrate your failure in iambic disappointment." }
    ], () => bestPuzzle(0));
  }

  function bestPuzzle(step) {
    const opts = [
      { label: "Blood (a drop from the Beanbearer)", id: 0 },
      { label: "Essence (breath)", id: 1 },
      { label: "Sweat (from the brow)", id: 2 },
      { label: "Tears (Roderick, tell a sad story)", id: 3 }
    ];
    const names = ["Blood", "Essence", "Sweat", "Tears"];
    const ordered = [opts[step], ...opts.filter((o) => o.id !== step)];
    say([{
      who: "BEST Spell",
      text: step === 0 ? "First ingredient?" : step === 1 ? "The sprout doubled. Next?" : step === 2 ? "Taller than Bell. Next?" : "The stalk wants the last letter.",
      choices: ordered.map((o) => ({
        label: o.label,
        fn: () => {
          if (o.id !== step) {
            say([{ who: "Jackdaw", text: "Alphabetical. B-E-S-T. I named it so you would not improvise. From the top." }], () => bestPuzzle(0));
            return;
          }
          if (step < 3) {
            if (step === 3) {}
            if (step === 2) {
              say([{ who: "Sir Roderick 3RG", text: "Once I was trapped as a statue. It was very moving. For everyone except me." }], () => bestPuzzle(3));
              return;
            }
            bestPuzzle(step + 1);
            return;
          }
          G.flags.b2best = true;
          G.flags.b2giant = true;
          G.quest = "You are a giant. The One Bean wants a queen. Take it to the lava of Mount Ominous instead.";
          save();
          say([
            { who: "Jackdaw", text: "House-wide stalk. Head in the clouds. The ring enlarged you. Try not to step on Beanvale." },
            { who: "The One Bean", text: "Come to the crater. We should discuss thrones." }
          ], () => warp("crater", 5, 4));
        }
      }))
    }]);
  }

      { who: "Squires", text: "Cry: Rod Squad, accumulate! Then: Charge!" },
      { who: "Sir Roderick 3RG", text: "I will allow the name. Once. Do not put it on a banner." },
      { who: "Squires", text: "Goat-Goat is already trotting in spirit. Grimblewaith is on the east road. Officer Glocke is clocking destiny in the square. I am coming." , note: "He named the goat twice so nobody could forget the goat." }

      G.flags.b3rod = true;

  function talkElegantia() {
    say([
      { who: "Elegantia", text: "I am a truth-serpent. I do not hiss lies. You want a quest because peace bores you. Bellissimo is waiting. Sirsi already told you both of those." },
      { who: "Sir Roderick 3RG", text: "I prefer my truths with more trumpets." },
      { who: "Elegantia", text: "The Eye Bean sees. The Needler needles. Director Misterssippi has the file. Do not pet me. I am not a pet. I am a briefing." , note: "Truth-serpents are union. Applause is extra." }
    ]);
  }

  function talkMisterssippi() {
    if (G.flags.b3ebi) {
      say([
        { who: "Director Misterssippi", text: "Eye Bean sprites: Ferdinand for nav, MaW, Otto, Newstrodamus, and Sirsi on SMS. They will message you. You will pretend that is normal." },
        { who: "Director Misterssippi", text: "The Wunderwell is west, in Hornfang. One wish. Read the inscription. Twice." }
      ]);
      return;
    }
    say([
      { who: "Director Misterssippi", text: "Sir Roderick the Really, Really, Really Great. We have a file. We also have standards. Try to meet one of them." },
      { who: "Director Misterssippi", text: "Nathaniel Nadle, the Needler. Former victim of a knight who charged first. He speaks painful truths until people kneel. He is most wanted. You are most available." },
      { who: "Director Misterssippi", text: "Take the Eye Bean. The Intelligent Trolls packed Ferdinand, MaW, Otto, Newstrodamus, and Sirsi. The Wunderwell is west, grove gap, Hornfang. One wish per person. Confirm the wording." , note: "The EBI files people alphabetically, except for knights, who file themselves under Impressive." }
    ], () => {
      G.flags.b3ebi = true;
      give("eyebean");
      give("file");
      G.quest = "Wunderwell, west grove gap. Read the inscription. Talk to Michelle before you wish.";

    });
  }

  function talkMichelle() {
    if (G.flags.b3marble) {
      say([
        { who: "Miss Marble", text: "I wished my father well. The well heard marble. Then the family. I make a good shield. I make a terrible hug." },
        { who: "Miss Marble", text: "If a glass thing starts throwing volleys, stand behind me. I do not flinch. I cannot flinch." }
      ]);
      return;
    }
    say([
      { who: "Michelle", text: "I wished my father would be safe. The well made him stone. Then the rest of us. I am Michelle. I think I am becoming Miss Marble." },
      { who: "Sir Roderick 3RG", text: "A curse. I shall avenge—" },
      { who: "Michelle", text: "Avenge later. Read the inscription. Confirm the wording. One wish per person. Blessing and curse. I am still coming. I am excellent at not flinching." , note: "The well is precise. Mercy is not a recognized unit of precision." }
    ], () => {
      G.flags.b3marble = true;
      G.quest = "Wish at the Wunderwell. Confirm the wording. The well has a lawyer.";
      save();
    });
  }

  function talkWunderwell() {
    if (G.flags.b3wish) {
      say([{ who: "Wunderwell", text: "One wish per person. You already spent yours on a pep talk and a hide. The invoice is the hide." }]);
      return;
    }
    if (!G.flags.b3marble) {
      say([
        { who: "Inscription", text: "Blessing and curse. One wish per person. Confirm the wording." },
        { who: "Jackdaw", text: "Someone named Michelle is staring at the water as if it already answered. Talk to her first. I like my knights pre-warned." }
      ]);
      return;
    }
    say([
      { who: "Sir Roderick 3RG", text: "I wish for confidence against the Needler. Protection from his lies. I wish to have this." },
      { who: "Wunderwell", text: "You’ve got this." },
      { who: "Sir Roderick 3RG", text: "That was brisk. Also I appear to be growing dark scales." },
      { who: "Jackdaw", text: "You asked to be safe from lies. The Needler speaks painful truths. The well is technically honest. That is the problem." , note: "Thick skin is useful against needles. It is less useful against accurate character assessments." }
    ], () => {
      G.flags.b3wish = true;
      G.quest = "Return to Beanvale. Squires is naming a squad. Glocke is clocking destiny.";
      save();
    });
  }

  function talkPriscilla() {

  function talkGolem() {

      say([{ who: "Gate", text: "Glass dust. The palace doors are open. Priscilla’s egg remains. Guard it." }]);
      return;

    if (!squadReady()) {
      say([
        { who: "Glass Golem", text: "(a mirror with opinions and too many lances)" },
        { who: "Sir Roderick 3RG", text: "I shall charge—" },
        { who: "Squires", text: "We need the whole Rod Squad. My list is unfortunately complete. Marble, pixie, Whatsit, goat, Dragonborn, me. Then: accumulate." }
      ]);
      return;
    }
    say([
      { who: "Squires", text: "Rod Squad, accumulate!" },
      { who: "Sir Roderick 3RG", text: "Charge." },
      { who: "Glass Golem", text: "(the palace wears a reflection and does not move)" }
    ], () => startBattle([enemy("golem")], { canFlee: false, boss: true, heal: true, onWin: () => {
      say([
        { who: "Miss Marble", text: "Volleys become pebbles. I do not flinch." },
        { who: "Priscilla", text: "Call me Rezella." },
        { who: "Narrator", text: "Blue fire, then white. The lances run. She does not get back up. Her egg remains." },
        { who: "Goat-Goat", text: "(the G.O.A.T. goat finds the core and is not impressed)" },
        { who: "Sir Roderick 3RG", text: "We will guard it. That is not a speech. That is a vow. I am practicing vows." }
      ], () => {
        G.flags.b3golem = true;

  function talkNeedler() {
    if (G.flags.b3needler) {
      say([{ who: "Palace", text: "Nathaniel Nadle is gone. The lunar orb is powder. The palace can be loud again." }]);
      return;
    }
    say([
      { who: "Nathaniel Nadle", text: "Sir Roderick the Really, Really, Really Great. You charged. People knelt. I learned the rest from the sound of it." },
      { who: "Nathaniel Nadle", text: "I do not need to lie. The palace is already quiet. Felgarath lent me a moon. The werefolk are listening." },
      { who: "Sir Roderick 3RG", text: "You’ve got this." }
    ], () => startBattle([enemy("needler")], { canFlee: false, boss: true, heal: true, onWin: () => {
      G.flags.b3needler = true;
      G.flags.b3done = true;
      G.flags.b3bell = true;
      G.quest = "Sleep in. Book IV involves pirates, which is louder.";
      save();
      say([
        { who: "Sir Roderick 3RG", text: "You’ve got this. One at a time. The werefolk first. Then the room. Then you." },
        { who: "Bellissimo", text: "That was a proposal. I heard a proposal in there." },
        { who: "Sir Roderick 3RG", text: "Mary Sue Bellmont. Yes. Stay. Guard Priscilla’s egg. That is the vow. I will try wisdom. I have notes." },
        { who: "Bellissimo", text: "I said yes. I will guard her egg. I will also cook. That is also the vow." },
        { who: "Nathaniel Nadle", text: "Needles, then. If the scales drink them, the moon still hangs." },
        { who: "Lunar Orb", text: "(Felgarath’s fake moon does not survive a knight who has finally aimed)" },
        { who: "Jackdaw", text: "And many of them lived reasonably happy for some time thereafter. Felgarath is already clearing his throat about pirates." , note: "Book IV: Leftbeard’s Treasure. Try not to wish for it." }
      ], () => {
        G.mode = "credits";
        G.creditT = 0;
        $("hud").classList.remove("show");
        $("dialog").classList.remove("show");
        save();
      });
    }}));
  }

  function talkMunchausen() {
    if (G.flags.b4rva) {
      say([
        { who: "Count Munchausen", text: "It’s never too late to change direction. I put it on a mug. The dogs knock the mug over. The motto survives." },
        { who: "Count Munchausen", text: "Sir Ruprecht has the ledger. Productive mischief. Elevated tomfoolery. No ruined villages." }
      ]);
      return;
    }
    say([
      { who: "Count Munchausen", text: "Welcome to Recovering Villains Anonymous. I am Count Munchausen. One brown eye, one yellow. The dogs are larger than the agenda." },
      { who: "ELM", text: "I am tired of failed conquest. I am not ready to become cheerful. Or respectable. Or cape-less." },
      { who: "Count Munchausen", text: "Good. I do not recruit imitations of Sir Roderick. Redirect what you already are. It’s never too late to change direction." },
      { who: "Count Munchausen", text: "The Day Questing Agency handles problems celebrity heroes ignore. Sir Ruprecht 2RG is at the bar. He looks like a knight who took a second job, because he did." , note: "V.I.C.E. minutes are taken. Attendance is optional. Relapse into world domination is discouraged." }
    ], () => {
      G.flags.b4rva = true;
      G.quest = "Sir Ruprecht 2RG at the bar. Ask for a quest that does not require a prophecy.";
      save();
    });

  function talkRuprecht() {
    if (!G.flags.b4rva) {
      say([{ who: "Sir Ruprecht 2RG", text: "Ledger’s closed until Munchausen finishes the motto. House policy. Also I am pouring." }]);
      return;
    }
    if (G.flags.b4dqa) {
      say([
        { who: "Sir Ruprecht 2RG", text: "Left socks. Entire realm. Nothing else taken. Leftbeard, if the rumors still have a peg leg." },
        { who: "Sir Ruprecht 2RG", text: "Everyone who knew the hiding place is dead. That is a research problem. I am a bartender. I recommend a necromancer." }
      ]);
      return;
    }
    say([
      { who: "Sir Ruprecht 2RG", text: "Day Quest Administration. I am Sir Ruprecht the Really Great. I shortened it to 2RG. The 3RG already had the trumpets." },
      { who: "Sir Ruprecht 2RG", text: "Case: left socks disappearing throughout the Beandom. Rights remain. Victims are hopping. The pattern is pirate-shaped." },
      { who: "ELM", text: "I require a quest with a positive mark. Also a dramatic entrance. Those are compatible if nobody writes a hymn." },
      { who: "Sir Ruprecht 2RG", text: "Recover Leftbeard’s Treasure. Return the socks. Do not become a dark lord about it. The ledger is very large. Try not to steal it until later." , note: "He will steal it later. The ledger knows." }
    ], () => {
      G.flags.b4dqa = true;
      G.quest = "A light is hovering near the locket shelf. Phantasms hate being ignored.";
      save();
    });

  function talkFannie() {
    if (G.flags.b4fannie) {
      say([
        { who: "Fannie", text: "I can be what you remember. A finch. A shrimp. A song. Ask first. Memories have opinions." },
        { who: "Fannie", text: "The locket says Complete. I am practicing being a person who fits inside that word." }
      ]);
      return;
    }
    say([
      { who: "Fannie", text: "(a small hovering ball of bright light, dimming when shy, blazing when curious)" },
      { who: "Fannie", text: "I am a phantasm. I copy remembered forms. I would like a home that is not a rumor." },
      { who: "ELM", text: "Family locket. Bean-shaped. Tarnished on purpose. The inscription is Complete. Do not make it a metaphor." },
      { who: "Fannie", text: "I will scout. I will become inconvenient animals. I already remember a pirate shanty I have not been asked to sing yet." , note: "She will be asked. Leftbird is union." }
    ], () => {
      G.flags.b4fannie = true;
      give("locket");
      G.quest = "Cinder is pretending to be severe in the corner. Summoning her is optional. Survival is not.";

  function talkCinder() {
    if (G.flags.b4cinder) {
      say([
        { who: "Cinder", text: "Pink underneath. Black on purpose. I plotted islands. The EBI is guarding something worse than socks." },
        { who: "Cinder", text: "South of the trees: your grandmother’s circus. Then the bay. I will make a rainbow. You will pretend you did not miss me." }
      ]);
      return;
    }
    say([
      { who: "Cinder", text: "You did not call. I interpreted that as rejection and then came anyway. That is called loyalty. Also poor planning." },
      { who: "ELM", text: "The book has an incantation. The incantation has sparkles. I have a reputation." },
      { who: "Cinder", text: "I scouted. Satyrs, a blockade, a wreck painted half black and half white. I can teleport you in pink. You will complain. I will do it anyway." },
      { who: "Cinder", text: "Three-Bean Circus, south of the trees on the world map. Recruit Grimma. Then the bay. When I throw a rainbow, the plan has started." , note: "Nymphs in black spikes are still nymphs. The pink leaks." }
    ], () => {
      G.flags.b4cinder = true;
      G.quest = "Leave by the south door. Three-Bean Circus, south of the trees. Yeast is involved. Do not be brave about bread.";
      save();
    });
  }

  function talkGrimma() {
    if (G.flags.b4grimma) {
      say([{ who: "Grimma", text: "Walking bread is ready. Satyrs will chase it. I will wake something with a duck’s head. Try to keep your socks." }]);
      return;
    }
    say([{
      who: "Madame Grimes",
      text: "Beanling Brothers. Death magic. Seasonal spectacle. I am your grandmother. The riddle is in the yeast. What raises the bread after it has been buried?",
      choices: [
        { label: "Yeast (and death magic)", fn: () => grimmaJoin() },
        { label: "Hope", fn: () => say([{ who: "Madame Grimes", text: "Hope does not brown at four hundred degrees. Try an ingredient." }], () => talkGrimma()) },
        { label: "A very motivational speech", fn: () => say([{ who: "Madame Grimes", text: "I left the Viler Villains Society’s toastmasters years ago. Yeast." }], () => talkGrimma()) }
      ]
    }]);
  }
  function grimmaJoin() {
    say([
      { who: "Grimma", text: "Correct. Walking bread: fritters, cookies, pies. Yeast and a graveyard. Everyone who knew Leftbeard’s map is dead. I consider that a filing system." },
      { who: "ELM", text: "I need a sea-born distraction and a grandmother who does not mind being called Grimma." },
      { who: "Grimma", text: "Grimma, then. The EBI bay is south, beside the puddles. I will raise the bread. Cinder will raise the satyrs. You will raise your eyebrows. That is the foil-proof plan." }
    ], () => {
      G.flags.b4grimma = true;
      join(grimmaHero());
      G.quest = "EBI bay, south puddles. Rainbow, bread, Quacken. Cinder hates goodbyes she has not scheduled.";
      save();
    });
  }

  function talkQuacken() {
    if (G.flags.b4quacken) {
      say([{ who: "Shore", text: "The Quacken has requested a vacation. The destination is not recorded. Grimma considers that wise." }]);
      return;
    }

      say([{ who: "The Quacken", text: "(a rumble that wants to be a quack and has not been invited yet)" }]);
      return;
    }
    say([
      { who: "Cinder", text: "Rainbow up. Satyrs in. Agents confused. Fannie is cycling phoenix and Jumbo Shrimp because of course she is." },
      { who: "Grimma", text: "The duck-headed one is next. It has been between life and death, which is my specialty." },
      { who: "The Quacken", text: "(the bay remembers a blockade and would like a second opinion)" }
    ], () => startBattle([enemy("quacken")], { canFlee: false, boss: true, heal: true, onWin: () => {
      say([
        { who: "Cinder", text: "The blockade is breaking. I can get you across. I—" },
        { who: "Narrator", text: "The water takes the rest of the sentence. Pink sparks go out like a lantern in rain. She does not get a second cue." },
        { who: "Fannie", text: "I can hold a piece of her. In the locket. Not enough. Enough to deliver a message later." },
        { who: "The Quacken", text: "(a tentacle, carefully. a vacation, afterward.)" },
        { who: "Grimma", text: "Misfit Island. Hold on. Do not name the duck." }
      ], () => {

  }

  function talkRonchi() {

    say([
      { who: "Ronchi", text: "Misfits. I can tell. Local law would like you to stay permanently. We have a village, a harbor, and a category problem." },

      { who: "Ronchi", text: "Leftbeard’s ship is grounded. Half black, half white. You may search it. Treasure is communal. If you find a portal, we will pretend we discussed that." , note: "Misfit Island is a preserve for creatures who did not fit their paperwork." }
    ], () => {

      say([{ who: "Leftbird", text: "Chute for the stars. Down the hatch. The door remembers you. Try not to guess chests." }]);

    }
    say([{
      who: "Leftbird",

  function talkMimic() {
    if (G.flags.b4mimic) return;
    say([
      { who: "Leftbird", text: "Look for the crew." },
      { who: "Fannie", text: "Not sailors. Crew socks. Scarlet. White L’s. The rest are hungry furniture." },
      { who: "Grimma", text: "And that pod is the Vile Seed. I have been waiting to be Death for a very long time." },
      { who: "Mimic Chests", text: "(six nesting boxes that used to be a captain and a crew)" }
    ], () => startBattle([enemy("mimic")], { canFlee: false, boss: true, heal: true, onWin: () => {

        { who: "Grimma", text: "The Seed is crushed. I am ash. If Death has an inner circle, I am already late for it." },

  function talkLeftbeard() {
    if (G.flags.b4done) {
      say([{ who: "Captain Leftbeard", text: "The Cinder is yours. Return the socks. Steal the ledger if you must. Anti-hero is a perfectly respectable category." }]);
      return;

  function startBattle(enemies, opts = {}) {
    if (opts.boss) {
      G.party.forEach((p) => {
        p.mp = p.maxMp;
        if (opts.heal) p.hp = p.maxHp;
      });
      hud();
    }
    G.mode = "battle";
    G.battle = {
      foes: enemies,
      i: 0,
      menu: "main",
      sel: 0,
      target: 0,
      log: opts.boss ? "A dramatic sting would play here. Imagine one." : "A wild nuisance approaches!",
      canFlee: opts.canFlee !== false,
      onWin: opts.onWin,
      guard: {},
      anim: 0,
      over: false
    };
    $("battle").classList.add("show");
    $("hud").classList.add("show");
    blitBattleMenu();
    sfx("enc");
  }

  function blitBattleMenu() {
    const b = G.battle;
    $("bLog").textContent = b.log;
    const acts = $("bActs");
    acts.innerHTML = "";
    let opts = [];
    if (b.menu === "main") {
      opts = ["Attack", "Skill", "Item"];
      if (b.canFlee) opts.push("Flee");
      if (b.foes.some((f) => f.spr === "elm" && f.hp > 0) && G.flags.secretL && G.flags.secretE && G.flags.secretM) {
        opts.unshift("The Great Secret");
      }
      if (b.foes.some((f) => f.spr === "worm" && f.hp > 0)) {
        opts.unshift("Acidentiality");
      }
      if (b.foes.some((f) => f.spr === "lg" && f.hp > 0)) opts.unshift("Edible Oxymoron");
      if (b.foes.some((f) => f.spr === "prawn" && f.hp > 0) && G.flags.b2elm) opts.unshift("Kayak");
      if (b.foes.some((f) => f.spr === "dead" && f.hp > 0) && G.flags.b2slad) opts.unshift("Handyvamp Irony");
      if (b.foes.some((f) => f.spr === "ox" && f.hp > 0)) opts.unshift("Jokes of the Fathers");
      if (b.foes.some((f) => f.spr === "golem" && f.hp > 0)) {
        const gs = b.gstep || 0;
        if (gs === 0) opts.unshift("Rock Beats Glass");
        else if (gs === 1) opts.unshift("Call Her Rezella");
        else opts.unshift("Goat-Goat Charge");
      }
      if (b.foes.some((f) => f.spr === "needler" && f.hp > 0)) {
        const ns = b.nstep || 0;
        if (ns === 0) opts.unshift("You’ve Got This");
        else if (ns === 1) opts.unshift("Thick Skin");
        else opts.unshift("Smash the Lunar Orb");
      }
      if (b.foes.some((f) => f.spr === "quacken" && f.hp > 0)) {
        const qs = b.qstep || 0;
        if (qs === 0) opts.unshift("Rainbow Signal");
        else if (qs === 1) opts.unshift("Walking Bread");
        else opts.unshift("Release the Quacken");
      }
      if (b.foes.some((f) => f.spr === "mimic" && f.hp > 0)) {
        const ms = b.mstep || 0;
        if (ms === 0) opts.unshift("Crew Sock");
        else if (ms === 1) opts.unshift("Crush the Vile Seed");
        else opts.unshift("Bright Magic");
      }
      if (b.foes.some((f) => f.spr === "sand" && f.hp > 0)) opts.unshift("Spill the Canteen");
      if (b.foes.some((f) => f.spr === "hydra" && f.hp > 0)) opts.unshift("Do Not Taste the Sample");
      if (b.foes.some((f) => f.spr === "slug" && f.hp > 0)) opts.unshift("Salt Swords");
      if (b.foes.some((f) => f.spr === "fell" && f.hp > 0)) opts.unshift("Name the Alpaca Lips");
      if (b.foes.some((f) => f.spr === "rupboard" && f.hp > 0)) opts.unshift("Take Your Turn");
      if (b.foes.some((f) => f.spr === "dem" && f.hp > 0)) {
        const ds = b.dstep || 0;
        if (ds === 0) opts.unshift("Request the Golden Harp");
        else if (ds === 1) opts.unshift("Dragonbond");
        else opts.unshift("Dark Merlin Bird");
      }
      if (b.foes.some((f) => f.spr === "troll" && f.hp > 0)) opts.unshift("Ask the Halflings");
      if (b.foes.some((f) => f.spr === "organ" && f.hp > 0)) opts.unshift("Fae-Pop");
      if (b.foes.some((f) => f.spr === "precht" && f.hp > 0)) opts.unshift("Pelican’s Compass");
      if (b.foes.some((f) => f.spr === "nether" && f.hp > 0)) {
        const ns = b.netherstep || 0;
        if (ns === 0) opts.unshift("Launch Plan V");
        else if (ns === 1) opts.unshift("Name King Magnus");
        else opts.unshift("Collect the Debt");
      }
      if (b.foes.some((f) => f.spr === "orc" && f.hp > 0) && isEpi()) opts.unshift("Pitchfork Policy");
    } else if (b.menu === "skill") {
      const p = G.party[b.i];
      opts = p.skills.map((id) => SKILLS[id].name + " (" + SKILLS[id].mp + " MP)");
      if (p.id === "squires" && G.flags.secretL && G.flags.secretE && G.flags.secretM && G.battle.foes.some((f) => f.spr === "elm"))
        opts.push("The Great Secret (0 MP)");
      opts.push("Back");
    } else if (b.menu === "item") {
      opts = G.inv.map((it) => ITEMS[it.id].name + " x" + it.n);
      opts.push("Back");
    } else if (b.menu === "target") {
      opts = b.foes.map((f, i) => (f.hp <= 0 ? "(down) " : "") + f.name + "  " + f.hp + "/" + f.maxHp);
      opts.push("Back");
    }
    opts.forEach((o, i) => {
      const d = document.createElement("div");
      d.className = "act" + (i === b.sel ? " on" : "");
      d.textContent = (i === b.sel ? "► " : "  ") + o;
      d.onclick = () => { b.sel = i; confirmBattle(); };
      acts.appendChild(d);
    });
    b.opts = opts;
  }

  function confirmBattle() {
    const b = G.battle;
    if (!b || b.over) return;
    const p = G.party[b.i];
    if (!p) return;
    if (b.menu === "main") {
      const c = b.opts[b.sel];
      if (c === "The Great Secret") { b.pending = { type: "skill", id: "secret" }; resolvePlayer(); return; }
      else if (c === "Acidentiality") { b.pending = { type: "skill", id: "accident" }; resolvePlayer(); return; }
      else if (c === "Edible Oxymoron") { b.pending = { type: "skill", id: "oxymoron" }; resolvePlayer(); return; }
      else if (c === "Kayak") { b.pending = { type: "skill", id: "kayak" }; resolvePlayer(); return; }
      else if (c === "Handyvamp Irony") { b.pending = { type: "skill", id: "irony" }; resolvePlayer(); return; }

  function dmg(atk, def) {

  function irand(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

  function nextBattler() {
    const b = G.battle;
    b.menu = "main"; b.sel = 0; b.pending = null;
    b.i++;
    while (b.i < G.party.length && G.party[b.i].hp <= 0) b.i++;
    if (b.i >= G.party.length) {
      enemyTurns();
    } else blitBattleMenu();
  }

  function enemyTurns() {
    const b = G.battle;
    const msgs = [];
    b.foes.forEach((f) => {
      if (f.hp <= 0) return;
      if (f.stun > 0) { f.stun--; msgs.push(f.name + " is too busy howling at a hangnail."); return; }
      if (f.confuse > 0) { f.confuse--; msgs.push(f.name + " watches Squires’ dance and forgets to attack."); return; }
      const alive = G.party.filter((p) => p.hp > 0);
      if (!alive.length) { msgs.push(f.name + " stands over the fallen."); return; }
      const t = alive[irand(0, alive.length - 1)];
      if (f.spr === "needler" && (b.nstep || 0) >= 2) {
        msgs.push("Needles skitter off dark scales. Nathaniel looks professionally offended.");
        return;
      }
      let n = dmg(f.atk, t.def);
      if (b.guard[t.id]) n = Math.max(1, Math.floor(n / 2));
      if (f.spr === "needler" && (b.nstep || 0) >= 1) n = Math.max(1, Math.floor(n / 2));
      t.hp -= n;
      msgs.push(f.spr === "needler"
        ? "Nathaniel Nadle kneels " + t.name + " with a sentence. " + n + " damage."
        : f.name + " hits " + t.name + " for " + n + ".");
    });
    b.guard = {};
    b.log = msgs.join(" ");
    hud();
    if (G.party.every((p) => p.hp <= 0)) {
      b.log = "You slump into the beans. Jackdaw clears his throat. “That was not the prophecy I had in mind.”";
      blitBattleMenu();
      setTimeout(() => {
        endBattle(false);
        G.party.forEach((p) => { p.hp = Math.max(1, Math.floor(p.maxHp / 2)); });
        say([{ who: "Jackdaw", text: "I rewound that with the Clairvoyant Crystal 3001. Don’t get used to it. Try a luna bean and less heroics." }]);
      }, 900);
      return;
    }
    b.i = 0;
    while (G.party[b.i].hp <= 0) b.i++;
    blitBattleMenu();
  }

  function checkWin() {
    const b = G.battle;
    if (b.foes.every((f) => f.hp <= 0)) {
      const gold = b.foes.reduce((s, f) => s + f.gold, 0);
      G.gold += gold;
      b.log = "Victory! +" + gold + " beans (currency). The crowd would sing if this weren’t a book.";
      b.over = true;
      blitBattleMenu();
      sfx("win");
      setTimeout(() => endBattle(true), 700);
      return true;
    }
    return false;
  }
  function tryFlee() {
    if (Math.random() < 0.6) { G.battle.log = "You fled. Squires trips, but in a useful direction."; endBattle(false); }
    else { G.battle.log = "Couldn’t run. Two left feet."; enemyTurns(); }
  }
  function endBattle(won) {
    const cb = G.battle && G.battle.onWin;
    G.battle = null;

  function drawMap() {
    const m = MAPS[G.map];
    if (!m) return;
    G.camX = G.px * T - W / 2 + 8;
    G.camY = G.py * T - H / 2 + 8;
    G.camX = Math.max(0, Math.min(m.w * T - W, G.camX));
    G.camY = Math.max(0, Math.min(m.h * T - H, G.camY));
    const bg = G.map === "tower" || G.map === "ebi" || G.map === "palace" || G.map === "fey" || G.map === "wreck" || G.map === "bpd" || G.map === "web" || G.map === "mafaea" ? "#0c1230"
      : (G.map === "cave" || G.map === "lair" || G.map === "pub" || G.map === "swamp" || G.map === "crater" || G.map === "vault" || G.map === "oasis") ? "#120c14"
      : (G.map === "arena" || G.map === "circus" || G.map === "gates" || G.map === "beanshow" || G.map === "butte" || G.map === "pie") ? "#3a3428"
      : G.map === "lake" || G.map === "well" || G.map === "bay" || G.map === "misfit" || G.map === "snow" ? "#4a7aaa"
      : "#87b";
    col(bg); r(0, 0, W, H);
    const x0 = Math.max(0, (G.camX / T) | 0);
    const y0 = Math.max(0, (G.camY / T) | 0);
    const x1 = Math.min(m.w, x0 + 18);
    const y1 = Math.min(m.h, y0 + 16);
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      drawTile(tileAt(G.map, x, y), x * T - G.camX, y * T - G.camY, G.t);
    }
    const sprites = npcsFor().map((n) => ({ kind: n.sprite, x: n.x * T - G.camX, y: n.y * T - G.camY, z: n.y, bang: questBang(n) }));
    const lead = (G.party[0] && G.party[0].id === "bell") ? "bell"
      : (G.party[0] && G.party[0].id === "roderick") ? "roderick"
      : (G.party[0] && G.party[0].id === "elm") ? "elm"
      : (G.party[0] && G.party[0].id === "grimble") ? "grimble"
      : (G.party[0] && G.party[0].id === "jackdaw") ? "jackdaw"
      : "squires";
    sprites.push({ kind: lead, x: G.px * T - G.camX, y: G.py * T - G.camY, z: G.py, me: true });
    if (G.mode === "explore" && G.party[1]) {
      const fid = G.party[1].id;
      const kind = fid === "grimble" ? "grimble" : fid === "roderick" ? "roderick" : fid === "elm" ? "elm" : fid === "squires" ? "squires" : fid === "bell" ? "bell" : fid === "grimma" ? "grimma" : fid === "oz" ? "oz" : fid === "petra" ? "petra" : fid === "jackdaw" ? "jackdaw" : null;
      if (kind) {
        const ox = [0, -6, 0, 6][G.dir], oy = [8, 0, -8, 0][G.dir];
        sprites.push({ kind, x: G.px * T - G.camX + ox, y: G.py * T - G.camY + oy, z: G.py - 0.1 });
      }
    }
    sprites.sort((a, b) => a.z - b.z);
    sprites.forEach((s) => {
      drawChar(s.kind, s.x, s.y, G.dir, ((G.walk | 0) % 2), true);
      if (s.bang) {
        col(PAL.gold); r(s.x + 6, s.y - 6, 4, 6); col(PAL.navy); r(s.x + 7, s.y - 5, 2, 3); r(s.x + 7, s.y - 1, 2, 1);
      }
    });
  }

  function drawTitle(t) {
    col("#0b1024"); r(0, 0, W, H);
    for (let i = 0; i < 18; i++) {
      col(PAL.grass); r(0, 140 + i * 5, W, 5);
      col(PAL.grass2); r(i * 20 + (t / 8) % 20, 148, 3, 2);
    }
    for (let i = 0; i < 8; i++) drawTile("beans", 16 + i * 28, 160, t);
    drawChar("jackdaw", 40, 88, 2, 0, true);
    drawChar("squires", 118, 110, 1, (t / 12) & 1, true);
    drawChar("grimble", 148, 108, 3, 0, true);
    drawChar("bell", 188, 100, 2, 0, true);
    drawChar("roderick", 210, 92, 3, 0, true);
    col(PAL.gold); r(70, 28, 116, 2); r(70, 72, 116, 2);
  }

  function drawBattleBack() {
    col("#1a1040"); r(0, 0, W, 140);

    const b = G.battle;
    if (!b) return;
    b.foes.forEach((f, i) => {
      if (f.hp <= 0) return;
      const x = 90 + i * 40 - (b.foes.length - 1) * 16;
      const y = 48 + Math.sin((G.t + i * 12) / 10) * (f.spr === "skip" ? 4 : 1);
      drawChar(f.spr, x, y, 2, (G.t / 10) & 1, true);
      col("#000"); r(x, y + 20, 16, 3);
      col(PAL.hp); r(x, y + 20, Math.max(0, 16 * f.hp / f.maxHp), 3);
    });
    G.party.forEach((p, i) => {
      if (p.hp <= 0) return;
      drawChar(p.id === "grimble" ? "grimble" : p.id === "bell" ? "bell" : p.id === "roderick" ? "roderick" : p.id === "elm" ? "elm" : p.id === "grimma" ? "grimma" : p.id === "oz" ? "oz" : p.id === "jackdaw" ? "jackdaw" : p.id === "petra" ? "petra" : "squires", 40 + i * 28, 100, 1, 0, true);

  /* ---------- audio ---------- */
  let ac, master, tuneT = 0;
  function audioInit() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain();
    master.gain.value = 0.08;
    master.connect(ac.destination);
  }
  function beep(freq, dur, type, vol) {
    if (G.mute || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol || 0.2;
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function sfx(kind) {
    if (kind === "hit") beep(180, .08, "square");
    if (kind === "magic") { beep(440, .1); beep(660, .12, "triangle"); }
    if (kind === "enc") { beep(220, .1); setTimeout(() => beep(180, .12), 80); }
    if (kind === "win") { beep(523, .1); setTimeout(() => beep(659, .1), 90); setTimeout(() => beep(784, .18), 180); }
    if (kind === "warp") beep(300, .06, "triangle");
    if (kind === "ok") beep(520, .05, "square", .12);
  }
  const THEME = [392, 440, 494, 523, 494, 440, 392, 330, 349, 392, 0, 392, 523, 494];
  function music() {
    if (G.mute || !ac || G.mode === "battle") return;
    if (G.t % 18 === 0) {
      const n = THEME[(tuneT++) % THEME.length];
      if (n) beep(n, 0.16, "triangle", 0.07);
    }
  }

  function save() {
    const data = {
      map: G.map, px: G.px, py: G.py, flags: G.flags, gold: G.gold, inv: G.inv,
      party: G.party, quest: G.quest, dir: G.dir, day: G.day || 1
    };
    localStorage.setItem(SAVE, JSON.stringify(data));
  }
  function load() {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return false;
    try {
      const d = JSON.parse(raw);
      Object.assign(G, { map: d.map, px: d.px, py: d.py, flags: d.flags, gold: d.gold, inv: d.inv, party: d.party, quest: d.quest, dir: d.dir || 2, day: d.day || 1 });
      return true;
    } catch (e) { return false; }
  }

  /* ---------- input ---------- */
  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) e.preventDefault();
    if (e.key === "m" || e.key === "M") toggleMute();
    if (G.mode === "dialog") {
      if (G.dialog && G.dialog.lines[G.dialog.i].choices) {
        if (e.key === "ArrowUp") G.dialog.choice = Math.max(0, G.dialog.choice - 1);
        if (e.key === "ArrowDown") G.dialog.choice = Math.min(G.dialog.lines[G.dialog.i].choices.length - 1, G.dialog.choice + 1);
        renderDialog();
      }
      if (e.key === "Enter" || e.key === " ") advanceDialog();
      return;
    }
    if (G.mode === "battle") {
      const b = G.battle;
      if (e.key === "ArrowUp") b.sel = Math.max(0, b.sel - 1);
      if (e.key === "ArrowDown") b.sel = Math.min(b.opts.length - 1, b.sel + 1);
      if (e.key === "ArrowLeft") b.sel = Math.max(0, b.sel - 2);
      if (e.key === "ArrowRight") b.sel = Math.min(b.opts.length - 1, b.sel + 2);
      if (e.key === "Enter" || e.key === " ") confirmBattle();
      if (e.key === "Escape") { b.menu = "main"; b.sel = 0; blitBattleMenu(); }
      blitBattleMenu();
      return;
    }
    if (e.key === "Enter" || e.key === " ") interact();
    if (e.key === "Escape" && G.mode === "explore") openMenu();
    else if (e.key === "Escape" && G.mode === "menu") { $("menu").classList.remove("show"); G.mode = "explore"; }
  });
  window.addEventListener("keyup", (e) => { keys[e.key] = false; });

  document.querySelectorAll("[data-k]").forEach((el) => {
    const down = (ev) => { ev.preventDefault(); keys[el.dataset.k] = true; if (el.dataset.k === "Enter") interact(); if (el.dataset.k === "Escape" && G.mode === "explore") openMenu(); };
    const up = () => { keys[el.dataset.k] = false; };
    el.addEventListener("pointerdown", down);
    el.addEventListener("pointerup", up);
    el.addEventListener("pointerleave", up);
  });

  $("btnNew").onclick = startNew;
  $("btnBook2").onclick = startBook2;
  $("btnBook3").onclick = startBook3;
  $("btnBook4").onclick = startBook4;
  $("btnBook5").onclick = startBook5;
  $("btnBook6").onclick = startBook6;
  $("btnBook7").onclick = startBook7;
  $("btnEpi").onclick = startEpilogue;
  $("btnCont").onclick = continueGame;
  $("btnMute").onclick = toggleMute;
  $("btnSave").onclick = () => { save(); $("mBody").insertAdjacentHTML("afterbegin", "<p style='color:var(--gold)'>Saved in this browser.</p>"); };
  $("btnClose").onclick = () => { $("menu").classList.remove("show"); G.mode = "explore"; };
  $("btnTitle").onclick = () => { save(); $("menu").classList.remove("show"); showTitle(); };
  canvas.addEventListener("click", () => { if (G.mode === "title") startNew(); else interact(); });
  $("dialog").addEventListener("click", (e) => {
    if (e.target.closest(".choice")) return;
    if (G.mode === "dialog") advanceDialog();
  });

  function toggleMute() {
    G.mute = !G.mute;
    $("btnMute").textContent = "Sound: " + (G.mute ? "Off" : "On");
    if (!G.mute) audioInit();
  }

  /* ---------- loop ---------- */
  function tick() {
    G.t++;
    if (G.mode === "explore") {
      let dx = 0, dy = 0;
      if (keys.ArrowUp || keys.w || keys.W) dy -= 1;
      if (keys.ArrowDown || keys.s || keys.S) dy += 1;
      if (keys.ArrowLeft || keys.a || keys.A) dx -= 1;
      if (keys.ArrowRight || keys.d || keys.D) dx += 1;
      if (dx || dy) tryMove(dx, dy);
    }
    if (G.mode === "title") drawTitle(G.t);
    else if (G.mode === "credits") { G.creditT++; drawCredits(G.creditT); }
    else if (G.mode === "battle") { drawBattleBack(); }
    else drawMap();
    music();
    requestAnimationFrame(tick);
  }

  showTitle();
  tick();
  window.__WQ = {
    G,
    cell: playerCell,
    talk: interact,
    warp,
    save,
    load,
    blocked: (x, y) => blocked(G.map, x, y),
    mapSize: () => {
      const m = MAPS[G.map];
      return { w: m ? m.w : 0, h: m ? m.h : 0, id: G.map };
    },
    startBook2,
    startBook3,
    startBook4,
    startBook5,
    startBook6,
    startBook7,
    startEpilogue
  };
})();
</script>
</body>
</html>
