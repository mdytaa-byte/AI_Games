<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Launch Time — 16-bit RPG</title>
  <style>
    :root {
      --navy: #1a1430;
      --gold: #e8c85a;
      --pale: #fff4c4;
      --purple: #9b5cff;
      --ink: #0a0714;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #05030a; color: var(--pale);
      font-family: "Courier New", Courier, ui-monospace, monospace;
      overflow: hidden; user-select: none; touch-action: none;
    }
    #wrap {
      position: absolute; inset: 0; display: grid; place-items: center;
    }
    #stage {
      position: relative; image-rendering: pixelated; image-rendering: crisp-edges;
      box-shadow: 0 0 0 3px #2a1a4a, 0 0 0 6px #e8c85a, 0 18px 50px rgba(155,92,255,.35);
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #hud { z-index: 4; } #goal { z-index: 4; }
    #dialog { z-index: 40; }
    #titleUI, #endingUI { z-index: 20; }
    #pause { z-index: 30; } #battle { z-index: 35; }
    .overlay {
      position: absolute; inset: 0; display: none; pointer-events: none;
    }
    .overlay.show { display: block; }
    #titleUI, #endingUI {
      pointer-events: auto;
      background:
        radial-gradient(circle at 50% 28%, rgba(155,92,255,.35), transparent 42%),
        linear-gradient(#12081f, #070510 58%, #140a28);
      color: var(--pale); text-align: center; padding: 18px 16px 12px;
    }
    #titleUI h1, #endingUI h1 {
      margin: 0; font-size: 28px; letter-spacing: .16em; color: #ffe58a;
      text-shadow: 3px 3px 0 #4a1d86, -1px 0 #9b5cff;
    }
    #titleUI .sub { margin: 6px 0 16px; color: #c9b4ff; font-size: 11px; letter-spacing: .08em; }
    .menu-btn {
      pointer-events: auto; display: block; width: min(280px, 86%); margin: 7px auto;
      padding: 8px 10px; border: 3px solid var(--gold); background: linear-gradient(#3a1f78, #1a0d3a);
      color: var(--pale); font: 700 13px "Courier New", monospace; letter-spacing: .08em;
      cursor: pointer; text-shadow: 2px 2px #000;
    }
    .menu-btn:hover, .menu-btn:focus { filter: brightness(1.25); outline: none; }
    #dialog {
      position: absolute; left: 6px; right: 6px; bottom: 6px; min-height: 58px;
      border: 3px solid var(--gold); background: rgba(10,7,20,.94); color: var(--pale);
      padding: 7px 10px 8px; font-size: 12px; line-height: 1.35; pointer-events: auto;
      text-shadow: 1px 1px #000; display: none;
    }
    #dialog.show { display: block; }
    #dialog .who { color: var(--gold); font-weight: 700; letter-spacing: .06em; }
    #dialog .next { position: absolute; right: 8px; bottom: 4px; color: var(--gold); animation: blink 1s steps(2) infinite; }
    #hud {
      position: absolute; left: 6px; top: 6px; right: 6px; display: none; pointer-events: none;
      font-size: 10px; text-shadow: 1px 1px #000;
    }
    #hud.show { display: flex; justify-content: space-between; gap: 8px; }
    .hud-card {
      border: 2px solid #e8c85a; background: rgba(12,8,28,.86); padding: 4px 7px; min-width: 108px;
    }
    .hpbar { height: 5px; background: #2a2038; margin-top: 3px; }
    .hpbar > i { display: block; height: 100%; background: linear-gradient(#7dff9a, #1f9a4a); }
    .hpbar.low > i { background: linear-gradient(#ff7a62, #b41e2e); }
    #goal {
      position: absolute; left: 6px; right: 6px; top: 44px; display: none;
      font-size: 10px; color: #d7c6ff; text-shadow: 1px 1px #000; pointer-events: none;
    }
    #goal.show { display: block; }
    #pause, #battle, #journal {
      position: absolute; inset: 0; display: none; pointer-events: auto;
      background: rgba(4,2,10,.72);
    }
    #pause.show, #battle.show { display: grid; place-items: center; }
    #journal.show { display: grid; place-items: center; z-index: 32; }
    #journal .panel { width: min(340px, 94%); max-height: 92%; display: flex; flex-direction: column; }
    #journal .jlist {
      overflow: auto; max-height: 148px; margin: 6px 0; border: 2px solid #4a3068;
      background: #0a0618; padding: 4px;
    }
    #journal .jitem {
      display: block; width: 100%; margin: 2px 0; padding: 5px 6px; border: 0;
      background: transparent; color: #fff4c4; font: 700 11px "Courier New", monospace;
      text-align: left; cursor: pointer;
    }
    #journal .jitem:hover, #journal .jitem:focus { background: #2a1850; }
    #journal .jitem.locked { color: #6a6080; cursor: default; }
    #journal .jbody {
      min-height: 64px; max-height: 88px; overflow: auto; font-size: 11px; line-height: 1.35;
      color: #e6dcff; margin-bottom: 6px;
    }
    #journal .jcount { color: #e8c85a; font-size: 11px; margin-bottom: 4px; }
    .panel {
      width: min(300px, 92%); border: 3px solid var(--gold); background: #120a22;
      padding: 10px; color: var(--pale); font-size: 12px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .1em; }
    .panel button, .blist button {
      display: block; width: 100%; margin: 4px 0; padding: 6px; border: 2px solid #c9a33a;
      background: #231547; color: var(--pale); font: 700 12px "Courier New", monospace; cursor: pointer; text-align: left;
    }
    .panel button:hover, .blist button:hover, .panel button:focus,
    .panel button.sel, .blist button.sel, .choice.sel, .jitem.sel {
      filter: brightness(1.2); outline: 2px solid #ffe58a;
    }
    .choice { display: block; width: 100%; margin: 5px 0; padding: 7px; border: 2px solid #9b5cff;
      background: #1b1036; color: #fff4c4; font: 700 12px "Courier New", monospace; cursor: pointer; text-align: left; }
    #battle .panel { width: min(340px, 94%); }
    .brow { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .bstat { flex: 1; border: 2px solid #6d4cff; padding: 5px; background: #0d0820; }
    .blist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    #mobile {
      display: none; position: absolute; left: 0; right: 0; bottom: 8px; height: 132px;
      pointer-events: none; justify-content: space-between; padding: 0 12px;
    }
    .pad, .ab { pointer-events: auto; }
    .pad { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; gap: 4px; }
    .pad b, .ab b {
      display: grid; place-items: center; border: 2px solid #e8c85a; background: rgba(30,16,64,.8);
      color: #fff4c4; font-size: 14px; font-weight: 700;
    }
    .pad b:nth-child(1), .pad b:nth-child(3), .pad b:nth-child(7), .pad b:nth-child(9) { visibility: hidden; }
    .ab { display: flex; gap: 10px; align-items: flex-end; }
    .ab b { width: 54px; height: 54px; border-radius: 50%; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 820px), (pointer: coarse) {
      #mobile { display: flex; }
      #wrap { align-items: start; padding-top: 8px; }
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="256" height="224"></canvas>
      <div id="hud"></div>
      <div id="goal"></div>
      <div id="dialog"><div class="who"></div><div class="txt"></div><div class="next">▼</div></div>
      <div id="titleUI" class="overlay show">
        <div style="height:54px"></div>
        <h1>LAUNCH TIME</h1>
        <div class="sub">BOOK I · A WONDERFUL WEEK FOR A LAUNCH</div>
        <p style="max-width:340px;margin:0 auto 14px;font-size:11px;line-height:1.45;color:#e6dcff">
          A 16-bit RPG from the novel by Michael D. Young, with footnotes by J.D. Zaubermann.
        </p>
        <button class="menu-btn" id="btnNew">NEW QUEST</button>
        <button class="menu-btn" id="btnContinue">CONTINUE</button>
        <button class="menu-btn" id="btnHow">HOW TO PLAY</button>
        <p style="margin-top:16px;font-size:10px;color:#9b8cc0">ARROWS / WASD MOVE · Z / SPACE CONFIRM · X MENU · Z STARTS A NEW QUEST</p>
      </div>
      <div id="endingUI" class="overlay">
        <h1>EXCELSIOR</h1>
        <div class="sub" id="endingSub">THE END OF BOOK I</div>
        <p id="endingText" style="max-width:360px;margin:10px auto 14px;font-size:11px;line-height:1.5;color:#e6dcff"></p>
        <button class="menu-btn" id="btnAgain">RETURN TO TITLE</button>
      </div>
      <div id="pause"></div>
      <div id="journal"></div>
      <div id="battle"></div>
    </div>
    <div id="mobile">
      <div class="pad">
        <b></b><b data-k="up">▲</b><b></b>
        <b data-k="left">◀</b><b></b><b data-k="right">▶</b>
        <b></b><b data-k="down">▼</b><b></b>
      </div>
      <div class="ab">
        <b data-k="menu">X</b>
        <b data-k="ok">Z</b>
      </div>
    </div>
  </div>

function mapFrom(rows) {
  const grid = rows.map((r) => r.split(""));
  return { w: grid[0].length, h: grid.length, grid };
}

function deep(o) { return JSON.parse(JSON.stringify(o)); }

function newState() {

function chapter() { return CHAPTERS[state.ch]; }
function curMap() { return MAPS[state.map]; }

function tileAt(px, py) {
  const m = curMap();
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (ty < 0 || tx < 0 || ty >= m.h || tx >= m.w) return "#";
  return m.grid[ty][tx];
}
function blocked(px, py) {
  const pts = [
    [px + 3, py + 10], [px + 12, py + 10],
    [px + 3, py + 15], [px + 12, py + 15]
  ];
  return pts.some(([x, y]) => BLOCK.has(tileAt(x, y)));
}

function say(who, text) {
  dialogQ.push({ who, text });
  if (!dialogEl.classList.contains("show")) nextLine();
}
function sayMany(lines, cb) {
  lines.forEach((l) => dialogQ.push({ who: l[0], text: l[1] }));
  dialogCb = cb || null;
  if (!dialogEl.classList.contains("show")) nextLine();
}
function nextLine() {
  if (typing.length < typeFull.length) {
    typing = typeFull;
    renderDialog();
    return;
  }
  const n = dialogQ.shift();
  if (!n) {
    dialogEl.classList.remove("show");
    typeFull = typing = "";
    const cb = dialogCb; dialogCb = null;
    if (cb) cb();
    return;
  }
  const actor = ACTORS[n.who] || { name: n.who };
  dialogEl.querySelector(".who").textContent = actor.name.toUpperCase();
  typeFull = n.text;
  typing = "";
  dialogEl.classList.add("show");
  renderDialog();
}
function renderDialog() {
  dialogEl.querySelector(".txt").textContent = typing;
}

function setGoal(t) {
  goalEl.textContent = t ? "QUEST: " + t : "";
  goalEl.classList.toggle("show", mode === "explore" && !!t);
}

function loadChapter(i, extraIntro) {
  state.ch = i;
  const ch = CHAPTERS[i];
  state.hero = ch.hero;
  state.map = ch.map;
  state.x = ch.spawn[0] * TS;
  state.y = ch.spawn[1] * TS;
  state.dir = "up";
  state.petraOut = false;
  if (ch.hero === "jd") { state.party = state.sergio ? ["jd", "sergio"] : ["jd"]; state.maxHp = 40 + state.lv * 4; }
  else { state.party = state.vincenza ? ["gary", "vincenza"] : ["gary"]; state.maxHp = 32 + state.lv * 3; }
  state.hp = state.maxHp;
  state.mp = state.maxMp;
  mode = "explore";
  titleUI.classList.remove("show");
  endingUI.classList.remove("show");
  pauseEl.classList.remove("show");
  battleEl.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(ch.goal);
  save();
  showTitleCard(ch, extraIntro);
}

function showTitleCard(ch, extraIntro) {
  mode = "card";
  const lines = [
    ["", "CHAPTER " + (state.ch + 1)],
    ["", ch.title],
    ...(ch.subtitle ? [["", ch.subtitle]] : []),
    ...ch.intro
  ];
  if (extraIntro) lines.push(...extraIntro);
  sayMany(lines, () => { mode = "explore"; });
}

function advanceChapter() {
  if (state.ch >= CHAPTERS.length - 1) {
    finishGame();
    return;
  }
  loadChapter(state.ch + 1);
}

function finishGame() {
  mode = "ending";
  hudEl.classList.remove("show");
  goalEl.classList.remove("show");
  const lines = [
    ["gary", "Vincenza? I was expecting... wait. We're married?"],
    ["vincenza", "I'd like to name him after my dad. His first name is Sergio."],
    ["jd", "Gary had awakened to the life he might have lived."],
    ["sergio", "The coordinates are confirmed. The Eagle's Roost. After that, Tatsrar."],
    ["gopat", "Adler's message suggests that we are already behind schedule."],
    ["jd", "Then there won't be anyone left to write Book Three."],
    ["jd", "Set course for the Eagle's Roost. Excelsior!"]
  ];
  if (state.flags.editorDone) {
    lines.splice(lines.length - 1, 0, ["jd", "And the footnotes stayed. All sixty-one of them. On principle."]);
  }
  sayMany(lines, () => {
    endingUI.classList.add("show");
    document.getElementById("endingText").textContent =
      "One piece of the Deus Ex Machina is ours. Fourteen remain. The Singhilarity is already racing toward Tatsrar. The mothership plunges into Middlespace. Book I is complete."
      + (state.flags.editorDone ? " The Unabridged Edition rides along in the satchel." : "");
    save();
  });
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.notes) s.notes = {};
    return s;
  } catch (e) { return null; }
}

function noteCount() {
  if (!state || !state.notes) return 0;
  return FOOTNOTES.reduce((n, fn) => n + (state.notes[fn.id] || state.notes[String(fn.id)] ? 1 : 0), 0);
}
function allNotesFound() { return noteCount() === FOOTNOTES.length; }
function noteAt(tx, ty) {
  return FOOTNOTES.find((fn) => fn.map === state.map && fn.x === tx && fn.y === ty && !(state.notes[fn.id] || state.notes[String(fn.id)]));
}
function pigeonTile() {
  const m = curMap();
  const taken = new Set(FOOTNOTES.filter((f) => f.map === state.map).map((f) => f.x + "," + f.y));
  for (let y = m.h - 2; y >= 1; y--) {
    for (let x = 1; x < m.w - 1; x++) {
      if (!BLOCK.has(m.grid[y][x]) && !taken.has(x + "," + y)) return { x, y };
    }
  }
  return { x: 2, y: 2 };
}
function collectNote(fn) {
  state.notes[fn.id] = true;
  save();
  const n = noteCount();
  const lines = [
    ["fn", "† " + n + " / " + FOOTNOTES.length + " — " + fn.title],
    ["fn", fn.text]
  ];
  if (n === FOOTNOTES.length && !state.flags.editorQuest) {
    state.flags.editorQuest = true;
    lines.push(["jd", "That's every margin. On principle. I believe I have earned a meeting."]);
    lines.push(["pigeon", "A skeletal pigeon flaps out of the Netherworld postal system, unencumbered by flesh, feathers, or patience."]);
    setGoal("Speak to the skeletal pigeon. The Editor will see you now.");
  } else {
    lines.push(["", "Filed in the journal (X, then JOURNAL)."]);
  }
  sayMany(lines);
}

function enterCopydesk() {
  state.returnTo = { map: state.map, x: state.x, y: state.y };
  state.map = "copydesk";
  state.x = 7 * TS;
  state.y = 8 * TS;
  state.dir = "up";
  state.flags.editorVisit = true;
  setGoal("Meet the Editor. Do not cut the footnotes.");
  sayMany([
    ["editor", "Seventeen pages. Cut them. Then we will talk."],
    ["jd", "I refused to do so on principle. I still refuse."]
  ]);
}

function leaveCopydesk() {
  const r = state.returnTo || { map: chapter().map, x: chapter().spawn[0] * TS, y: chapter().spawn[1] * TS };
  state.map = r.map;
  state.x = r.x;
  state.y = r.y;
  state.returnTo = null;
  save();
  setGoal(state.flags.editorDone ? chapter().goal : "The Unabridged Edition is yours. The main quest continues.");
}

function startEditorQuest() {
  sayMany([
    ["pigeon", "The Editor will see you now. Bring the footnotes. All of them."],
    ["jd", "I tried 'Take me to your editor' once. This time I brought seventeen pages and refused to leave them at the door."]
  ], () => enterCopydesk());
}

function talkEditor() {
  if (state.flags.editorDone) {
    say("editor", "Fine. Keep the margins. On principle. Now get off my copy desk.");
    return;
  }
  mode = "choice";
  showChoices([
    ["Refuse to cut a single footnote", () => {
      mode = "explore";
      sayMany([
        ["jd", "I refused on principle then. I refuse on principle now."],
        ["editor", "Then the red pen will have to do the cutting."]
      ], () => startBattle("editor", () => {
        state.flags.editorDone = true;
        give("unabridged");
        save();
        sayMany([
          ["editor", "Very well. The Unabridged Edition stands."],
          ["jd", "Margin notes with teeth. I think I'll keep this spell."],
          ["pigeon", "The Netherworld postal system stamps your journal COMPLETE."]
        ], () => leaveCopydesk());
      }));
    }],
    ["Offer to cut seventeen pages", () => {
      mode = "explore";
      say("jd", "Absolutely not. I only said that so you would hear how it sounds. The footnotes stay.");

function openJournal() {
  closeMenu();
  mode = "journal";
  const found = noteCount();
  const total = FOOTNOTES.length;
  const rows = FOOTNOTES.map((fn) => {
    const have = state.notes[fn.id] || state.notes[String(fn.id)];
    const label = have ? ("†" + fn.id + "  " + fn.title) : ("†" + fn.id + "  — uncollected —");
    return `<button class="jitem${have ? "" : " locked"}" data-id="${fn.id}">${label}</button>`;
  }).join("");
  const extra = state.flags.editorDone
    ? "Side quest complete: The Unabridged Edition."
    : (found === total ? "All footnotes filed. A skeletal pigeon is waiting." : "Optional. Hunt the gold daggers while you explore.");
  const questBtn = (found === total && !state.flags.editorDone)
    ? `<button id="jQuest">MEET THE EDITOR</button>` : "";
  journalEl.classList.add("show");
  journalEl.innerHTML = `<div class="panel">
    <h2>J.D.'S JOURNAL</h2>
    <div class="jcount">${found} / ${total} footnotes · ${extra}</div>
    <div class="jbody" id="jbody">Select a collected footnote to reread J.D.'s commentary.</div>
    <div class="jlist">${rows}</div>
    ${questBtn}
    <button id="jClose">CLOSE</button>
  </div>`;
  journalEl.querySelector("#jClose").onclick = closeJournal;
  const jq = journalEl.querySelector("#jQuest");
  if (jq) jq.onclick = () => { closeJournal(); startEditorQuest(); };
  journalEl.querySelectorAll(".jitem").forEach((btn) => {
    btn.onclick = () => {
      const fn = FOOTNOTES.find((f) => String(f.id) === btn.dataset.id);
      if (!fn || !(state.notes[fn.id] || state.notes[String(fn.id)])) return;
      journalEl.querySelector("#jbody").textContent = "† " + fn.title + " — " + fn.text;
    };
  });
  uiSel = 0;
  highlightSel();
}

  journalEl.classList.remove("show");

  if (mode === "journal") mode = "explore";
}

      ], () => startBattle("spark", () => {
        flags.fire = true;
        sayMany([
          ["vincenza", "What are you?"],
          ["gary", "Mr. Mercury said I come from a long line of sorcerers. I'm going to find him. We'll see how well he reacts to fire."]
        ], () => advanceChapter());
      }));
      return;
    }
  }

  if (ch.id === "ch9") {
    if (t === "$" || t === "w") {
      sayMany([
        ["", "Run magus 1.2?"],
        ["jd", "Yes. Run program."],
        ["gopat", "Hello. I am Gopat, your spell-crafting assistant. I prefer 'synthetic life-form' to A.I."],
        ["jd", "Find Rightbeard. Also known as E.L.M. Last seen... not in the Netherworld."],
        ["gopat", "Champ, I have an island. Latitude, longitude, the whole souvenir model."]
      ], () => { flags.magus = true; state.glove = true; advanceChapter(); });
      return;
    }
  }

  if (ch.id === "ch10") {
    if (t === "*" || t === "+" || t === "C") {
      state.map = "cave";
      state.x = 7 * TS; state.y = 8 * TS;
      sayMany([
        ["sibyl", "You speak like him. You have his look about you."],
        ["gary", "Who? Say his name."],
        ["sibyl", "Felgarath."]
      ], () => { flags.door = true; advanceChapter(); });
      return;
    }
  }

  if (ch.id === "ch11") {
    if (!flags.witch && (t === "+" || t === "*" || near(11, 5, 3))) {
      sayMany([
        ["beanwitch", "This is the Beandom, all right. After so many years, so much trying."],
        ["gopat", "Whoever sent this says you need to take your time traveler and have him touch the tree. Signed: Adler, the Great and Powerful."],
        ["rightbeard", "You'd better start believing in ghost stories... because you're in one."],
        ["rightbeard", "I'm not actually a ghost. I might as well be; I'm old enough."]
      ], () => startBattle("golem", () => {
        flags.witch = true;
        flags.rightbeard = true;
        say("beanwitch", "We've got a prophecy to untangle. I hear the pubs here are quite good.");
        advanceChapter();
      }));
      return;
    }
  }

  if (ch.id === "ch12") {
    if (t === "*" || t === "+") {
      sayMany([
        ["felgarath", "I shall be the root and you the branch."],
        ["vincenza", "Gary — don't —"]
      ], () => startBattle("felgarath", () => {
        flags.tree = true;
        sayMany([
          ["felgarath", "Now sleep. Descend with me into the darkest dreams."],
          ["jd", "Meanwhile, elsewhere, the living members of the new cast prepared a ship for a quest."]
        ], () => advanceChapter());
      }));
      return;
    }
  }

  if (ch.id === "ch13") {
    if (t === "A" || near(9, 4, 1)) {
      startBattle("treble", () => {
        sayMany([
          ["jd", "Gopat handles the sonic shield. Everyone stays close. No unnecessary sound."],
          ["gopat", "It is not ridiculously named. The Iso-Rambo-Dodecahedron of Silence is a precise technical designation."]
        ], () => startBattle("dragon", () => {
          flags.ship = true;
          sayMany([
            ["gopat", "This door is biometrically sealed. Registered owner: T.P."],
            ["jd", "Tiberius Plinth. The Blue Messenger."]
          ], () => advanceChapter());
        }));
      });
      return;
    }
  }

  if (ch.id === "ch14") {
    if (t === "P" || t === "B" || near(6, 4, 2)) {
      sayMany([
        ["tiberius", "You survived my dragon. Welcome. I am Tiberius Plinth, the Blue Messenger."],
        ["tiberius", "Dear Mercury. One of my more ambitious Earthside clients."],
        ["tiberius", "Sometimes, to get what you want, you must pay an arm and a leg."],
        ["jd", "Gopat! Laser sword! Now!"]
      ], () => startBattle("tiberius", () => {
        give("pipes"); give("crown");
        flags.blue = true;
        sayMany([
          ["jd", "Panpipes. A thin black crown with a single blue jewel."],
          ["sergio", "Drums are terribly cumbersome. I've always preferred something more portable."]
        ], () => advanceChapter());
      }));
      return;
    }
  }

  if (ch.id === "ch15") {
    if (t === "P" || near(6, 4, 1)) {
      sayMany([
        ["sergio", "The coordinates are confirmed. The Eagle's Roost. After that, Tatsrar."],
        ["jd", "How long until the Singhilarity reaches Tatsrar?"],
        ["gopat", "I don't have enough information to calculate that. Adler suggests we are already behind schedule."],
        ["jd", "I've been late to battles, coronations, weddings, and one particularly important dentist appointment."],
        ["sergio", "Course locked."],
        ["jd", "Excelsior!"]
      ], () => finishGame());
      return;
    }
  }

  const npc = npcHere();
  if (npc) { npc.talk(); return; }
  bumpFlavor();
}

function npcHere() { return null; }

function bumpFlavor() {
  const ch = chapter();
  const lines = {
    ch1: ["The purple shaft of light is still climbing. The car keys stay in the ignition — just in case."],
    ch2: ["Deadlines, deadlines, and more deadlines. The prophecy is not changing."],
    ch3: ["Freddie Mercury leaks through one ear of the Walkman. The other ear is a rumor."],
    ch4: ["The carpet is thick enough to swallow a man. The mercury symbol is everywhere."],
    ch5: ["The high score still belongs to D.M.Y. Someday J.D.W. will knock it off."],
    ch6: ["The apartment does not allow for much pacing. That has never stopped Gary."],
    ch7: ["Never get off at 2020. First rule of time travel."],
    ch8: ["The ship's flag looks like the tattoo. That cannot be a coincidence."],
    ch9: ["Cast, craft, or quench. Gopat is already humming."],
    ch10: ["No dock. Barely an island. A cave in the hill like a mouth."],
    ch11: ["The air smells like beans and old magic. Home, in the least convenient sense."],
    ch12: ["The tree's trunk is dark red with green veins. One of those leaves marked Gary's hand."],
    ch13: ["A ruined city under a sickly green sky. The trebles are warming up."],
    ch14: ["The hallway is bathed in blue light. Jewelry glints in the dark."],
    ch15: ["Ahead, a crack of white light opens on Middlespace."]
  }[ch.id];
  if (lines) say(state.hero, lines[0]);
}

function facingTile() {
  const dx = state.dir === "left" ? -16 : state.dir === "right" ? 16 : 0;
  const dy = state.dir === "up" ? -16 : state.dir === "down" ? 16 : 0;
  const px = state.x + 8 + dx, py = state.y + 12 + dy;
  return { t: tileAt(px, py), tx: Math.floor(px / TS), ty: Math.floor(py / TS) };
}
function isFloor(tile) {
  return !tile || tile === "." || tile === "," || tile === "=" || tile === "h";
}
function isStoryObj(tile) {
  return tile === "*" || tile === "$" || tile === "K" || tile === "A" || tile === "P" || tile === "C";
}
function usefulTile(tile) {
  return tile && !isFloor(tile) && tile !== "#" && !BLOCK.has(tile);
}
function near(tx, ty, r) {
  const px = Math.floor((state.x + 8) / TS), py = Math.floor((state.y + 12) / TS);
  return Math.abs(px - tx) <= r && Math.abs(py - ty) <= r;
}
function has(id) { return !!state.items[id]; }
function give(id, n) {
  state.items[id] = (state.items[id] || 0) + (n || 1);
}

function panelButtons() {
  if (mode === "battle") return [...battleEl.querySelectorAll("button")];
  if (mode === "pause" || mode === "choice") return [...pauseEl.querySelectorAll("button")];
  if (mode === "journal") return [...journalEl.querySelectorAll("button")];
  if (mode === "title") return [...titleUI.querySelectorAll("button")];
  if (mode === "ending") return [...endingUI.querySelectorAll("button")];
  return [];
}
function highlightSel() {
  const btns = panelButtons();
  if (!btns.length) return;
  uiSel = ((uiSel % btns.length) + btns.length) % btns.length;
  btns.forEach((b, i) => b.classList.toggle("sel", i === uiSel));
  if (btns[uiSel].scrollIntoView) btns[uiSel].scrollIntoView({ block: "nearest" });
}
function activateSel() {
  const btns = panelButtons();
  const b = btns[uiSel] || btns[0];
  if (b && !b.classList.contains("locked")) b.click();
}

function showChoices(opts) {
  pauseEl.classList.add("show");
  pauseEl.innerHTML = `<div class="panel"><h2>CHOOSE</h2>${opts.map((o, i) => `<button class="choice" data-i="${i}">${o[0]}</button>`).join("")}</div>`;
  [...pauseEl.querySelectorAll("button")].forEach((b, i) => {
    b.onclick = () => { pauseEl.classList.remove("show"); pauseEl.innerHTML = ""; opts[i][1](); };
  });
  uiSel = 0;
  highlightSel();
}

function openMenu() {
  if (mode !== "explore") return;
  mode = "pause";
  pauseEl.classList.add("show");
  const inv = Object.entries(state.items).filter(([, n]) => n).map(([k, n]) => {
    const it = ITEMS[k];
    return `${it ? it.name : k}${typeof n === "number" && n > 1 ? " x" + n : ""}`;
  }).join("<br>") || "(empty)";
  const prop = state.prophecy ? `<p style="color:#c9b4ff;font-size:11px">The blue screen approaches for all of existence. Collect the twelve and the three. Return to the site of the tree. The Singhilarity comes with Mercury's drums.</p>` : "";
  pauseEl.innerHTML = `<div class="panel">
    <h2>WATCH / PACK</h2>
    <div>LV ${state.lv}  HP ${state.hp}/${state.maxHp}  MP ${state.mp}/${state.maxMp}</div>
    ${prop}
    <p>${inv}</p>
    <button id="mJournal">JOURNAL (${noteCount()}/${FOOTNOTES.length})</button>
    <button id="mPetra">SUMMON PETRA (NAVY DOT)</button>
    <button id="mItem">USE COLA</button>
    <button id="mSave">SAVE QUEST</button>
    <button id="mClose">CLOSE</button>
  </div>`;
  pauseEl.querySelector("#mClose").onclick = closeMenu;
  pauseEl.querySelector("#mJournal").onclick = openJournal;
  pauseEl.querySelector("#mSave").onclick = () => { save(); closeMenu(); say("", "The watch ticks. Progress remembered."); };
  pauseEl.querySelector("#mItem").onclick = () => { useItem("coke"); closeMenu(); };
  pauseEl.querySelector("#mPetra").onclick = () => {
    closeMenu();
    if (state.hero !== "jd") { say("gary", "I don't have a watch full of ghosts. I have a Walkman with a short in the wire."); return; }
    state.petraOut = !state.petraOut;
    say("petra", state.petraOut ? "Always watching." : "Back to the Netherworld. Try not to start an orphanage-destroying scheme.");
  };
  uiSel = 0;
  highlightSel();
}
function closeMenu() {
  pauseEl.classList.remove("show");
  pauseEl.innerHTML = "";
  if (mode === "pause") mode = "explore";
}
function useItem(id) {
  if (!state.items[id]) { say("", "None left."); return; }
  const it = ITEMS[id];
  if (it && it.heal) {
    state.items[id]--;
    if (state.items[id] <= 0) delete state.items[id];
    state.hp = Math.min(state.maxHp, state.hp + it.heal);
    say("", it.name + "! HP restored.");
  }
}

function startBattle(id, onWin) {
  const src = ENEMIES[id];
  if (!src) { if (onWin) onWin(); return; }
  const foe = { ...src, hp: src.hp, max: src.hp, revealed: false };
  battle = { foe, onWin, log: foe.name + " appears!", menu: "main" };
  mode = "battle";
  uiSel = 0;
  renderBattle();
  beep(180, 0.08); beep(120, 0.12);
}

function renderBattle() {
  const b = battle;
  const revealed = b.foe.revealed ? `HP ${b.foe.hp}/${b.foe.max}  WEAK: ${b.foe.weak}` : `HP ???  WEAK: ???`;
  let extra = "";
  if (b.menu === "magic") {
    const list = heroSpells().map((id) => `<button data-sp="${id}">${SPELLS[id].name} (${SPELLS[id].mp} MP)</button>`).join("");
    extra = `<div class="blist">${list}<button data-back="1">BACK</button></div>`;
  } else if (b.menu === "item") {
    extra = `<div class="blist">
      <button data-it="coke">COLA</button>
      <button data-it="beans">VULCAN BEANS</button>
      <button data-back="1">BACK</button>
    </div>`;
  } else {
    extra = `<div class="blist">
      <button data-act="fight">FIGHT</button>
      <button data-act="magic">MAGIC</button>
      <button data-act="item">ITEM</button>
      <button data-act="run">RUN</button>
    </div>`;
  }
  battleEl.classList.add("show");
  battleEl.innerHTML = `<div class="panel">
    <div class="brow">
      <div class="bstat"><b>${ACTORS[state.hero].name}</b><br>HP ${state.hp}/${state.maxHp}<br>MP ${state.mp}/${state.maxMp}</div>
      <div class="bstat"><b>${b.foe.name}</b><br>${revealed}</div>
    </div>
    <div style="min-height:28px;color:#ffe58a;margin-bottom:6px">${b.log}</div>
    ${extra}
  </div>`;
  battleEl.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => battleAct(el.dataset.act));
  battleEl.querySelectorAll("[data-sp]").forEach((el) => el.onclick = () => castSpell(el.dataset.sp));
  battleEl.querySelectorAll("[data-it]").forEach((el) => el.onclick = () => battleItem(el.dataset.it));
  battleEl.querySelectorAll("[data-back]").forEach((el) => el.onclick = () => { battle.menu = "main"; uiSel = 0; renderBattle(); });
  uiSel = Math.min(uiSel, battleEl.querySelectorAll("button").length - 1);
  if (uiSel < 0) uiSel = 0;
  highlightSel();
}

function heroSpells() {
  if (state.hero === "gary") {
    const g = state.flags.leaf || state.flags.fire ? ["leaf", "confuse"] : ["confuse"];
    if (allNotesFound()) g.push("margin");
    return g;
  }
  const s = ["fireball", "quench", "prog"];
  if (state.glove) s.push("silence", "laser", "rabbit");
  if (allNotesFound()) s.push("margin");
  return s;
}

function battleAct(act) {
  if (!battle || battle.foe.hp <= 0) return;
  if (act === "magic") { battle.menu = "magic"; uiSel = 0; renderBattle(); return; }
  if (act === "item") { battle.menu = "item"; uiSel = 0; renderBattle(); return; }
  if (act === "run") {
    if (battle.foe.boss) { battle.log = "You cannot run from this."; renderBattle(); return; }
    endBattle(false);
    say("", "Escaped!");
    return;
  }
  if (act === "fight") playerHit(6 + state.lv, 10 + state.lv, "A solid hit.");
}

function playerHit(lo, hi, msg, weakBonus) {
  if (!battle || battle.resolved || battle.foe.hp <= 0) return;
  let dmg = lo + Math.floor(Math.random() * (hi - lo + 1));
  dmg = Math.max(1, dmg - battle.foe.def);
  if (weakBonus) dmg = Math.floor(dmg * 1.6);
  battle.foe.hp -= dmg;
  battle.log = msg + " " + dmg + " damage!";
  beep(520, 0.06);
  if (battle.foe.hp <= 0) { winBattle(); return; }
  renderBattle();
  setTimeout(enemyTurn, 420);
}

function castSpell(id) {
  const sp = SPELLS[id];
  if (state.mp < sp.mp) { battle.log = "Not enough MP."; renderBattle(); return; }
  state.mp -= sp.mp;
  if (id === "prog") {
    battle.foe.revealed = true;
    battle.log = "A hunch, uppercase-adjacent: " + battle.foe.name + " is weak to " + battle.foe.weak + ".";
    renderBattle();
    setTimeout(enemyTurn, 500);
    return;
  }
  const weak = (id === "fireball" && battle.foe.weak === "fire")
    || (id === "quench" && battle.foe.weak === "quench")
    || (id === "silence" && battle.foe.weak === "silence")
    || (id === "leaf" && (battle.foe.weak === "fire" || battle.foe.weak === "quench"))
    || (id === "confuse" && battle.foe.weak === "confuse")
    || (id === "laser" && battle.foe.weak === "laser")
    || (id === "rabbit" && battle.foe.weak === "rabbit")
    || (id === "margin" && battle.foe.weak === "margin");
  if (id === "margin") {
    const extra = Math.floor(noteCount() / 6);
    playerHit(sp.dmg[0] + extra, sp.dmg[1] + extra, sp.name + "!", weak);
    return;
  }
  playerHit(sp.dmg[0], sp.dmg[1], sp.name + "!", weak);
}

function battleItem(id) {
  if (!state.items[id]) { battle.log = "None left."; renderBattle(); return; }
  const it = ITEMS[id];
  state.items[id]--;
  if (it.heal) state.hp = Math.min(state.maxHp, state.hp + it.heal);
  battle.log = "Used " + it.name + ".";
  renderBattle();
  setTimeout(enemyTurn, 400);
}

function enemyTurn() {
  if (!battle || battle.foe.hp <= 0) return;
  let dmg = Math.max(1, battle.foe.atk - Math.floor(state.lv / 2) + Math.floor(Math.random() * 3));
  if (has("helmet") && battle.foe.name === "Treble") dmg = Math.max(1, Math.floor(dmg * 0.5));
  state.hp -= dmg;
  battle.log = battle.foe.name + " hits for " + dmg + "!";
  battle.menu = "main";
  beep(140, 0.1);
  if (state.hp <= 0) {
    state.hp = Math.max(8, Math.floor(state.maxHp / 2));
    battle.log = "You drop... but J.D. has died before. Or Gary refuses to miss this callback.";
    renderBattle();
    setTimeout(() => { endBattle(false); say("", "You stagger back, half recovered. Try another approach."); }, 700);
    return;
  }
  renderBattle();
}

function winBattle() {
  if (!battle || battle.resolved) return;
  battle.resolved = true;
  battle.log = battle.foe.name + " is defeated!";
  state.xp += battle.foe.xp;
  if (state.xp >= state.lv * 20) {
    state.lv++;
    state.maxHp += 4; state.maxMp += 2;
    state.hp = state.maxHp; state.mp = state.maxMp;
    battle.log += " Level up!";
  }
  renderBattle();
  const cb = battle.onWin;
  setTimeout(() => { endBattle(true); if (cb) cb(); }, 500);
}

function endBattle() {
  battleEl.classList.remove("show");
  battleEl.innerHTML = "";
  battle = null;
  mode = "explore";
  encounterCool = 180;
  save();
}

function getAudio() {
  if (audio) return audio;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  audio = new AC();
  return audio;
}
function beep(freq, dur, vol) {
  const ac = getAudio();
  if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = "square";
  o.frequency.value = freq;
  g.gain.value = vol || 0.035;
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function musicTick() {
  if (mode === "title" || mode === "ending") {
    const n = [196, 247, 294, 392, 311, 247, 220, 196][Math.floor(anim / 40) % 8];
    if (anim % 40 === 0) beep(n, 0.18, 0.02);
  } else if (mode === "battle") {
    const n = [130, 164, 196, 164][Math.floor(anim / 18) % 4];
    if (anim % 18 === 0) beep(n, 0.1, 0.02);
  } else if (mode === "explore" && anim % 55 === 0) {
    const n = [164, 196, 220, 196][Math.floor(anim / 55) % 4];
    beep(n, 0.12, 0.012);
  }
}

function shouldHint() {
  const f = facingTile();
  const standTx = Math.floor((state.x + 8) / TS), standTy = Math.floor((state.y + 12) / TS);
  if (noteAt(f.tx, f.ty) || noteAt(standTx, standTy)) return true;
  if (state.flags.editorQuest && !state.flags.editorDone && state.map !== "copydesk") {
    const p = pigeonTile();
    if (near(p.x, p.y, 2)) return true;
  }
  if (state.map === "copydesk" && (near(7, 4, 2) || f.t === "o" || f.t === "D")) return true;
  return usefulTile(f.t) || usefulTile(tileAt(state.x + 8, state.y + 12));
}

function draw() {
  const m = curMap();
  cam.x = Math.max(0, Math.min(m.w * TS - W, state.x - W / 2 + 8));
  cam.y = Math.max(0, Math.min(m.h * TS - H + 16, state.y - H / 2 + 8));
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < m.h; y++) {
    for (let x = 0; x < m.w; x++) {
      drawTile(x, y, m.grid[y][x]);
    }
  }
  drawActor(state.x, state.y, state.hero, state.dir, state.moving);
  if (state.petraOut && state.hero === "jd") {
    drawActor(state.x - 14, state.y - 6, "petra", state.dir, false);
  }
  if (state.sergio && (state.map === "ruins" || state.map === "beandom" || state.map === "mothership")) {
    drawActor(state.x + 16, state.y + 2, "sergio", "left", false);
  }
  if (state.vincenza && (state.map === "ship" || state.map === "cave" || state.map === "island")) {
    drawActor(state.x + 16, state.y, "vincenza", "left", false);
  }
  drawChapterNpcs();
  drawFootnotes();
  if (mode === "explore" && !dialogEl.classList.contains("show") && shouldHint()) {
    const px = Math.floor(state.x - cam.x) + 6;
    const py = Math.floor(state.y - cam.y) - 6;
    ctx.fillStyle = (anim % 40 < 20) ? "#ffe58a" : "#c45cff";
    ctx.fillRect(px, py, 4, 4);
    ctx.fillRect(px + 1, py + 5, 2, 2);
  }
  if (mode === "card") {
    ctx.fillStyle = "rgba(6,2,14,0.55)";
    ctx.fillRect(0, 0, W, H);
  }
}

function drawTile(tx, ty, t) {
  const x = tx * TS - cam.x, y = ty * TS - cam.y;
  if (x < -TS || y < -TS || x > W || y > H) return;
  const ch = state.map;
  const palettes = {
    countryside: ["#0b1024", "#16351c"],
    apartment: ["#241818", "#3a2a1c"],
    nyc: ["#14141c", "#2a2a34"],
    club: ["#0a0814", "#161022"],
    office: ["#07061a", "#101028"],
    arcade: ["#120c14", "#2a1a20"],
    garyapt: ["#1c1410", "#3a2a20"],
    bank: ["#202428", "#3a4048"],
    ruins: ["#142014", "#2a3a18"],
    ship: ["#102030", "#1a3048"],
    island: ["#102030", "#c2a46a"],
    cave: ["#140c10", "#2a1818"],
    beandom: ["#0e1c10", "#2f6a28"],
    mothership: ["#07061a", "#12142a"],
    copydesk: ["#1a080c", "#3a1820"]
  };
  const [bg, fl] = palettes[ch] || ["#111", "#333"];
  ctx.fillStyle = bg;
  ctx.fillRect(x, y, TS, TS);
  if (t === ".") {
    ctx.fillStyle = fl;
    ctx.fillRect(x, y, TS, TS);
    if ((tx + ty) % 2) { ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.fillRect(x, y, TS, TS); }
  } else if (t === "=") {
    ctx.fillStyle = "#3a3a44"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#d8c85a"; ctx.fillRect(x + 7, y, 2, TS);
  } else if (t === ",") {
    ctx.fillStyle = "#4a3724"; ctx.fillRect(x, y, TS, TS);
  } else if (t === "~") {
    ctx.fillStyle = "#163a68"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#2a6aaa"; ctx.fillRect(x, y + (anim / 8 + tx) % 8, TS, 2);
  } else if (t === "#") {
    ctx.fillStyle = "#1c1630"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#3a3058"; ctx.fillRect(x + 1, y + 1, TS - 2, TS - 2);
  } else if (t === "H") {
    ctx.fillStyle = "#3a3048"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#889"; ctx.fillRect(x + 3, y + 4, 4, 5);
    ctx.fillStyle = "#c45cff"; ctx.fillRect(x + 9, y + 2, 4, 3);
  } else if (t === "T") {
    ctx.fillStyle = "#16351c"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#2a5a20"; ctx.fillRect(x + 2, y + 1, 12, 10);
    ctx.fillStyle = "#6a3d22"; ctx.fillRect(x + 7, y + 10, 3, 6);
  } else if (t === "+" || t === "*") {
    ctx.fillStyle = fl; ctx.fillRect(x, y, TS, TS);
    if (t === "*") {
      const pulse = 0.5 + 0.5 * Math.sin(anim / 10);
      ctx.fillStyle = `rgba(196,92,255,${0.4 + pulse * 0.5})`;
      ctx.fillRect(x + 4, y + 4, 8, 8);
      ctx.fillStyle = "#ffe58a"; ctx.fillRect(x + 6, y + 6, 4, 4);
    } else {
      ctx.fillStyle = "#6a2030"; ctx.fillRect(x + 6, y + 4, 4, 12);
      ctx.fillStyle = "#c45a40"; ctx.fillRect(x + 2, y + 1, 12, 8);
    }
  } else if (t === "R") {
    ctx.fillStyle = "#3a4030"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#202818"; ctx.fillRect(x + 2, y + 6, TS - 4, 10);
  } else if (t === "%" ) {
    ctx.fillStyle = "#2a3a18"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#8a8"; ctx.fillRect(x + 4, y + 4, 8, 8);
  } else if (t === "b" || t === "L") {
    ctx.fillStyle = t === "L" ? "#123848" : "#2f6a28";
    ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = t === "L" ? "#6ad0ff" : "#8ad04a";
    ctx.fillRect(x + 5, y + 3, 6, 6);
  } else if (t === "N") {
    ctx.fillStyle = "#121018"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#3ad0ff"; ctx.fillRect(x + 2, y + 2, 12, 3);
  } else if (t === "o" || t === "k" || t === "$" || t === "f" || t === "s" || t === "c" || t === "w" || t === "B" || t === "p" || t === "m" || t === "K" || t === "A" || t === "P" || t === "M") {
    ctx.fillStyle = fl; ctx.fillRect(x, y, TS, TS);
    if (t === "$" || t === "k") {
      ctx.fillStyle = "#1a1a22"; ctx.fillRect(x + 2, y + 4, 12, 8);
      ctx.fillStyle = "#3f6"; ctx.fillRect(x + 4, y + 6, 8, 4);
    } else if (t === "f") {
      ctx.fillStyle = "#c03030"; ctx.fillRect(x + 4, y + 2, 8, 12);
    } else if (t === "s") {
      ctx.fillStyle = "#666"; ctx.fillRect(x + 3, y + 6, 10, 8);
      ctx.fillStyle = "#c45cff"; ctx.fillRect(x + 6, y + 8, 4, 4);
    } else if (t === "c") {
      ctx.fillStyle = "#4a3040"; ctx.fillRect(x + 1, y + 8, 14, 6);
    } else if (t === "w") {
      ctx.fillStyle = "#888"; ctx.fillRect(x + 5, y + 4, 6, 8);
      ctx.fillStyle = "#c33"; ctx.fillRect(x + 6, y + 6, 4, 3);
    } else if (t === "K" || t === "m") {
      ctx.fillStyle = "#222"; ctx.fillRect(x + 3, y + 2, 10, 14);
      ctx.fillStyle = "#fc3"; ctx.fillRect(x + 5, y + 4, 6, 5);
    } else if (t === "A") {
      ctx.fillStyle = "#889"; ctx.fillRect(x + 3, y + 6, 10, 6);
      ctx.fillStyle = "#c45cff"; ctx.fillRect(x + 5, y + 8, 6, 3);
    } else if (t === "P") {
      ctx.fillStyle = "#1a3050"; ctx.fillRect(x + 2, y + 4, 12, 10);
      ctx.fillStyle = "#4aa0d0"; ctx.fillRect(x + 5, y + 6, 6, 6);
    } else if (t === "o") {
      ctx.fillStyle = "#6a3d22"; ctx.fillRect(x, y + 6, TS, 8);
    } else if (t === "p") {
      ctx.fillStyle = "#d8c070"; ctx.fillRect(x + 4, y + 6, 8, 8);
    } else if (t === "B") {
      ctx.fillStyle = "#3a2a10"; ctx.fillRect(x + 2, y + 2, 12, 12);
    } else if (t === "M") {
      ctx.fillStyle = "#c9a33a"; ctx.fillRect(x + 4, y + 4, 8, 8);
    }
  } else if (t === "D") {
    ctx.fillStyle = "#4a3020"; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = "#c9a33a"; ctx.fillRect(x + 6, y + 7, 3, 3);
  } else if (t === "h") {
    ctx.fillStyle = fl; ctx.fillRect(x, y, TS, TS);
  } else if (t === "a" || t === "n") {
    ctx.fillStyle = fl; ctx.fillRect(x, y, TS, TS);
  } else {
    ctx.fillStyle = fl; ctx.fillRect(x, y, TS, TS);
  }
}

function drawChapterNpcs() {
  const ch = chapter();
  if (ch.id === "ch1" && state.petraOut) { /* follower drawn already */ }
  if (ch.id === "ch3" && !state.flags.mercury) drawActor(14 * TS, 3 * TS, "mercury", "down", false);
  if (ch.id === "ch4" && state.map === "club") drawActor(8 * TS, 2 * TS, "bouncer", "down", false);
  if (ch.id === "ch4" && state.map === "office") drawActor(5 * TS, 2 * TS, "mercury", "down", false);
  if (ch.id === "ch5") drawActor(10 * TS, 6 * TS, "petra", "left", false);
  if (ch.id === "ch8") drawActor(12 * TS, 4 * TS, "vincenza", "left", false);
  if (ch.id === "ch11") {
    drawActor(8 * TS, 5 * TS, "beanwitch", "down", false);
    drawActor(14 * TS, 8 * TS, "rightbeard", "left", false);
  }
  if (ch.id === "ch12") drawActor(7 * TS, 4 * TS, "felgarath", "down", false);
  if (ch.id === "ch14" || ch.id === "ch15") drawActor(6 * TS, 4 * TS, "tiberius", "down", false);
  if (state.map === "copydesk") drawActor(7 * TS, 4 * TS, "editor", "down", false);
  if (state.flags.editorQuest && !state.flags.editorDone && state.map !== "copydesk") {
    const p = pigeonTile();
    drawActor(p.x * TS, p.y * TS, "pigeon", "down", false);
  }
}

function drawFootnotes() {
  if (!state) return;
  for (let i = 0; i < FOOTNOTES.length; i++) {
    const fn = FOOTNOTES[i];
    if (fn.map !== state.map) continue;
    if (state.notes[fn.id] || state.notes[String(fn.id)]) continue;
    const x = fn.x * TS - cam.x, y = fn.y * TS - cam.y;
    if (x < -TS || y < -TS || x > W || y > H) continue;
    const pulse = 0.45 + 0.55 * Math.sin(anim / 8);
    ctx.fillStyle = "rgba(20,10,40,0.55)";
    ctx.fillRect(x + 4, y + 3, 8, 11);
    ctx.fillStyle = `rgba(232,200,90,${0.55 + pulse * 0.45})`;
    ctx.fillRect(x + 7, y + 3, 2, 10);
    ctx.fillRect(x + 5, y + 4, 6, 2);
    ctx.fillRect(x + 6, y + 11, 4, 2);
  }
}
function drawActor(px, py, who, dir, moving) {
  const a = ACTORS[who];
  if (!a) return;
  const x = Math.floor(px - cam.x), y = Math.floor(py - cam.y);
  const bob = moving && (anim % 16 < 8) ? 1 : 0;
  ctx.globalAlpha = a.ghost ? 0.72 : 1;
  ctx.fillStyle = a.coat;
  ctx.fillRect(x + 4, y + 8 - bob, 8, 8);
  ctx.fillStyle = a.skin;
  ctx.fillRect(x + 5, y + 2 - bob, 6, 6);
  ctx.fillStyle = a.hair;
  ctx.fillRect(x + 5, y + 1 - bob, 6, 3);
  if (dir === "left") ctx.fillRect(x + 4, y + 3 - bob, 2, 4);
  if (dir === "right") ctx.fillRect(x + 10, y + 3 - bob, 2, 4);
  ctx.fillStyle = "#111";
  if (dir !== "up") {
    ctx.fillRect(x + 6, y + 5 - bob, 1, 1);
    ctx.fillRect(x + 9, y + 5 - bob, 1, 1);
  }
  ctx.fillStyle = a.acc;
  ctx.fillRect(x + 3, y + 10 - bob, 3, 2);
  if (who === "jd") {
    ctx.fillStyle = "#1a3a8a";
    ctx.fillRect(x + 3, y + 11 - bob, 4, 2);
  }
  if (who === "gary") {
    ctx.fillStyle = "#222";
    ctx.fillRect(x + 4, y + 3 - bob, 8, 2);
  }
  if (who === "petra") {
    ctx.fillStyle = "rgba(180,230,255,.5)";
    ctx.fillRect(x + 2, y + 14, 12, 2);
  }
  ctx.globalAlpha = 1;
}

function updateHud() {
  if (mode !== "explore" && mode !== "card") { hudEl.classList.remove("show"); return; }
  hudEl.classList.add("show");
  const low = state.hp < state.maxHp * 0.3 ? " low" : "";
  hudEl.innerHTML = `<div class="hud-card">${ACTORS[state.hero].name} LV${state.lv}
    <div class="hpbar${low}"><i style="width:${Math.max(0, 100 * state.hp / state.maxHp)}%"></i></div>
    HP ${state.hp}/${state.maxHp}  MP ${state.mp}/${state.maxMp}</div>
    <div class="hud-card">CH ${state.ch + 1}/${CHAPTERS.length}<br>${chapter().title}<br>† ${noteCount()}/${FOOTNOTES.length}</div>`;
}

function update(dt) {
  anim++;
  musicTick();
  if (dialogEl.classList.contains("show") && typing.length < typeFull.length) {
    typeT += dt;
    if (typeT > 16) { typing += typeFull[typing.length]; typeT = 0; renderDialog(); }
  }
  if (mode === "explore" && !dialogEl.classList.contains("show")) {
    let dx = 0, dy = 0;
    if (keys.left || keys.a) dx -= 1;
    if (keys.right || keys.d) dx += 1;
    if (keys.up || keys.w) dy -= 1;
    if (keys.down || keys.s) dy += 1;
    if (dx && dy) { dx *= 0.74; dy *= 0.74; }
    state.moving = !!(dx || dy);
    if (dx < 0) state.dir = "left";
    else if (dx > 0) state.dir = "right";
    else if (dy < 0) state.dir = "up";
    else if (dy > 0) state.dir = "down";
    const sp = 1.15;
    if (dx || dy) {
      const nx = state.x + dx * sp;
      const ny = state.y + dy * sp;
      if (!blocked(nx, state.y)) state.x = nx;
      if (!blocked(state.x, ny)) state.y = ny;
      const standTx = Math.floor((state.x + 8) / TS), standTy = Math.floor((state.y + 12) / TS);
      const stepped = noteAt(standTx, standTy);
      if (stepped) collectNote(stepped);
    }
    encounterCool = Math.max(0, encounterCool - 1);
    if (state.moving && encounterCool === 0 && (state.map === "ruins" || state.map === "beandom") && Math.random() < 0.004) {
      encounterCool = 200;
      startBattle(state.map === "ruins" ? "treble" : "golem");
    }
  }
  if (mode === "explore" || mode === "card") draw();
  updateHud();
}

function confirm() {
  getAudio();
  if (dialogEl.classList.contains("show")) { nextLine(); beep(660, 0.04); return; }
  if (mode === "title" || mode === "ending" || mode === "pause" || mode === "choice" || mode === "battle" || mode === "journal") {
    activateSel();
    beep(660, 0.04);
    return;
  }
  interact();
}

window.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (e.repeat && (k === "z" || k === "enter" || k === " " || k === "x" || k === "escape")) {
    e.preventDefault();
    return;
  }
  keys[k] = true;
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase()) || e.code.startsWith("Arrow")) e.preventDefault();
  if (k === "arrowup") keys.up = true;
  if (k === "arrowdown") keys.down = true;
  if (k === "arrowleft") keys.left = true;
  if (k === "arrowright") keys.right = true;
  const menuMode = mode === "pause" || mode === "choice" || mode === "battle" || mode === "journal" || mode === "title" || mode === "ending";
  if (menuMode && (k === "arrowup" || k === "w" || k === "arrowleft" || k === "a")) {
    uiSel--;
    highlightSel();
    return;
  }
  if (menuMode && (k === "arrowdown" || k === "s" || k === "arrowright" || k === "d")) {
    uiSel++;
    highlightSel();
    return;
  }
  if (k === "z" || k === "enter" || k === " ") confirm();
  if (k === "x" || k === "escape") {
    if (mode === "journal") closeJournal();
    else if (mode === "pause") closeMenu();
    else if (mode === "title" || mode === "ending" || mode === "battle" || mode === "choice") return;
    else openMenu();
  }
});
window.addEventListener("keyup", (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === "arrowup") keys.up = false;
  if (k === "arrowdown") keys.down = false;
  if (k === "arrowleft") keys.left = false;
  if (k === "arrowright") keys.right = false;
});

document.querySelectorAll("#mobile b[data-k]").forEach((b) => {
  const k = b.dataset.k;
  const down = (e) => {
    e.preventDefault();
    if (k === "ok") confirm();
    else if (k === "menu") {
      if (mode === "journal") closeJournal();
      else if (mode === "pause") closeMenu();
      else openMenu();
    }
    else keys[k] = true;
  };
  const up = () => { if (k !== "ok" && k !== "menu") keys[k] = false; };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointerleave", up);
});

function fit() {
  const pad = window.matchMedia("(pointer: coarse)").matches ? 150 : 24;
  const s = Math.max(1, Math.floor(Math.min((innerWidth - 16) / W, (innerHeight - pad) / H)));
  stage.style.width = (W * s) + "px";
  stage.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

document.getElementById("btnNew").onclick = () => {
  getAudio();
  state = newState();
  loadChapter(0);
};
document.getElementById("btnContinue").onclick = () => {
  getAudio();
  const s = loadSave();
  if (!s) { say("", "No saved quest. The Netherworld keeps poor records of save files."); return; }
  state = s;
  mode = "explore";
  titleUI.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(chapter().goal);
};
document.getElementById("btnHow").onclick = () => {
  sayMany([
    ["", "Walk with arrows or WASD. Confirm with Z or Space. Menu with X. On menus, arrows move the cursor and Z selects."],
    ["", "You play J.D. Zaubermann and Gary Baumgartner in alternating chapters from the novel."],
    ["", "Talk to everyone. Touch glowing gears. When a purple wisp or a treble appears, fight."],
    ["", "J.D.'s watch summons Petra. Gopat's glove learns spells. Gary's red-leaf mark remembers fire."],
    ["", "Gold daggers on the map are optional footnotes — J.D.'s commentary. File them in the journal (X). Collect every one to unlock a side quest."],
    ["", "The prophecy wants the twelve and the three at the site of the tree. Book I ends at Excelsior."]
  ]);
};
document.getElementById("btnAgain").onclick = () => {
  endingUI.classList.remove("show");
  titleUI.classList.add("show");
  mode = "title";
};

function loop(t) {
  const dt = Math.min(40, t - last || 16);
  last = t;
  update(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
highlightSel();

window.LAUNCH_TIME = {
  start: () => { state = newState(); loadChapter(0); },
  chapter: (i) => { state = state || newState(); loadChapter(i); },
  state: () => state,
  mode: () => mode,
  facing: () => facingTile(),
  talk: () => interact(),
  notes: () => FOOTNOTES,
  collectAll: () => {
    FOOTNOTES.forEach((fn) => { state.notes[fn.id] = true; });
    state.flags.editorQuest = true;
    save();
  },
  winFight: () => { if (typeof battle !== "undefined" && battle) { battle.foe.hp = 0; winBattle(); } },
  chapters: CHAPTERS.map((c) => c.id),
  maps: Object.keys(MAPS),
  grid: () => curMap(),
  blockedTile: (t) => BLOCK.has(t)
};
</script>
</body>
</html>
