<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>The Canticle Kingdom — 16-bit RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #070b16;
      --navy: #10182c;
      --panel: rgba(10, 16, 34, .94);
      --gold: #e6c86a;
      --pale: #fff3c4;
      --ice: #cfe4ff;
      --rose: #f0b7a4;
      --danger: #d4454a;
      --heal: #5ad18a;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #05070e; color: var(--pale);
      font-family: "Press Start 2P", "Courier New", Courier, monospace;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    #viewport {
      position: absolute; top: 50%; left: 50%;
      width: 960px; height: 540px;
      transform: translate(-50%, -50%);
      transform-origin: center;
      background: #000; overflow: hidden;
      box-shadow: 0 0 0 3px #1b1630, 0 0 48px #3a2a8055;
      user-select: none;
    }
    .screen { position: absolute; inset: 0; }
    .hidden { display: none !important; }
    #gameCanvas { width: 960px; height: 540px; }
    #hud {
      position: absolute; left: 12px; top: 10px; z-index: 8;
      display: flex; gap: 8px; pointer-events: none;
    }
    .hud-card {
      min-width: 168px; padding: 8px 10px 9px;
      background: var(--panel); border: 3px solid var(--gold);
      box-shadow: 4px 4px 0 #000a; font-size: 8px; line-height: 1.55;
    }
    .hud-card strong { color: var(--gold); display: block; margin-bottom: 4px; }
    .hpbar, .mpbar {
      height: 7px; margin: 3px 0 5px; background: #1a1020; border: 1px solid #000;
    }
    .hpbar > i, .mpbar > i { display: block; height: 100%; }
    .hpbar > i { background: linear-gradient(#7dff9a, #2f9a4e); }
    .mpbar > i { background: linear-gradient(#9ad4ff, #3b78d4); }
    #questChip {
      position: absolute; right: 12px; top: 10px; z-index: 8;
      max-width: 280px; padding: 8px 10px;
      background: var(--panel); border: 3px solid var(--gold);
      font-size: 8px; line-height: 1.5; color: var(--ice);
    }
    #questChip b { color: var(--gold); }
    #toast {
      position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
      z-index: 20; padding: 8px 14px; background: #120c1ee8;
      border: 2px solid var(--gold); font-size: 9px; opacity: 0; transition: opacity .2s;
    }
    #toast.show { opacity: 1; }
    #dialog {
      position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 12;
      min-height: 132px; padding: 14px 16px 12px;
      background: linear-gradient(#141c34, #0b1020);
      border: 4px double var(--gold); box-shadow: 0 0 0 3px #000, 0 12px 28px #000a;
    }
    #dialogName { color: var(--gold); font-size: 10px; margin-bottom: 8px; }
    #dialogText { font-size: 8px; line-height: 1.8; color: #fff8dc; min-height: 54px; }
    #dialogChoices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    #dialogChoices button, .menu-btn, .title-btn, .cmd-btn {
      background: #1c2748; border: 2px solid #8a7340; color: var(--pale);
      padding: 8px 10px; font-size: 9px;
    }
    #dialogChoices button:hover, .menu-btn:hover, .title-btn:hover, .cmd-btn:hover,
    #dialogChoices button:focus, .title-btn:focus, .cmd-btn:focus {
      border-color: #fff3c4; background: #2a3a68; outline: none;
    }
    #dialogPrompt { position: absolute; right: 12px; bottom: 8px; color: var(--gold); font-size: 10px; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #pause, #battle, #title, #cinematic, #ending, #options {
      z-index: 30; background: #070914f2;
    }
    #title {
      display: grid; place-items: center;
      background:
        radial-gradient(circle at 50% 28%, #3a2a72aa, transparent 42%),
        linear-gradient(#0b1024, #1a1238 55%, #070914);
    }
    .title-panel { text-align: center; width: min(640px, 92%); }
    .title-panel h1 {
      margin: 0 0 8px; font-size: 22px; line-height: 1.45; color: var(--pale);
      text-shadow: 4px 4px #3a2208, 0 0 18px #e6c86a88;
    }
    .title-panel .sub { font-size: 9px; color: var(--ice); margin-bottom: 18px; line-height: 1.7; }
    .title-actions { display: grid; gap: 10px; width: 320px; margin: 0 auto; }
    .title-btn { padding: 12px 10px; }
    #hud { max-width: 640px; flex-wrap: wrap; }
    .hud-card { min-width: 140px; }
    #cinematic, #ending {
      display: grid; place-items: center; text-align: center; padding: 40px;
      background: #05060c;
    }
    #cineArt { width: 420px; height: 180px; margin: 0 auto 22px; image-rendering: pixelated; }
    #cineKicker { color: var(--gold); font-size: 9px; letter-spacing: 2px; margin-bottom: 10px; }
    #cineTitle { font-size: 16px; margin: 0 0 14px; }
    #cineBody { font-size: 10px; line-height: 1.8; max-width: 640px; color: #efe4c4; }
    #battle {
      display: grid; grid-template-rows: 1fr 168px;
      background: linear-gradient(#1a2248, #0c1020);
    }
    #battleStage { position: relative; overflow: hidden; }
    #battleCanvas { width: 960px; height: 372px; }
    #battleUI {
      display: grid; grid-template-columns: 1fr 280px 240px;
      border-top: 4px solid var(--gold); background: #0d1428;
    }
    #battleLog { padding: 10px 14px; font-size: 9px; line-height: 1.6; color: #efe4c4; }
    #battleParty { padding: 8px 10px; font-size: 8px; border-left: 2px solid #8a7340; }
    #battleCmds { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; }
    .cmd-btn { font-size: 8px; }
    #pause, #options {
      display: grid; place-items: center;
    }
    .menu-card {
      width: min(520px, 90%); padding: 18px; background: var(--panel);
      border: 4px double var(--gold);
    }
    .menu-card h2 { margin: 0 0 12px; font-size: 13px; color: var(--gold); }
    .menu-grid { display: grid; gap: 8px; }
    #mobile {
      position: absolute; right: 16px; bottom: 16px; z-index: 18;
      display: none; gap: 8px; align-items: flex-end;
    }
    .dpad { display: grid; grid-template-columns: 44px 44px 44px; gap: 4px; }
    .dpad button, .mob-act {
      width: 44px; height: 44px; background: #1b2444cc; border: 2px solid #c9a24a;
      color: var(--pale); font-size: 12px;
    }
    .dpad .blank { visibility: hidden; }
    @media (pointer: coarse) { #mobile { display: flex; } }
    body.keyboard-only #mobile { display: none !important; }
    #sr { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="gameCanvas" width="960" height="540" aria-label="Canticle Kingdom exploration"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="questChip" class="hidden"></div>
    <div id="toast"></div>
    <div id="dialog" class="hidden">
      <div id="dialogName"></div>
      <div id="dialogText"></div>
      <div id="dialogChoices"></div>
      <div id="dialogPrompt">▼</div>
    </div>
    <div id="mobile">
      <div class="dpad">
        <span class="blank"></span>
        <button data-dir="up">▲</button>
        <span class="blank"></span>
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
      <div>
        <button class="mob-act" id="mobA">A</button>
        <button class="mob-act" id="mobB">B</button>
      </div>
    </div>
    <div id="title" class="screen">
      <div class="title-panel">
        <canvas id="titleArt" width="420" height="150"></canvas>
        <h1>THE CANTICLE<br>KINGDOM</h1>
        <div class="sub">A 16-bit role-playing game after the novels by Michael D. Young<br>Prelude: The Canticle Prelude · Book I: The Canticle Kingdom · Book II: The Frozen Globe · Book III: The Skyward Isle</div>
        <div class="title-actions">
          <button class="title-btn" id="newGameBtn">Book I: New Game (Prelude)</button>
          <button class="title-btn" id="book2Btn">Book II: The Frozen Globe</button>
          <button class="title-btn" id="book3Btn">Book III: The Skyward Isle</button>
          <button class="title-btn" id="continueBtn" disabled>Continue</button>
          <button class="title-btn" id="optionsBtn">Options</button>
        </div>
      </div>
    </div>
    <div id="cinematic" class="screen hidden">
      <div>
        <canvas id="cineArt" width="420" height="180"></canvas>
        <div id="cineKicker"></div>
        <h2 id="cineTitle"></h2>
        <p id="cineBody"></p>
        <p style="margin-top:22px;color:var(--gold);font-size:9px">Press Enter / click to continue</p>
      </div>
    </div>
    <div id="battle" class="screen hidden">
      <div id="battleStage"><canvas id="battleCanvas" width="960" height="372"></canvas></div>
      <div id="battleUI">
        <div id="battleLog"></div>
        <div id="battleParty"></div>
        <div id="battleCmds"></div>
      </div>
    </div>
    <div id="pause" class="screen hidden">
      <div class="menu-card">
        <h2>Pause</h2>
        <div class="menu-grid">
          <button class="menu-btn" id="resumeBtn">Resume</button>
          <button class="menu-btn" id="itemsBtn">Items</button>
          <button class="menu-btn" id="journalBtn">Journal</button>
          <button class="menu-btn" id="saveBtn">Save</button>
          <button class="menu-btn" id="quitTitleBtn">Return to Title</button>
        </div>
        <div id="pauseExtra" style="margin-top:14px;font-size:8px;line-height:1.7;color:#cfe4ff"></div>
      </div>
    </div>
    <div id="options" class="screen hidden">
      <div class="menu-card">
        <h2>Options</h2>
        <label style="display:block;font-size:8px;margin:10px 0">Music <input id="musicVol" type="range" min="0" max="100" value="55"></label>
        <label style="display:block;font-size:8px;margin:10px 0">Sound <input id="sfxVol" type="range" min="0" max="100" value="70"></label>
        <label style="display:block;font-size:8px;margin:10px 0"><input id="reduceMotion" type="checkbox"> Reduce motion</label>
        <button class="menu-btn" id="closeOptions">Close</button>
      </div>
    </div>
    <div id="ending" class="screen hidden">
      <div>
        <canvas id="endArt" width="420" height="180" style="width:420px;height:180px;image-rendering:pixelated;margin-bottom:18px"></canvas>
        <h2 id="endTitle" style="font-size:16px;color:var(--gold)"></h2>
        <p id="endBody" style="font-size:10px;line-height:1.85;max-width:640px;color:#efe4c4"></p>
        <button class="title-btn" id="endBook2Btn" style="margin-top:22px">Begin The Frozen Globe</button>
        <button class="title-btn hidden" id="endBook3Btn" style="margin-top:12px">Begin The Skyward Isle</button>
        <button class="title-btn" id="endTitleBtn" style="margin-top:12px">Return to Title</button>
      </div>
    </div>
  </div>
  <div id="sr" aria-live="polite"></div>
  <script>

  ctx.imageSmoothingEnabled = false;
  bctx.imageSmoothingEnabled = false;

  const $ = (id) => document.getElementById(id);
  const held = new Set();
  const SAVE_KEY = "canticle-kingdom-rpg-v1";
  let audioCtx = null, musicTimer = 0, musicMode = "";
  let mode = "title", dialogQueue = [], dialogResolve = null;
  let toastTimer = 0, anim = 0, last = 0, battle = null;
  let cineIndex = 0, pauseView = "root";

  const settings = {
    music: 55, sfx: 70, reduce: false
  };

  const state = {
    map: "home",

    flags: {},
    gold: 4,

    book: 1
  };

  const HEROES = {

  const ITEMS = {

    sausage: { name: "Market sausage", heal: 22, desc: "Savory rolls and sausage from the village vendors." },

    charm: { name: "Nachtigal charm", heal: 28, mp: 12, desc: "A jingling vial of mountain medicine." },

  const CANTICLES = {

  const QUEST_TEXT = {

  function addMap(id, spec) {
    const rows = spec.rows.trim().split("\n").map((r) => r.trimEnd());
    const h = rows.length, w = Math.max(...rows.map((r) => r.length));
    const tiles = [];
    for (let y = 0; y < h; y++) {
      const line = rows[y].padEnd(w, "#");
      for (let x = 0; x < w; x++) tiles.push(CHAR[line[x]] ?? 5);
    }
    MAPS[id] = { id, w, h, tiles, ...spec };

  function member(id) {
    const base = HEROES[id];
    return { ...base, hp: base.maxHp, mp: base.maxMp, alive: true };
  }
  function hasHero(id) { return state.party.some((p) => p.id === id); }
  function flag(k) { return !!state.flags[k]; }
  function setFlag(k, v = true) { state.flags[k] = v; save(true); }

  function npcActive(n) {
    if (n.id === "brigitta_wait" && hasHero("brigitta")) return false;
    if (n.id === "brigitta_lost" && flag("found_brigitta")) return false;
    if (n.id === "brutus" && flag("brutus_left") && !flag("brutus_hurt")) return false;
    if (n.id === "brutusbed" && !flag("brutus_hurt")) return false;
    if (n.id === "siegfried" && state.map === "cottage" && !flag("snake_gone") && !hasHero("siegfried")) return false;
    if (n.id === "karsten_npc" && flag("karsten_gone")) return false;
    if (n.id === "nachtigal_npc" && hasHero("nachtigal")) return false;
    if (n.id === "bruno_dark" && hasHero("bruno")) return false;
    if (n.id === "richard_east" && hasHero("richard")) return false;
    if (n.id === "wyrm_boss" && flag("wyrm_down")) return false;
    if (n.id === "many_house" && flag("won2")) return false;
    if (n.id === "berlin_thief" && flag("bakery_cleared")) return false;
    if (n.id === "lorelei_npc" && !flag("lorelei_free")) return false;
    if (n.id === "lorelei_stat" && flag("lorelei_free")) return false;
    if (n.id === "ewyn_ghost" && flag("ewyn_done")) return false;
    if (n.id === "howa_npc" && hasHero("howa")) return false;
    if (n.id === "many_dark" && flag("won3")) return false;
    if (n.id === "homu_npc" && flag("homu_used")) return false;
    if (n.id === "karsten_pre") return !flag("karsten_gone");
    if (n.id === "klara_pre") return flag("klara_arrived") && !flag("klara_lost");
    if (n.id === "karsten_return") return flag("cabin_burned") && !flag("box_made");
    if (n.id === "edelphus_pre") return !flag("edelphus_defeated");
    if (n.id === "pre_device") return !flag("cabin_burned");
    return true;
  }

  function healParty(full) {
    state.party.forEach((p) => {
      p.hp = full ? p.maxHp : Math.max(p.hp, 1);
      if (full) p.mp = p.maxMp;
      p.alive = p.hp > 0;
    });
  }

  function blankInv() {
    return { porridge: 0, ribbon: 0, sword: 0, amulet: 0, sausage: 0, draught: 0, score: 0, coins: 0, globe: 0, staff: 0, charm: 0, cocoa: 0, rheingold: 0, mask: 0, watch: 0, cloak: 0, homu: 0, feast: 0 };
  }
  function boostParty(party, hp, mp, atk, def) {
    party.forEach((p) => {
      p.maxHp += hp; p.hp = p.maxHp;
      p.maxMp += mp; p.mp = p.maxMp;
      p.atk += atk; p.def += def;
    });
    return party;
  }
  function resetGame(book = 1) {
    HEROES.johann.atk = 8;
    if (book === 3) {
      HEROES.johann.atk = 13;
      const party = boostParty([member("johann"), member("brigitta"), member("siegfried"), member("bruno")], 24, 12, 5, 3);
      Object.assign(state, {
        map: "greyking", x: 10 * TILE, y: 8 * TILE, dir: "down",
        flags: { won: true, won2: true }, gold: 28,
        inventory: { ...blankInv(), porridge: 1, sausage: 3, draught: 3, sword: 1, ribbon: 1, score: 1, globe: 1, staff: 1, charm: 2 },
        party, quest: "grey", playtime: 0, book: 3
      });
      return;
    }
    if (book === 2) {
      HEROES.johann.atk = 11;
      const party = boostParty([member("johann"), member("brigitta"), member("siegfried")], 16, 8, 3, 2);
      Object.assign(state, {
        map: "karsten", x: 8 * TILE, y: 4 * TILE, dir: "down",
        flags: { won: true }, gold: 18,
        inventory: { ...blankInv(), porridge: 1, sausage: 2, draught: 2, sword: 1, ribbon: 1, score: 1 },
        party, quest: "visitor", playtime: 0, book: 2
      });
      return;
    }
    if (book === 0) {
      Object.assign(state, {
        map: "jorgen_house", x: 10 * TILE, y: 4 * TILE, dir: "down",
        flags: {}, gold: 2,
        inventory: { ...blankInv(), porridge: 3 },
        party: [member("jorgen")],
        quest: "karsten_pre", playtime: 0, book: 0
      });
      return;
    }
    Object.assign(state, {
      map: "home", x: 9 * TILE, y: 4 * TILE, dir: "down",
      flags: {}, gold: 4,
      inventory: { ...blankInv(), porridge: 1, draught: 1 },
      party: [member("johann")],
      quest: "wake", playtime: 0, book: 1
    });
  }

  function save(quiet) {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        ...state, flags: state.flags
      }));
      if (!quiet) toast("Progress saved.");
    } catch {}
    $("continueBtn").disabled = !localStorage.getItem(SAVE_KEY);
  }
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!raw) return false;
      Object.assign(state, raw);
      state.book = raw.book == null ? 1 : raw.book;
      state.inventory = { ...blankInv(), ...(raw.inventory || {}) };
      return true;
    } catch { return false; }
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    $("sr").textContent = msg;
  }

  function announce(msg) { $("sr").textContent = msg; }

  function tileAt(map, x, y) {
    if (x < 0 || y < 0 || x >= map.w || y >= map.h) return 5;
    return map.tiles[y * map.w + x];
  }
  function blocked(px, py) {
    const map = MAPS[state.map];
    const points = [
      [px + 3, py + 12], [px + 12, py + 12], [px + 3, py + 15], [px + 12, py + 15]
    ];
    return points.some(([x, y]) => SOLID.has(tileAt(map, x >> 4, y >> 4)));
  }
  function currentMap() { return MAPS[state.map]; }

  function fitViewport() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / 960, vh / 540);
    $("viewport").style.transform = `translate(-50%, -50%) scale(${s})`;
  }

  /* ---------- Pixel art ---------- */
  const sprites = {};
  function makeSpr(w, h, fn) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const g = c.getContext("2d");
    fn(g, w, h);
    return c;
  }
  function pix(g, x, y, c, w = 1, h = 1) {
    g.fillStyle = c; g.fillRect(x, y, w, h);
  }
  function person(g, opt) {
    const skin = opt.skin || "#f0c7a0";
    const hair = opt.hair || "#6a3e22";
    const shirt = opt.shirt || "#8a4a28";
    const pants = opt.pants || "#3a3a48";
    pix(g, 5, 1, hair, 6, 3);
    pix(g, 4, 2, hair, 8, 3);
    pix(g, 5, 4, skin, 6, 4);
    pix(g, 6, 5, "#3a2018", 1, 1);
    pix(g, 9, 5, "#3a2018", 1, 1);
    pix(g, 7, 7, "#c07070", 2, 1);
    pix(g, 4, 8, shirt, 8, 6);
    if (opt.belt) pix(g, 5, 12, opt.belt, 6, 1);
    pix(g, 5, 14, pants, 3, 5);
    pix(g, 8, 14, pants, 3, 5);
    pix(g, 5, 18, opt.shoes || "#2a2018", 3, 2);
    pix(g, 8, 18, opt.shoes || "#2a2018", 3, 2);
    if (opt.extra) opt.extra(g);
  }

  function buildSprites() {
    sprites.johann = makeSpr(16, 24, (g) => person(g, {
      hair: "#a56a32", shirt: "#7a3f22", belt: "#2f6a38", pants: "#3c4030",

    }));
    sprites.brigitta = makeSpr(16, 24, (g) => person(g, {
      hair: "#e2c15a", skin: "#f3d0b0", shirt: "#3a5a88", belt: "#c9a24a", pants: "#2f3a4a",
      extra: (g) => { pix(g, 3, 4, "#3a7ad4", 2, 3); pix(g, 12, 11, "#8a8a90", 2, 6); }
    }));
    sprites.siegfried = makeSpr(16, 24, (g) => {
      person(g, { hair: "#e8e0c8", shirt: "#8a7a58", pants: "#4a4030", extra: (g) => pix(g, 3, 8, "#b0a070", 10, 8) });
      pix(g, 11, 10, "#2a2a30", 3, 2);
    });
    sprites.maria = makeSpr(16, 24, (g) => person(g, { hair: "#4a2a18", shirt: "#8a3850", pants: "#3a2430" }));
    sprites.richard = makeSpr(16, 24, (g) => person(g, { hair: "#d0c8b0", shirt: "#5a4a38", pants: "#3a3028" }));
    sprites.sister = makeSpr(16, 16, (g) => { pix(g, 5, 6, "#f0c7a0", 6, 6); pix(g, 4, 5, "#c9a24a", 8, 3); pix(g, 4, 12, "#d8c0a0", 8, 4); });
    sprites.brutus = makeSpr(16, 24, (g) => person(g, { hair: "#2a2018", shirt: "#5a3a28", pants: "#2a2018", extra: (g) => pix(g, 2, 8, "#8a5a3a", 12, 8) }));
    sprites.bruno = makeSpr(16, 24, (g) => person(g, { hair: "#3a2418", shirt: "#6a3030", pants: "#2a2a30" }));

  /* ---------- Audio: music-box chiptune ---------- */
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type = "triangle", vol = 0.08, decay = 0.2) {
    if (settings.sfx <= 0) return;
    const ac = ensureAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = (settings.sfx / 100) * vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur + decay);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + decay);
  }

  function stopMusic() { clearTimeout(musicTimer); musicTimer = 0; }
  function startMusic(name) {
    if (musicMode === name) return;
    musicMode = name;
    stopMusic();
    const theme = THEMES[name] || THEMES.village;
    const step = 60 / theme.bpm;
    let i = 0;
    const tick = () => {
      if (settings.music <= 0 || musicMode !== name) return;
      const ac = ensureAudio();
      const note = theme.notes[i % theme.notes.length];
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = name === "between" || name === "secret" || name === "title" ? "sine" : "triangle";
      o.frequency.value = note[1];
      g.gain.value = (settings.music / 100) * 0.045;
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + step * 1.2);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + step * 1.4);
      i++;
      musicTimer = setTimeout(tick, step * 1000);
    };
    tick();
  }

  /* ---------- UI ---------- */
  function renderHud() {
    if (mode !== "explore" && mode !== "dialog") {
      $("hud").classList.add("hidden");
      $("questChip").classList.add("hidden");
      return;
    }
    $("hud").classList.remove("hidden");
    $("questChip").classList.remove("hidden");
    $("hud").innerHTML = state.party.map((p) => `
      <div class="hud-card">
        <strong>${p.name}</strong>
        HP ${p.hp}/${p.maxHp}
        <div class="hpbar"><i style="width:${Math.max(0, p.hp / p.maxHp * 100)}%"></i></div>
        MP ${p.mp}/${p.maxMp}
        <div class="mpbar"><i style="width:${Math.max(0, p.mp / p.maxMp * 100)}%"></i></div>
      </div>`).join("");
    $("questChip").innerHTML = `<b>${currentMap().name}</b><br>${QUEST_TEXT[state.quest] || ""}`;
  }

  function say(name, text, choices) {
    return new Promise((resolve) => {
      mode = "dialog";
      $("dialog").classList.remove("hidden");
      $("dialogName").textContent = name || "";
      $("dialogText").textContent = text;
      $("dialogChoices").innerHTML = "";
      $("dialogPrompt").style.display = choices ? "none" : "block";
      dialogResolve = resolve;
      if (choices) {
        choices.forEach((c) => {
          const b = document.createElement("button");
          b.textContent = c.label;
          b.onclick = () => { closeDialog(); resolve(c.value); };
          $("dialogChoices").appendChild(b);
        });
      }
      announce(`${name || ""}: ${text}`);
    });
  }
  function closeDialog() {
    $("dialog").classList.add("hidden");
    if (mode === "dialog") mode = "explore";
    dialogResolve = null;
    renderHud();
  }
  async function story(lines) {
    for (const line of lines) {
      if (typeof line === "string") await say("", line);
      else await say(line[0], line[1]);
    }
  }

  function showCine(list, i = 0) {
    cineList = list;
    cineIndex = i;
    mode = "cine";
    $("title").classList.add("hidden");
    $("cinematic").classList.remove("hidden");
    const s = cineList[i];
    $("cineKicker").textContent = s.kicker;
    $("cineTitle").textContent = s.title;
    $("cineBody").textContent = s.body;
    drawCine(s.art);
    startMusic(i < 2 ? "secret" : i === 3 ? "castle" : "title");
  }
  function showPrologue(i = 0) { showCine(PROLOGUE, i); }
  function showPrologue2(i = 0) { showCine(PROLOGUE2, i); }
  function showPrologue3(i = 0) { showCine(PROLOGUE3, i); }
  function showPrologueAfter(i = 0) { showCine(PROLOGUE_AFTER, i); }
  function advanceCine() {
    if (cineIndex < cineList.length - 1) showCine(cineList, cineIndex + 1);
    else if (cineList === PROLOGUE_AFTER) {
      resetGame(1);
      beginExplore();
    } else beginExplore();
  }

  function beginExplore(fromSave) {
    $("cinematic").classList.add("hidden");
    $("title").classList.add("hidden");
    $("ending").classList.add("hidden");
    $("pause").classList.add("hidden");
    mode = "explore";
    if (!fromSave) save(true);
    startMusic(currentMap().music);
    renderHud();
    if (!fromSave && state.book === 3 && !flag("intro3")) {
      setFlag("intro3");
      story([
        ["Peter", "The bells are dead. I used to hunt in these woods when they still had the decency to be woods."],
        ["Siegfried", "The Many-Named One came out of Darkespace fatter with stolen evil. Without the banishing music, his reign lasts forever."],
        ["Brigitta", "Then we find a home that is not a box. Johann. Stop staring at the silence and walk."]
      ]);
    } else if (!fromSave && state.book === 2 && !flag("intro2")) {
      setFlag("intro2");
      story([
        ["Karsten", "The only thing that can't wait for breakfast is a burning house, am I right?"],
        ["Johann", "And even that could probably wait if you live in a stone house."],
        ["Brigitta", "Karsten. Jorgen still hasn't written. You should go."]
      ]);
    } else if (!fromSave && state.book === 0 && !flag("intro0")) {
      setFlag("intro0");
      story([
        ["Jorgen", "The doctor will not sign. Weak lungs. A liability."],
        ["", "Karsten is in the kitchen, mouth full of red cabbage, already glowing about the train."],
        ["Jorgen", "Speak with him. Then the piano. Then perhaps the woods."]
      ]);
    } else if (!fromSave && state.book === 1 && !flag("intro")) {
      setFlag("intro");
      story([
        ["Johann", "If I don't come down to breakfast this instant, Mother will—"],
        ["", "Out the bedroom window, the gleaming white castle sits atop the distant hill. From the highest tower, bells chime: a low tone, a high one, a descending scale. Eight o'clock."],
        ["Maria", "Eat. Brutus wants you in the shop in a mere fifteen minutes."]
      ]);
    }
  }

  /* ---------- Interaction / story ---------- */
  function facingTile() {
    const dx = state.dir === "left" ? -1 : state.dir === "right" ? 1 : 0;
    const dy = state.dir === "up" ? -1 : state.dir === "down" ? 1 : 0;
    return { x: Math.floor((state.x + 8) / TILE) + dx, y: Math.floor((state.y + 12) / TILE) + dy };
  }

  async function interact() {
    if (mode !== "explore") return;
    const map = currentMap();
    const f = facingTile();
    const here = { x: Math.floor((state.x + 8) / TILE), y: Math.floor((state.y + 12) / TILE) };
    const npcs = map.npcs.filter(npcActive);
    const standing = npcs.find((n) => n.x === here.x && n.y === here.y);
    const facing = npcs.find((n) => n.x === f.x && n.y === f.y)
      || npcs.find((n) => Math.abs(n.x - f.x) + Math.abs(n.y - f.y) <= 1);
    const npc = standing || facing;
    if (npc) { await talk(npc); return; }
    const exit = map.exits.find((e) => e.x === here.x && e.y === here.y);
    if (exit) useExit(exit);
  }

  function useExit(exit) {
    if (exit.to === "woods_pre" && !flag("karsten_gone")) {
      toast("Karsten leaves today. Speak with him first.");
      return;
    }
    if (exit.to === "cabin_pre" && !flag("klara_lost")) {
      toast("The black cabin can wait. Klara is not lost yet.");
      return;
    }
    if (exit.to === "woods_edge" && !flag("got_ribbon") && state.quest !== "woods" && !flag("met_brigitta")) {
      toast("The Dunkel Woods... not without a reason.");
      return;
    }
    if (exit.to === "cottage" && !flag("snake_gone") && !hasHero("siegfried")) {
      toast("The trees will not part.");
      return;
    }
    if (exit.to === "labyrinth" && !flag("brigitta_taken") && !flag("chimera_fought")) {
      toast("A sealed stairwell. The castle keeps its lower dark for now.");
      return;
    }
    if (exit.to === "middlespace" && (!flag("found_brigitta") || !flag("saw_queen"))) {
      toast("The white between worlds stays closed until the queen has spoken.");
      return;
    }
    if (exit.to === "castle" && !hasHero("siegfried") && !flag("chimera_fought") && !flag("amulet_taken")) {
      toast("The castle gates are watched. Later.");
      return;
    }
    if (exit.to === "berlin" && !flag("karsten_gone")) {
      toast("Karsten asked you not to leave unless the house is on fire.");
      return;
    }
    if (exit.to === "berlin" && !flag("kausen_talk")) {
      toast("Jonathan Kausen knows the road to Wiesbaden and Berlin.");
      return;
    }
    if (exit.to === "loft" && !flag("met_molly") && state.map !== "berlin") {
      toast("The loft belongs to someone who still believes in Christmas.");
      return;
    }
    if (exit.to === "mountain" && !flag("got_sledge")) {
      toast("You need Molly's sleigh — Sledge — to reach the Frozen Mountain.");
      return;
    }
    if (exit.to === "caves" && !flag("sentry_down") && state.map === "mountain") {
      toast("The stone sentry does not step aside.");
      return;
    }
    if (exit.to === "wyrmlair" && !flag("witter_scry")) {
      toast("The shafts swallow wanderers. Witter can scry a way.");
      return;
    }
    if (exit.to === "eastberlin" && !flag("wyrm_down")) {
      toast("The Frozen Globe still pulls toward the mountain.");
      return;
    }
    if (exit.to === "ewyncot" && !flag("met_peter")) {
      toast("Peter has not finished insulting the silence. Talk to him first.");
      return;
    }
    if (exit.to === "rhine" && !flag("got_cloak")) {
      toast("Ewyn's cottage first. Peter will not walk the Rhine unarmored.");
      return;
    }
    if (exit.to === "sansomnia" && !flag("lorelei_free")) {
      toast("Lorelei's watch opens the pilgrim road. Wake her first.");
      return;
    }
    if (exit.to === "dolorii" && !flag("got_mask")) {
      toast("Olear would not send you on without a pilgrim's name.");
      return;
    }
    if (exit.to === "council" && !flag("met_cahni")) {
      toast("Cahni's hospitality first. Then the Council.");
      return;
    }
    if (exit.to === "refuge" && !flag("doom_down")) {
      toast("The Doom Tone still hangs in the council chamber.");
      return;
    }
    if (exit.to === "sanctuary" && !flag("howa_song")) {
      toast("Howa has not yet taught the mountain to move.");
      return;
    }
    if (exit.to === "skyisle" && !flag("telegro_ok")) {
      toast("Telegro has not given the heights. Petitioners must attain them.");
      return;
    }
    if (exit.to === "darkespace" && !flag("anchor_set")) {
      toast("Plant the Custodians' anchor first. The box cannot be a prison while it is still a home.");
      return;
    }
    state.map = exit.to;
    state.x = exit.tx * TILE; state.y = exit.ty * TILE;
    if (blocked(state.x, state.y)) {
      const map = MAPS[state.map];
      outer: for (let y = 1; y < map.h - 1; y++) {
        for (let x = 1; x < map.w - 1; x++) {
          if (!SOLID.has(tileAt(map, x, y))) { state.x = x * TILE; state.y = y * TILE; break outer; }
        }
      }
    }
    state._exitLock = true;
    state._encCool = 2;
    startMusic(currentMap().music);
    renderHud();
    save(true);
    beep(520, 0.05, "square", 0.04);
    preludeArrive();
  }

  async function preludeArrive() {
    if (state.book !== 0) return;
    if (state.map === "woods_pre" && !flag("heard_melody")) {
      setFlag("heard_melody");
      state.quest = "woods_pre";
      renderHud();
      await story([
        ["", "A haunting melody, like a music box, threads the snow-capped forest."],
        ["Jorgen", "Lorelei lured sailors on these cliffs. Someone has painted a cabin black."],
        ["", "A woman in a pale dress runs toward the drop above the Felsenkirche. You cannot reach her in time."]
      ]);
      return;
    }
    if (state.map === "jorgen_house" && flag("heard_melody") && flag("karsten_gone") && !flag("klara_arrived") && !flag("klara_lost")) {
      setFlag("klara_arrived");
      state.quest = "klara_pre";
      renderHud();
      await story([
        ["", "An urgent knock. Klara Engel stands in the doorway, golden hair in shambles, bright blue eyes raw with tears."],
        ["Klara", "Frieda fell from the cliff above the Felsenkirche. People are whispering. Some even mentioned your name."],
        ["Jorgen", "Come in from the cold. I will play until the dark melody lets you go."]
      ]);
      return;
    }
    if (state.map === "cabin_pre" && !flag("cabin_seen")) {
      setFlag("cabin_seen");
      await story([
        ["", "The black cabin smells of varnish and old songs. A device like an oversized music-box mechanism ticks without a hand to wind it."],
        ["Jorgen", "Klara?"]
      ]);
    }
  }

  async function talk(npc) {
    const id = npc.id;
    if (id === "karsten_pre") {
      if (flag("karsten_gone")) return;

  function flagHeal(item) {
    const it = ITEMS[item];
    if (!it || !state.inventory[item]) return false;
    state.inventory[item]--;
    state.party.forEach((p) => {
      if (it.heal) p.hp = Math.min(p.maxHp, p.hp + it.heal);
      if (it.mp) p.mp = Math.min(p.maxMp, p.mp + it.mp);
    });
    return true;
  }

  /* ---------- Battle ---------- */
  let afterBattle = null;
  function startBattle(ids, opt = {}) {
    afterBattle = opt.after || null;
    const enemies = ids.map((id, i) => {
      const e = ENEMIES[id];
      return { ...e, id, hp: e.hp, maxHp: e.hp, x: 80 + i * 70, y: 140 };
    });
    battle = {
      enemies, party: state.party.map((p) => ({ ...p })),
      turn: 0, actor: 0, acted: 0,
      log: "A hostile melody takes shape!",
      menu: "cmd", pending: null
    };
    mode = "battle";
    $("battle").classList.remove("hidden");
    startMusic(enemies.some((e) => e.boss) ? "boss" : "battle");
    beep(220, 0.1, "sawtooth", 0.06);
    renderBattle();
  }
  function battleLog(t) { battle.log = t; announce(t); }
  function living(side) { return side.filter((x) => x.hp > 0); }

    g.fillStyle = e.tint;
    if (e.id === "snake" || e.name.includes("Serpent")) {

      g.fillStyle = "#1a2018"; g.fillRect(x + 14, y + 16, 6, 6); g.fillRect(x + 36, y + 16, 6, 6);
    } else if (e.id === "wolf") {
      g.fillRect(x + 8, y + 28, 56, 40);
      g.fillRect(x + 36, y + 8, 28, 28);
      g.fillStyle = "#1a1020"; g.fillRect(x + 44, y + 16, 5, 5);
    } else if (e.id === "edelphus") {
      g.fillStyle = "#140818"; g.fillRect(x + 10, y, 48, 90);
      g.fillStyle = "#3a2418"; g.fillRect(x + 18, y + 18, 32, 24);
      g.fillStyle = "#c9a24a"; g.fillRect(x + 22, y + 24, 4, 4); g.fillRect(x + 38, y + 24, 4, 4);

      g.fillRect(x + 46, y + 8, 22, 28);

  function drawBattleCanvas() {
    if (!battle) return;
    const g = bctx;
    g.fillStyle = "#152044"; g.fillRect(0, 0, 960, 372);
    g.fillStyle = "#0e1830"; g.fillRect(0, 260, 960, 112);
    if (state.map === "woods" || state.map === "clearing" || state.map === "garden" || state.map === "woods_edge") {
      g.fillStyle = "#1a3a28"; g.fillRect(0, 0, 960, 260);
    }
    if (state.map === "middlespace") { g.fillStyle = "#eef2ff"; g.fillRect(0, 0, 960, 260); }
    if (state.map === "mountain" || state.map === "wyrmlair" || state.map === "caves") { g.fillStyle = "#1a3048"; g.fillRect(0, 0, 960, 260); }
    if (state.map === "berlin" || state.map === "eastberlin") { g.fillStyle = "#2a2420"; g.fillRect(0, 0, 960, 260); }
    if (state.map === "greyking" || state.map === "darkespace") { g.fillStyle = "#1a1020"; g.fillRect(0, 0, 960, 260); }
    if (state.map === "sanctuary" || state.map === "skyisle") { g.fillStyle = "#6ab8e8"; g.fillRect(0, 0, 960, 260); }
    battle.enemies.forEach((e, i) => {
      if (e.hp <= 0) return;
      const x = 90 + i * 140, y = 118;
      drawFoe(g, e, x, y);
      g.fillStyle = "#fff3c4";
      g.font = "12px monospace";
      g.fillText(e.name, x - 10, 100);
      g.fillStyle = "#3a1020"; g.fillRect(x, 214, 72, 8);
      g.fillStyle = "#d4454a"; g.fillRect(x, 214, 72 * Math.max(0, e.hp) / e.maxHp, 8);
    });
    battle.party.forEach((p, i) => {
      const spr = sprites[p.id];
      if (spr && p.hp > 0) g.drawImage(spr, 0, 0, 16, 24, 700, 80 + i * 70, 48, 72);
    });
  }

  function renderBattle() {
    if (!battle) return;
    drawBattleCanvas();
    $("battleLog").textContent = ((currentHero() || {}).name ? currentHero().name + " — " : "") + battle.log;
    $("battleParty").innerHTML = battle.party.map((p) =>
      `${p.hp <= 0 ? "KO " : ""}${p.name}<br>HP ${Math.max(0, p.hp)}/${p.maxHp}  MP ${p.mp}/${p.maxMp}<br><br>`
    ).join("");
    const box = $("battleCmds");
    box.innerHTML = "";
    if (battle.menu === "cmd") {
      [["Attack", "attack"], ["Canticle", "magic"], ["Item", "item"], ["Defend", "defend"], ["Flee", "flee"]].forEach(([label, cmd]) => {
        const b = document.createElement("button");
        b.className = "cmd-btn"; b.textContent = label;
        b.onclick = () => heroCmd(cmd);
        box.appendChild(b);
      });
    } else if (battle.menu === "magic") {
      const hero = currentHero();
      Object.entries(CANTICLES).filter(([, c]) => c.who.includes(hero.id)).forEach(([id, c]) => {
        const b = document.createElement("button");
        b.className = "cmd-btn";
        b.textContent = `${c.name} (${c.mp})`;
        b.onclick = () => pickCanticle(id);
        box.appendChild(b);
      });
      const back = document.createElement("button");
      back.className = "cmd-btn"; back.textContent = "Back";
      back.onclick = () => { battle.menu = "cmd"; renderBattle(); };
      box.appendChild(back);
    } else if (battle.menu === "item") {
      ["porridge", "sausage", "draught", "charm", "cocoa", "feast"].forEach((id) => {
        const b = document.createElement("button");
        b.className = "cmd-btn";
        b.textContent = `${ITEMS[id].name} x${state.inventory[id] || 0}`;
        b.onclick = () => useBattleItem(id);
        box.appendChild(b);
      });
      const back = document.createElement("button");
      back.className = "cmd-btn"; back.textContent = "Back";
      back.onclick = () => { battle.menu = "cmd"; renderBattle(); };
      box.appendChild(back);
    } else if (battle.menu === "target") {
      living(battle.enemies).forEach((e) => {
        const b = document.createElement("button");
        b.className = "cmd-btn"; b.textContent = e.name;
        b.onclick = () => resolveHero(e);
        box.appendChild(b);
      });
    }
  }
  function currentHero() {
    if (!battle) return null;
    const alive = battle.party.filter((p) => p.hp > 0);
    if (!alive.length) return null;
    const idx = Math.max(0, battle.actor) % battle.party.length;
    if (battle.party[idx] && battle.party[idx].hp > 0) return battle.party[idx];
    return alive[0];
  }
  function nextLivingActor(from) {
    for (let i = 1; i <= battle.party.length; i++) {
      const idx = (from + i) % battle.party.length;
      if (battle.party[idx].hp > 0) return idx;
    }
    return from;
  }
  function heroCmd(cmd) {
    const hero = currentHero();
    if (!hero) return;
    if (cmd === "flee") {
      if (battle.enemies.some((e) => e.boss)) { battleLog("The melody will not let you go."); renderBattle(); return; }
      if (Math.random() < 0.55) { battleLog("You flee!"); finishBattle(false); return; }
      battleLog("Couldn't run!"); afterHero(); return;
    }
    if (cmd === "defend") {
      hero.defending = true;
      battleLog(`${hero.name} steadies their stance.`);
      afterHero(); return;
    }
    if (cmd === "magic") { battle.menu = "magic"; renderBattle(); return; }
    if (cmd === "item") { battle.menu = "item"; renderBattle(); return; }
    battle.pending = { type: "attack" };
    battle.menu = "target";
    renderBattle();
  }
  function pickCanticle(id) {
    const hero = currentHero();
    if (!hero) return;
    const c = CANTICLES[id];
    if (hero.mp < c.mp) { battleLog("Not enough music in the breath."); battle.menu = "cmd"; renderBattle(); return; }
    battle.pending = { type: "magic", id };
    if (c.heal) { castOnParty(c, hero); return; }
    if (c.all) { living(battle.enemies).forEach((e) => hit(e, c.pow + hero.mag, hero.name, c.name)); hero.mp -= c.mp; afterHero(); return; }
    battle.menu = "target";
    renderBattle();
  }
  function castOnParty(c, hero) {
    hero.mp -= c.mp;
    battle.party.forEach((p) => { if (p.hp > 0) p.hp = Math.min(p.maxHp, p.hp + c.heal); });
    battleLog(`${hero.name} sings ${c.name}!`);
    beep(784, 0.12, "sine", 0.07);
    afterHero();
  }
  function useBattleItem(id) {
    if (!state.inventory[id]) { battleLog("None left."); return; }
    const hero = currentHero();
    if (!hero) return;
    state.inventory[id]--;
    const it = ITEMS[id];
    hero.hp = Math.min(hero.maxHp, hero.hp + (it.heal || 0));
    hero.mp = Math.min(hero.maxMp, hero.mp + (it.mp || 0));
    battleLog(`${hero.name} uses ${it.name}.`);
    afterHero();
  }
  function resolveHero(target) {
    const hero = currentHero();
    if (!hero || !target) return;
    const p = battle.pending || { type: "attack" };
    if (p.type === "magic") {
      const c = CANTICLES[p.id];
      hero.mp -= c.mp;
      hit(target, c.pow + hero.mag, hero.name, c.name);
      if (c.slow) target.spd = Math.max(1, target.spd - 3);
    } else {
      hit(target, hero.atk + (state.flags.sword_blessed && hero.id === "johann" ? 4 : 0) + (state.inventory.sword && hero.id === "johann" ? 3 : 0), hero.name, "attack");
    }
    afterHero();
  }
  function hit(target, dmg, from, move) {
    const def = target.def + (target.defending ? 4 : 0);
    const dealt = Math.max(1, dmg - def + Math.floor(Math.random() * 4) - 1);
    target.hp -= dealt;
    target.defending = false;
    battleLog(`${from} ${move === "attack" ? "strikes" : "uses " + move}! ${target.name || target.id} takes ${dealt}.`);
    beep(move === "attack" ? 180 : 520, 0.08, "square", 0.05);
  }
  function afterHero() {
    if (living(battle.enemies).length === 0) { finishBattle(true); return; }
    battle.acted = (battle.acted || 0) + 1;
    const livingCount = living(battle.party).length;
    if (livingCount === 0) { enemyTurns(); return; }
    if (battle.acted >= livingCount) {
      battle.acted = 0;
      enemyTurns();
      return;
    }
    battle.actor = nextLivingActor(battle.actor);
    battle.menu = "cmd";
    battle.pending = null;
    renderBattle();
  }
  function enemyTurns() {
    for (const e of living(battle.enemies)) {
      const targets = living(battle.party);
      if (!targets.length) break;
      const t = targets[Math.floor(Math.random() * targets.length)];
      hit(t, e.atk, e.name, "attack");
      if (t.hp <= 0) battleLog(`${t.name} falls!`);
    }
    battle.party.forEach((p, i) => {
      if (!state.party[i]) return;
      state.party[i].hp = Math.max(0, p.hp);
      state.party[i].mp = p.mp;
    });
    if (living(battle.party).length === 0) {
      battleLog("The song goes dark...");
      renderBattle();
      setTimeout(() => {
        healParty(false);
        state.party.forEach((p) => { p.hp = Math.max(1, Math.floor(p.maxHp * 0.45)); });
        finishBattle(false, true);
        toast("You stumble back, half-conscious.");
      }, 700);
      return;
    }
    battle.actor = battle.party.findIndex((p) => p.hp > 0);
    if (battle.actor < 0) battle.actor = 0;
    battle.acted = 0;
    battle.menu = "cmd";
    battle.pending = null;
    renderBattle();
  }
  function finishBattle(won, faint) {
    const after = afterBattle;
    afterBattle = null;
    $("battle").classList.add("hidden");
    mode = "explore";
    state._encCool = 8;
    if (won) {
      const xp = battle.enemies.reduce((s, e) => s + e.xp, 0);
      const gold = battle.enemies.reduce((s, e) => s + e.gold, 0);
      state.gold += gold;
      toast(`Victory. +${xp} lore  +${gold} gold`);
      battle.party.forEach((p, i) => {
        if (!state.party[i]) return;
        state.party[i].hp = Math.max(1, p.hp);
        state.party[i].mp = p.mp;
      });
      if (after === "serpent") afterSerpent();
      if (after === "chimera") afterChimera();
      if (after === "final") afterFinal();
      if (after === "bruno_bully") story([["Bruno", "Fine! Fine! The woods can have you both."]]);
      if (after === "bakery") afterBakery();
      if (after === "sentry") afterSentry();
      if (after === "wyrm") afterWyrm();
      if (after === "final2") afterFinal2();
      if (after === "bruno_roar") afterBrunoRoar();
      if (after === "doom") afterDoom();
      if (after === "final3") afterFinal3();
      if (after === "edelphus") afterEdelphus();
    }
    battle = null;
    startMusic(currentMap().music);
    renderHud();
    save(true);
  }

  /* ---------- Draw world ---------- */
  function drawWorld() {
    const map = currentMap();
    const camX = Math.max(0, Math.min(state.x - VW / 2 + 8, map.w * TILE - VW));
    const camY = Math.max(0, Math.min(state.y - VH / 2 + 8, map.h * TILE - VH));
    ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
    ctx.fillStyle = "#05070e";
    ctx.fillRect(0, 0, VW, VH);
    const x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE);
    for (let y = y0; y <= y0 + 13; y++) {
      for (let x = x0; x <= x0 + 22; x++) {
        const t = tileAt(map, x, y);
        ctx.drawImage(tileCanvas(t), Math.floor(x * TILE - camX), Math.floor(y * TILE - camY));
      }
    }
    map.npcs.forEach((n) => {
      if (!npcActive(n)) return;
      const spr = sprites[n.sprite] || sprites.town;
      ctx.drawImage(spr, Math.floor(n.x * TILE - camX), Math.floor(n.y * TILE - camY - (spr.height - 16)));
    });
    const bob = settings.reduce ? 0 : ((anim / 200 | 0) % 2);
    const hero = state.book === 0 ? sprites.jorgen : sprites.johann;
    ctx.drawImage(hero, Math.floor(state.x - camX), Math.floor(state.y - camY - 8 - bob));
    if (hasHero("brigitta")) ctx.drawImage(sprites.brigitta, Math.floor(state.x - camX - 10), Math.floor(state.y - camY - 6));
    if (hasHero("siegfried")) ctx.drawImage(sprites.siegfried, Math.floor(state.x - camX + 12), Math.floor(state.y - camY - 10));
    if (hasHero("nachtigal")) ctx.drawImage(sprites.nachtigal, Math.floor(state.x - camX - 18), Math.floor(state.y - camY - 4));
    if (hasHero("bruno")) ctx.drawImage(sprites.bruno, Math.floor(state.x - camX + 20), Math.floor(state.y - camY - 4));
    if (hasHero("richard")) ctx.drawImage(sprites.richard, Math.floor(state.x - camX + 2), Math.floor(state.y - camY - 14));
    if (hasHero("howa")) ctx.drawImage(sprites.howa, Math.floor(state.x - camX - 22), Math.floor(state.y - camY - 2));
  }

  function update(dt) {
    if (mode !== "explore") return;
    const sp = 70;
    let dx = 0, dy = 0;
    if (held.has("arrowleft") || held.has("a")) dx -= 1;
    if (held.has("arrowright") || held.has("d")) dx += 1;
    if (held.has("arrowup") || held.has("w")) dy -= 1;
    if (held.has("arrowdown") || held.has("s")) dy += 1;
    if (dx || dy) {
      if (Math.abs(dx) > Math.abs(dy)) state.dir = dx < 0 ? "left" : "right";
      else state.dir = dy < 0 ? "up" : "down";
      const nx = state.x + dx * sp * dt;
      const ny = state.y + dy * sp * dt;
      if (!blocked(nx, state.y)) state.x = nx;
      if (!blocked(state.x, ny)) state.y = ny;
      const map = currentMap();
      const tx = Math.floor((state.x + 8) / TILE), ty = Math.floor((state.y + 12) / TILE);
      const exit = map.exits.find((e) => e.x === tx && e.y === ty);
      if (exit && (state.dir === "up" && dy < 0 || state.dir === "down" && dy > 0 || state.dir === "left" && dx < 0 || state.dir === "right" && dx > 0)) {
        if (!state._exitLock) { state._exitLock = true; useExit(exit); }
      } else state._exitLock = false;
      if (map.encounters && (state._encCool || 0) <= 0 && Math.random() < 0.0018 && !flag("no_enc")) {
        state._encCool = 14;
        const id = map.encounters[Math.floor(Math.random() * map.encounters.length)];
        startBattle([id]);
      }
    }
    if (state._encCool > 0) state._encCool -= dt;
    state.playtime += dt;
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now; anim += now ? 16 : 0;
    update(dt);
    if (mode === "explore" || mode === "dialog") drawWorld();
    if (mode === "battle") drawBattleCanvas();
    requestAnimationFrame(loop);
  }

  function useFieldItem(id) {
    const it = ITEMS[id];
    if (!it || it.key || !state.inventory[id]) { toast("Nothing to use."); return; }
    if (!it.heal && !it.mp) { toast("That cannot be used here."); return; }
    state.inventory[id]--;
    state.party.forEach((p) => {
      if (it.heal) p.hp = Math.min(p.maxHp, p.hp + it.heal);
      if (it.mp) p.mp = Math.min(p.maxMp, p.mp + it.mp);
    });
    toast(`Used ${it.name}.`);
    renderHud();
    save(true);
  }

  function openPause(view = "root") {
    pauseView = view;

      const rows = Object.entries(state.inventory).filter(([, n]) => n > 0);

        }).join("")
        : "Pockets empty.";
      extra.querySelectorAll("[data-use-item]").forEach((b) => {

  /* ---------- Input ---------- */
  function keydown(e) {
    const k = e.key.toLowerCase();
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter"].includes(k)) e.preventDefault();
    if (k === "o") { $("options").classList.toggle("hidden"); return; }
    if (mode === "title" && (k === "enter" || k === " ")) { e.preventDefault(); startNew(); return; }
    if (mode === "cine" && (k === "enter" || k === " ")) { advanceCine(); return; }
    if (mode === "dialog" && (k === "enter" || k === " ")) {
      const choice = $("dialogChoices").querySelector("button");
      if (choice) { choice.click(); return; }
      if (dialogResolve) {
        const r = dialogResolve; closeDialog(); r(true);
      }
      return;
    }
    if (mode === "pause" && k === "escape") { $("pause").classList.add("hidden"); mode = "explore"; return; }
    if (mode === "battle" && battle) {
      e.preventDefault();
      if (k === "escape" && battle.menu !== "cmd") {
        battle.menu = "cmd"; battle.pending = null; renderBattle(); return;
      }
      const btns = [...document.querySelectorAll("#battleCmds .cmd-btn")];
      if (battle.menu === "cmd") {
        const cmds = { "1": "attack", "2": "magic", "3": "item", "4": "defend", "5": "flee" };
        if (cmds[k]) heroCmd(cmds[k]);
      } else if (/^[1-9]$/.test(k) && btns[Number(k) - 1]) {
        btns[Number(k) - 1].click();
      } else if ((k === "enter" || k === " ") && btns[0]) {
        btns[0].click();
      }
      return;
    }
    if (mode === "explore") {
      if (k === "enter" || k === " ") interact();
      if (k === "i") openPause("items");
      if (k === "j") openPause("journal");
      if (k === "escape") openPause("root");
      held.add(k);
    }
  }
  function keyup(e) { held.delete(e.key.toLowerCase()); }

  function startNew() {
    ensureAudio();
    resetGame(0);
    showPrologue(0);
  }
  function startBook2() {
    ensureAudio();
    resetGame(2);
    showPrologue2(0);
  }
  function startBook3() {
    ensureAudio();
    resetGame(3);
    showPrologue3(0);
  }

  $("newGameBtn").onclick = startNew;
  $("book2Btn").onclick = startBook2;
  $("book3Btn").onclick = startBook3;
  $("continueBtn").onclick = () => { if (load()) { ensureAudio(); beginExplore(true); } };
  $("optionsBtn").onclick = () => $("options").classList.remove("hidden");
  $("closeOptions").onclick = () => $("options").classList.add("hidden");
  $("resumeBtn").onclick = () => { $("pause").classList.add("hidden"); mode = "explore"; };
  $("itemsBtn").onclick = () => openPause("items");
  $("journalBtn").onclick = () => openPause("journal");
  $("saveBtn").onclick = () => save();
  $("quitTitleBtn").onclick = () => { save(true); $("pause").classList.add("hidden"); $("title").classList.remove("hidden"); mode = "title"; startMusic("title"); };
  $("endTitleBtn").onclick = () => { $("ending").classList.add("hidden"); $("title").classList.remove("hidden"); mode = "title"; startMusic("title"); };
  $("endBook2Btn").onclick = () => { $("ending").classList.add("hidden"); startBook2(); };
  $("endBook3Btn").onclick = () => { $("ending").classList.add("hidden"); startBook3(); };
  $("cinematic").onclick = () => { if (mode === "cine") advanceCine(); };
  $("dialog").onclick = (e) => {
    if (e.target.closest("button")) return;
    if (mode === "dialog" && !$("dialogChoices").childElementCount && dialogResolve) {
      const r = dialogResolve; closeDialog(); r(true);
    }
  };
  $("musicVol").oninput = (e) => { settings.music = +e.target.value; };
  $("sfxVol").oninput = (e) => { settings.sfx = +e.target.value; };
  $("reduceMotion").onchange = (e) => { settings.reduce = e.target.checked; };
  document.querySelectorAll("[data-dir]").forEach((b) => {
    const press = (ev) => { ev.preventDefault(); held.add({ up: "arrowup", down: "arrowdown", left: "arrowleft", right: "arrowright" }[b.dataset.dir]); };
    const rel = () => held.delete({ up: "arrowup", down: "arrowdown", left: "arrowleft", right: "arrowright" }[b.dataset.dir]);
    b.addEventListener("pointerdown", press); b.addEventListener("pointerup", rel); b.addEventListener("pointercancel", rel);
  });
  $("mobA").onclick = () => { if (mode === "explore") interact(); else if (mode === "cine") advanceCine(); };
  $("mobB").onclick = () => openPause("root");

  window.addEventListener("keydown", keydown, { passive: false });
  window.addEventListener("keyup", keyup);
  window.addEventListener("resize", fitViewport);
  document.addEventListener("visibilitychange", () => { if (document.hidden) stopMusic(); else if (musicMode) startMusic(musicMode); });

  if (/(?:^|[?&])debug=1(?:&|$)/.test(location.search)) {
    window.CanticleDebug = {
      snapshot() { return { mode, map: state.map, quest: state.quest, book: state.book, party: state.party.map((p) => ({ id: p.id, hp: p.hp, atk: p.atk })), flags: { ...state.flags }, inv: { ...state.inventory }, gold: state.gold }; },
      state,
      startBook2,
      startBook3,
      startNew,
      startBook1() { resetGame(1); beginExplore(); },
      warp(map, x, y) { state.map = map; state.x = x * TILE; state.y = y * TILE; state._exitLock = false; renderHud(); },
      join(id) { if (!hasHero(id)) state.party.push(member(id)); },
      flag: setFlag, battle: startBattle,
      talkId(id) {
        const n = currentMap().npcs.find((npc) => npc.id === id);
        if (n) talk(n);
      },
      noEnc() { state.flags.no_enc = true; },
      forceWin() { if (battle) { battle.enemies.forEach((e) => e.hp = 0); finishBattle(true); } },
      useItem: useFieldItem,
      maps: MAPS,
      clickCine() { if (mode === "cine") { advanceCine(); return true; } return false; },
      useExitAt(x, y) {
        const e = currentMap().exits.find((ex) => ex.x === x && ex.y === y);
        if (!e) return false;
        state._exitLock = false;
        useExit(e);
        return true;
      },
      audit() {
        const issues = [];
        const key = (x, y) => x + "," + y;
        Object.values(MAPS).forEach((map) => {
          const walk = (x, y) => x >= 0 && y >= 0 && x < map.w && y < map.h && !SOLID.has(tileAt(map, x, y));
          const seen = new Set();
          const q = [];
          const add = (x, y) => { const k = key(x, y); if (seen.has(k) || !walk(x, y)) return; seen.add(k); q.push([x, y]); };
          add(map.start[0], map.start[1]);
          map.exits.forEach((e) => add(e.x, e.y));
          map.exits.forEach((e) => {
            const dest = MAPS[e.to];
            if (!dest) issues.push(`${map.id}: exit to missing map ${e.to}`);
            else if (SOLID.has(tileAt(map, e.x, e.y))) issues.push(`${map.id}: exit ${e.x},${e.y} -> ${e.to} stands on solid`);
          });
          while (q.length) {
            const [x, y] = q.shift();
            add(x + 1, y); add(x - 1, y); add(x, y + 1); add(x, y - 1);
          }
          map.npcs.forEach((n) => {
            if (!sprites[n.sprite]) issues.push(`${map.id}: ${n.id} missing sprite ${n.sprite}`);
            const here = walk(n.x, n.y) && seen.has(key(n.x, n.y));
            const near = [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => seen.has(key(n.x + dx, n.y + dy)));
            if (!here && !near) issues.push(`${map.id}: ${n.id} unreachable at ${n.x},${n.y}`);
          });
          map.exits.forEach((e) => {
            if (!seen.has(key(e.x, e.y)) && !walk(e.x, e.y)) issues.push(`${map.id}: exit to ${e.to} unreachable`);
            const dest = MAPS[e.to];
            if (dest && SOLID.has(tileAt(dest, e.tx, e.ty))) issues.push(`${map.id}: lands in ${e.to} on solid ${e.tx},${e.ty}`);
          });
          if (map.encounters) map.encounters.forEach((id) => { if (!ENEMIES[id]) issues.push(`${map.id}: missing enemy ${id}`); });
        });
        return issues;
      },
      clickDialog() {
        const choice = $("dialogChoices").querySelector("button");
        if (choice) { choice.click(); return "choice"; }
        if (dialogResolve) { const r = dialogResolve; closeDialog(); r(true); return "advance"; }
        return "none";
      },
      battleClick(label) {
        const btn = [...document.querySelectorAll("#battleCmds .cmd-btn")].find((b) => b.textContent.startsWith(label));
        if (btn) btn.click();
        return !!btn;
      }
    };
  }

  buildSprites();
  drawTitleArt();
  $("continueBtn").disabled = !localStorage.getItem(SAVE_KEY);
  fitViewport();
  startMusic("title");
  requestAnimationFrame(loop);
})();
  </script>
</body>
</html>
