<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Wandaful — 16-bit RPG</title>
  <style>
    :root { --gold:#f0d060; --pale:#fff6d8; --ink:#14081c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #08040e; color: var(--pale);
      font-family: "Courier New", Courier, ui-monospace, monospace;
      overflow: hidden; user-select: none; touch-action: none;
    }
    #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
    #stage {
      position: relative; image-rendering: pixelated; image-rendering: crisp-edges;
      box-shadow: 0 0 0 3px #3a1848, 0 0 0 6px #f0d060, 0 18px 50px rgba(180,40,90,.35);
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .overlay { position: absolute; inset: 0; display: none; pointer-events: none; }
    .overlay.show { display: block; }
    #titleUI, #endingUI {
      pointer-events: auto; text-align: center; padding: 16px 12px 10px; color: var(--pale);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,70,110,.28), transparent 46%),
        radial-gradient(circle at 18% 70%, rgba(70,140,255,.22), transparent 34%),
        linear-gradient(#1a0820, #08040e 60%, #1c0a28);
    }
    #titleUI h1, #endingUI h1 {
      margin: 0; font-size: 28px; letter-spacing: .18em; color: #ffe58a;
      text-shadow: 3px 3px 0 #6a1040, -1px 0 #ff4a8a;
    }
    #titleUI .sub, #endingUI .sub { margin: 6px 0 14px; color: #ffb4d0; font-size: 11px; letter-spacing: .1em; }
    .menu-btn {
      pointer-events: auto; display: block; width: min(280px, 86%); margin: 7px auto;
      padding: 8px 10px; border: 3px solid var(--gold); background: linear-gradient(#6a1848, #2a0820);
      color: var(--pale); font: 700 13px "Courier New", monospace; letter-spacing: .08em;
      cursor: pointer; text-shadow: 2px 2px #000;
    }
    .menu-btn:hover, .menu-btn:focus { filter: brightness(1.2); outline: none; }
    #dialog {
      position: absolute; left: 6px; right: 6px; bottom: 6px; min-height: 58px;
      border: 3px solid var(--gold); background: rgba(16,6,22,.94); color: var(--pale);
      padding: 7px 10px 8px; font-size: 12px; line-height: 1.35; pointer-events: auto;
      text-shadow: 1px 1px #000; display: none; z-index: 40;
    }
    #dialog.show { display: block; }
    #dialog .who { color: var(--gold); font-weight: 700; letter-spacing: .06em; }
    #dialog .next { position: absolute; right: 8px; bottom: 4px; color: var(--gold); animation: blink 1s steps(2) infinite; }
    #hud, #goal { position: absolute; left: 6px; right: 6px; pointer-events: none; text-shadow: 1px 1px #000; z-index: 4; }
    #hud { top: 6px; display: none; font-size: 10px; justify-content: space-between; gap: 8px; }
    #hud.show { display: flex; }
    .hud-card { border: 2px solid #f0d060; background: rgba(16,6,22,.86); padding: 4px 7px; min-width: 108px; }
    .hpbar { height: 5px; background: #2a1830; margin-top: 3px; }
    .hpbar > i { display: block; height: 100%; background: linear-gradient(#7dff9a, #1f9a4a); }
    .hpbar.low > i { background: linear-gradient(#ff7a62, #b41e2e); }
    .chromabar > i { background: linear-gradient(#7ec8ff, #3a6ad0); }
    #goal { top: 46px; display: none; font-size: 10px; color: #ffd0e8; }
    #goal.show { display: block; }
    #pause, #battle, #codex {
      position: absolute; inset: 0; display: none; pointer-events: auto;
      background: rgba(6,2,10,.76); z-index: 32;
    }
    #pause.show, #battle.show, #codex.show { display: grid; place-items: center; }
    .panel {
      width: min(320px, 94%); border: 3px solid var(--gold); background: #160816;
      padding: 10px; color: var(--pale); font-size: 12px;
    }
    .panel.wide { width: min(360px, 96%); }
    .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .1em; }
    .panel button, .blist button, .choice {
      display: block; width: 100%; margin: 4px 0; padding: 6px; border: 2px solid #c9a33a;
      background: #3a1430; color: var(--pale); font: 700 12px "Courier New", monospace;
      cursor: pointer; text-align: left;
    }
    .panel button:hover, .blist button:hover, .choice:hover { filter: brightness(1.18); }
    .blist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .brow { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .bstat { flex: 1; border: 2px solid #8a4068; padding: 5px; background: #100610; }
    .hue-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; box-shadow: 0 0 6px currentColor; }
    .log { min-height: 32px; color: #ffe8c8; font-size: 11px; line-height: 1.35; margin: 6px 0; }
    #mobile {
      display: none; position: absolute; left: 0; right: 0; bottom: 8px; height: 132px;
      pointer-events: none; justify-content: space-between; padding: 0 12px;
    }
    .pad, .ab { pointer-events: auto; }
    .pad { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; gap: 4px; }
    .pad b, .ab b {
      display: grid; place-items: center; border: 2px solid #f0d060; background: rgba(40,10,36,.8);
      color: #fff6d8; font-size: 14px; font-weight: 700;
    }
    .pad b:nth-child(1), .pad b:nth-child(3), .pad b:nth-child(7), .pad b:nth-child(9) { visibility: hidden; }
    .ab { display: flex; gap: 10px; align-items: flex-end; }
    .ab b { width: 54px; height: 54px; border-radius: 50%; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 820px), (pointer: coarse) {
      #mobile { display: flex; }
      #wrap { align-items: start; padding-top: 8px; }
    }
  </style>
</head>

/* ------------------------------------------------------------------ */
/*  Chroma combat, from the novels.                                   */
/*  Chroma is magical matter (millions of shades). Ordinary           */
/*  objects hold it. Breaking, squeezing, or channeling releases it.  */
/*  Primaries: red, yellow, blue. Secondaries: green, purple, orange. */
/*  Opposites cancel: red↔green, yellow↔purple, blue↔orange.          */
/*  Black + white = the Spectrum's most powerful reaction.            */
/*  Dark Chroma drinks unmatched color. Vitas fuels the work.         */
/*  Hal's native hue is yellow; his Wand reads white. Wanda is blue.  */
/* ------------------------------------------------------------------ */
const SPECTRUM = {
  order: ["red", "orange", "yellow", "green", "blue", "purple"],
  hex: {
    red: "#e23a3a", orange: "#f08a28", yellow: "#f0d030",
    green: "#3cb464", blue: "#3a78e0", purple: "#8a4ae0",
    white: "#f4f0ff", black: "#1a1018", dark: "#142038"
  },
  meaning: {
    red: "primary — cancelled by green",
    orange: "secondary — cancelled by blue",
    yellow: "primary — Hal's native Chroma",
    green: "secondary — cancelled by red",
    blue: "primary — Wanda's native Chroma; Blue Wavelength",
    purple: "secondary — cancelled by yellow"
  },
  conduit: {
    red: "Misha's knitting-needle Wand",
    orange: "hint in the rubber duck",
    yellow: "rubber duck; Hal's native burst",
    green: "green pencil; action figure",
    blue: "Wanda's paintbrush trail",
    purple: "action-figure haze"
  },
  warm: ["red", "orange", "yellow"],
  cool: ["green", "blue", "purple"],
  index(c) { return this.order.indexOf(c); },
  opposite(c) {
    const i = this.index(c);
    return i < 0 ? null : this.order[(i + 3) % 6];
  },
  relation(atk, def) {
    if ((atk === "white" && def === "black") || (atk === "black" && def === "white")) return "spectrum";
    if (atk === "white") return "white";
    if (def === "black") return "glance";
    const a = this.index(atk), d = this.index(def);
    if (a < 0 || d < 0) return "glance";
    const dist = Math.min((a - d + 6) % 6, (d - a + 6) % 6);
    if (dist === 0) return "resonate";
    if (dist === 1) return "mix";
    if (dist === 2) return "glance";
    return "clash";
  },
  mixName(a, b) {
    const pair = [a, b].sort().join("+");
    return ({
      "orange+red": "Spark",
      "orange+yellow": "Duck-burst",
      "green+yellow": "Bloom",
      "blue+green": "Tide",
      "blue+purple": "Haze",
      "purple+red": "Web"
    })[pair] || "Blend";
  },
  affinity(caster, color) {
    if (color === "white" || color === "black") return 1.3;
    if (caster === "hal") {
      if (color === "yellow") return 1.35;
      return this.warm.includes(color) ? 1.15 : 0.85;
    }
    if (caster === "wanda") {
      if (color === "blue") return 1.35;
      return this.cool.includes(color) ? 1.15 : 0.85;
    }
    return 1;
  },
  resolve(opts) {
    const { color, foeHue, caster, level, stolen, both, dark } = opts;
    let rel = this.relation(color, foeHue);
    const aff = both
      ? (this.affinity("hal", color) + this.affinity("wanda", color)) / 2
      : this.affinity(caster, color);
    const lv = Math.max(1, level || 1);
    let dmg = 6 + lv * 2;
    let heal = 0;
    let steal = false;
    let status = null;
    let log = "";
    if (dark && rel !== "clash" && color !== "white") {
      if (stolen && color === this.opposite(stolen)) {
        rel = "clash";
      } else {
        dmg = 0;
        heal = 6 + lv;
        log = "Dark Chroma drinks the unmatched color.";
        return { rel: "dark", dmg: 0, heal, steal, status, log };
      }
    }
    if (rel === "clash") {
      dmg = Math.round((10 + lv * 3) * aff * (both ? 1.35 : 1));
      log = "COUNTER! Complementary Chroma stings the opposite Wand.";
    } else if (rel === "resonate") {
      dmg = Math.round((3 + lv) * aff);
      steal = true;
      log = "RESONATE. The hues lock. You seize a spark of that Chroma.";
    } else if (rel === "mix") {
      dmg = Math.round((7 + lv * 2) * aff);
      status = this.mixName(color, foeHue);
      log = "MIX into " + status + ". Residue hangs in the air.";
    } else if (rel === "spectrum") {
      dmg = Math.round((28 + lv * 5) * (both ? 1.2 : 1));
      log = "BLACK + WHITE. The Spectrum's most dangerous reaction.";
    } else if (rel === "white") {
      dmg = Math.round((14 + lv * 4) * (both ? 1.2 : 1));
      log = "White Chroma — Hal's Wand, keeping the Spectrum in check.";
    } else {
      dmg = Math.round((5 + lv) * aff);
      log = "A glancing burst. Little purchase.";
    }
    return { rel, dmg: Math.max(0, dmg), heal, steal, status, log };
  }
};

function gridFrom(rows) {
  return { w: rows[0].length, h: rows.length, grid: rows };
}
function fillMap(w, h, wall, floor, extra) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let r = "";
    for (let x = 0; x < w; x++) {
      if (extra && extra[y] && extra[y][x] && extra[y][x] !== " ") r += extra[y][x];
      else if (x === 0 || y === 0 || x === w - 1 || y === h - 1) r += wall;
      else r += floor;
    }
    rows.push(r);
  }
  return gridFrom(rows);
}

const BLOCK_DOOR = "D";

let mode = "title";
let state = null;
let dialogQ = [];
let dialogCb = null;
let typing = "";
let typeFull = "";
let typeT = 0;
let cam = { x: 0, y: 0 };
let anim = 0;
let last = 0;
let battle = null;
let audioCtx = null;
let musicTimer = 0;

function deep(o) { return JSON.parse(JSON.stringify(o)); }
function hasColor(c) { return !!(state && state.colors && state.colors[c]); }
function colorCount() {
  return SPECTRUM.order.filter((c) => hasColor(c)).length;
}

function newState() {
  return {
    ch: 0, hero: "hal",
    x: 4 * TS, y: 6 * TS, dir: "down", moving: false,
    hp: 42, maxHp: 42, chroma: 20, maxChroma: 20, xp: 0, lv: 1,
    items: { candy: 3, milkshake: 1 },
    colors: { yellow: true },
    flags: {},
    party: ["hal"],
    map: "portal",
    notes: {}
  };
}

function chapter() { return CHAPTERS[state.ch]; }
function curMap() { return MAPS[state.map]; }
function tileAt(px, py) {
  const m = curMap();
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (ty < 0 || tx < 0 || ty >= m.h || tx >= m.w) return "#";
  return m.grid[ty][tx];
}
function blocked(px, py) {
  const pts = [[px + 3, py + 10], [px + 12, py + 10], [px + 3, py + 15], [px + 12, py + 15]];
  return pts.some(([x, y]) => BLOCK.has(tileAt(x, y)));
}

function say(who, text) {
  dialogQ.push({ who, text });
  if (!dialogEl.classList.contains("show")) nextLine();
}
function sayMany(lines, cb) {
  lines.forEach((l) => dialogQ.push({ who: l[0], text: l[1] }));
  dialogCb = cb || null;
  if (!dialogEl.classList.contains("show")) nextLine();
}
function nextLine() {
  if (typing.length < typeFull.length) { typing = typeFull; renderDialog(); return; }
  const n = dialogQ.shift();
  if (!n) {
    dialogEl.classList.remove("show");
    typeFull = typing = "";
    const cb = dialogCb; dialogCb = null;
    if (mode === "card") mode = "explore";
    if (cb) cb();
    return;
  }
  const actor = ACTORS[n.who] || { name: n.who };
  dialogEl.querySelector(".who").textContent = actor.name.toUpperCase();
  typeFull = n.text;
  typing = "";
  dialogEl.classList.add("show");
  renderDialog();
}
function renderDialog() { dialogEl.querySelector(".txt").textContent = typing; }

function setGoal(t) {
  goalEl.textContent = t ? "QUEST: " + t : "";
  goalEl.classList.toggle("show", mode === "explore" && !!t);
}

function loadChapter(i, extraIntro) {
  state.ch = i;
  const ch = CHAPTERS[i];
  state.hero = ch.hero;
  state.map = ch.map;
  if (i >= 1 && !state.party.includes("wanda")) state.party.push("wanda");
  state.x = ch.spawn[0] * TS;
  state.y = ch.spawn[1] * TS;
  state.dir = "down";
  state.maxHp = 42 + state.lv * 5;
  state.hp = state.maxHp;
  state.chroma = state.maxChroma;
  mode = "explore";
  titleUI.classList.remove("show");
  endingUI.classList.remove("show");
  pauseEl.classList.remove("show");
  battleEl.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(ch.goal);
  save();
  const lines = [["", "CHAPTER " + (state.ch + 1)], ["", ch.title], ...ch.intro];
  if (extraIntro) lines.push(...extraIntro);
  mode = "card";
  sayMany(lines, () => { mode = "explore"; });
}

function advanceChapter() {
  if (state.ch >= CHAPTERS.length - 1) { finishGame(); return; }
  loadChapter(state.ch + 1);
}

function finishGame() {
  mode = "ending";
  hudEl.classList.remove("show");
  goalEl.classList.remove("show");
  sayMany([
    ["fyodor", "Tomorrow will look different. That is not a threat. It is a schedule."],
    ["wanda", "Then we keep mixing until tomorrow looks like us."],
    ["hal", "White keeps black in check. That is the job. You are my pupil now — if you still want a Wand that used to be a paintbrush."],
    ["wanda", "Wandaful. Not wonderful. You have to get the word right."]
  ], () => {
    endingUI.classList.add("show");
    document.getElementById("endingText").textContent =
      "Fyodor is a man again, for now. Hal takes Wanda as his pupil. The Blue Wavelength keeps its color, the White Wavelength stays out of one Superwielder's pocket, and a disguised Wand still looks like whatever it needs to be.";
    localStorage.removeItem(SAVE_KEY);
  });
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function renderHud() {
  if (!state || mode === "title" || mode === "ending") { hudEl.classList.remove("show"); return; }
  hudEl.classList.add("show");
  const low = state.hp <= state.maxHp * 0.3;

    `<div class="hud-card"><b>${hero.name}</b>  Lv${state.lv}
      <div class="hpbar${low ? " low" : ""}"><i style="width:${Math.max(0, state.hp / state.maxHp * 100)}%"></i></div>
      <div class="hpbar chromabar"><i style="width:${Math.max(0, state.chroma / state.maxChroma * 100)}%"></i></div>
    </div>
    <div class="hud-card">CHROMA
      <div style="margin-top:4px;font-size:9px;letter-spacing:.04em">${SPECTRUM.order.map((c) =>
        `<span class="hue-dot" style="background:${hasColor(c) ? SPECTRUM.hex[c] : "#332"}"></span>`
      ).join("")}${hasColor("white") ? `<span class="hue-dot" style="background:${SPECTRUM.hex.white}"></span>` : ""}</div>
    </div>`;
}

function showChoices(opts) {
  pauseEl.classList.add("show");
  pauseEl.innerHTML = `<div class="panel"><h2>CHOOSE</h2>${opts.map((o, i) =>
    `<button data-i="${i}">${o[0]}</button>`).join("")}</div>`;
  pauseEl.querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      pauseEl.classList.remove("show");

}

function openMenu() {
  if (mode !== "explore") return;
  mode = "pause";
  pauseEl.classList.add("show");
  pauseEl.innerHTML = `<div class="panel">
    <h2>PAUSE</h2>
    <button data-a="codex">SPECTRUM CODEX</button>
    <button data-a="item">ITEMS</button>
    <button data-a="save">SAVE</button>
    <button data-a="title">TITLE</button>
    <button data-a="close">CLOSE</button>
  </div>`;
  pauseEl.querySelectorAll("button").forEach((b) => b.onclick = () => menuAct(b.dataset.a));
}
function closeMenu() {
  pauseEl.classList.remove("show");
  pauseEl.innerHTML = "";
  if (mode === "pause") mode = "explore";
}
function menuAct(a) {
  if (a === "close") { closeMenu(); return; }
  if (a === "save") { save(); closeMenu(); say("", "The Wavelength remembers this page."); return; }
  if (a === "title") { closeMenu(); goTitle(); return; }
  if (a === "codex") { closeMenu(); openCodex(); return; }
  if (a === "item") {
    pauseEl.innerHTML = `<div class="panel"><h2>ITEMS</h2>
      <p>Candy ${state.items.candy || 0} — restore HP.</p>
      <p>Milkshake ${state.items.milkshake || 0} — restore Vitas (Chroma fuel).</p>
      <button data-a="close">CLOSE</button></div>`;
    pauseEl.querySelector("button").onclick = () => menuAct("close");
  }
}

function openCodex() {
  mode = "codex";
  const rows = SPECTRUM.order.map((c) => {
    const known = hasColor(c);
    const opp = SPECTRUM.opposite(c);
    return `<div style="margin:5px 0;padding:5px;border:2px solid ${known ? SPECTRUM.hex[c] : "#443"};background:#100810">
      <b style="color:${known ? SPECTRUM.hex[c] : "#776"}">${c.toUpperCase()}</b>
      ${known ? " — " + SPECTRUM.meaning[c] + ". Object: " + SPECTRUM.conduit[c] + ". Cancels " + opp + "." : " — a locked Chroma."}
    </div>`;
  }).join("");
  codexEl.classList.add("show");
  codexEl.innerHTML = `<div class="panel wide"><h2>SPECTRUM CODEX</h2>
    <p style="font-size:11px;line-height:1.4;color:#ffd8e8">Chroma is magical color. Primaries red, yellow, blue. Secondaries green, purple, orange cancel the Wand across from them. Black and white keep the Spectrum in check — and are the most dangerous. Dark Chroma drinks unmatched color. Hal's native hue is yellow; Wanda's is blue. Vitas fuels every burst.</p>
    ${rows}
    <button id="cx">CLOSE</button></div>`;
  document.getElementById("cx").onclick = () => {
    codexEl.classList.remove("show");

function startBattle(id, onWin) {
  const foe = deep(FOES[id]);
  if (!foe) return;
  foe.maxHp = foe.hp;
  battle = { foe, onWin, log: foe.name + " takes a hue!", menu: "main", caster: state.hero, both: false };
  mode = "battle";
  beep(520, 0.08);
  renderBattle();
}

function renderBattle() {
  const b = battle;
  if (!b) return;
  const f = b.foe;
  const hue = SPECTRUM.hex[f.hue] || "#888";
  const colors = SPECTRUM.order.concat(hasColor("white") ? ["white"] : []).map((c) => {
    const locked = !hasColor(c);
    return `<button data-sp="${c}" ${locked ? "disabled" : ""} style="border-color:${locked ? "#444" : SPECTRUM.hex[c]}">${locked ? "—" : c.toUpperCase()}</button>`;
  }).join("");
  let body = "";
  if (b.menu === "main") {
    body = `<div class="blist">
      <button data-act="color">CHROMA</button>
      <button data-act="clash">COUNTER</button>
      <button data-act="item">ITEM</button>
      <button data-act="run">RUN</button>
    </div>`;
  } else if (b.menu === "color") {
    body = `<div class="blist">${colors}</div><button data-back="1">BACK</button>
      <p style="font-size:10px;color:#c090a8">Caster: ${ACTORS[b.caster].name}. Z to confirm a hue.</p>`;
  } else if (b.menu === "item") {
    body = `<button data-it="candy">CANDY (${state.items.candy || 0})</button>
      <button data-it="milkshake">MILKSHAKE (${state.items.milkshake || 0})</button>
      <button data-back="1">BACK</button>`;
  }
  battleEl.classList.add("show");
  battleEl.innerHTML = `<div class="panel wide">
    <div class="brow">
      <div class="bstat"><b>${ACTORS[b.caster].name}</b><div class="hpbar"><i style="width:${state.hp / state.maxHp * 100}%"></i></div>Vitas ${state.chroma}</div>
      <div class="bstat"><b style="color:${hue}">${f.name}</b><div class="hpbar"><i style="width:${f.hp / f.maxHp * 100}%;background:${hue}"></i></div>Chroma: ${f.hue}${f.dark ? " · DARK" : ""}${f.stolen ? " · stole " + f.stolen : ""}</div>
    </div>
    <div class="log">${b.log}</div>
    ${body}
  </div>`;
  battleEl.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => battleAct(el.dataset.act));
  battleEl.querySelectorAll("[data-sp]").forEach((el) => el.onclick = () => castColor(el.dataset.sp, false));
  battleEl.querySelectorAll("[data-it]").forEach((el) => el.onclick = () => battleItem(el.dataset.it));
  battleEl.querySelectorAll("[data-back]").forEach((el) => { el.onclick = () => { battle.menu = "main"; renderBattle(); }; });
}

function battleAct(act) {
  if (!battle || battle.foe.hp <= 0) return;
  if (act === "color") { battle.menu = "color"; renderBattle(); return; }
  if (act === "item") { battle.menu = "item"; renderBattle(); return; }
  if (act === "run") {
    if (battle.foe.boss) { battle.log = "The Wand will not let you leave."; renderBattle(); return; }
    if (Math.random() < 0.65) { endBattle(false); say("", "You slip a Wavelength sideways."); return; }
    battle.log = "The color sticks."; enemyTurn(); return;
  }
  if (act === "clash") {
    if (colorCount() < 1) { battle.log = "You need Chroma to counter."; renderBattle(); return; }
    if (state.chroma < 6) { battle.log = "Not enough Vitas to braid Chroma."; renderBattle(); return; }
    if (battle.foe.hue === "black") {
      if (hasColor("white")) {
        state.chroma -= 8;
        castColor("white", true);
        return;
      }
      battle.log = "Fyodor holds the black Wand. Only white Chroma keeps him in check.";
      renderBattle();
      return;
    }
    if (battle.foe.dark) {
      const rebound = battle.foe.stolen ? SPECTRUM.opposite(battle.foe.stolen) : SPECTRUM.opposite(battle.foe.hue);
      if (rebound && hasColor(rebound)) {
        state.chroma -= 6;
        castColor(rebound, true);
        return;
      }
      battle.log = "Dark Chroma drinks unmatched color. Counter with the complementary hue.";
      renderBattle();
      return;
    }
    const use = SPECTRUM.opposite(battle.foe.hue);
    if (use && hasColor(use)) {
      state.chroma -= 6;
      castColor(use, state.party.includes("wanda"));
      return;
    }
    const warm = SPECTRUM.warm.find((c) => hasColor(c));
    const cool = SPECTRUM.cool.find((c) => hasColor(c));
    if (warm && cool) {
      state.chroma -= 6;
      const color = SPECTRUM.warm.includes(battle.foe.hue) ? cool : warm;
      castColor(color, state.party.includes("wanda"));
      return;
    }
    battle.log = "You do not have the complementary Chroma yet.";
    renderBattle();
  }
}

function castColor(color, both) {
  if (!battle || battle.resolved) return;
  const cost = color === "white" ? 8 : (both ? 6 : 3);
  if (!both && state.chroma < cost) { battle.log = "Chroma too thin."; renderBattle(); return; }
  if (!both) state.chroma -= cost;
  const res = SPECTRUM.resolve({
    color, foeHue: battle.foe.hue, caster: battle.caster,
    level: state.lv, stolen: battle.foe.stolen, both, dark: !!battle.foe.dark
  });
  battle.foe.hp -= res.dmg;
  if (res.heal) battle.foe.hp = Math.min(battle.foe.maxHp, battle.foe.hp + res.heal);
  if (res.steal && battle.foe.hue !== "black" && !battle.foe.dark) {
    battle.foe.stolen = battle.foe.hue;
    battle.foe.hue = color;
  }
  if (res.status === "Tide") battle.foe.atk = Math.max(2, battle.foe.atk - 2);
  if (res.status === "Bloom") state.hp = Math.min(state.maxHp, state.hp + 6);
  if (res.status === "Haze" || res.status === "Web") battle.foe.bound = true;
  if (res.status === "Duck-burst") battle.foe.hp -= Math.round(4 + state.lv);
  if (res.status === "Spark" && hasColor("blue")) {
    battle.foe.hp -= Math.round(8 + state.lv * 2);
    res.log += " Yellow plus stolen red makes orange — mixed with Wanda's blue, it detonates.";
  }
  battle.log = (both ? "Hal and Wanda — " : ACTORS[battle.caster].name + " — ") + color.toUpperCase() + ". " + res.log +
    (res.dmg ? " " + res.dmg + " damage." : "") + (res.heal ? " Foe mends " + res.heal + "." : "");
  beep(color === "white" ? 880 : 340 + SPECTRUM.index(color) * 70, 0.09);
  spawnFx(color);
  if (battle.foe.hp <= 0) { winBattle(); return; }
  enemyTurn();
}

function battleItem(id) {
  if (!state.items[id]) { battle.log = "None left."; renderBattle(); return; }
  state.items[id]--;
  if (id === "candy") { state.hp = Math.min(state.maxHp, state.hp + 18); battle.log = "Candy. Color returns to your face."; }
  else { state.chroma = Math.min(state.maxChroma, state.chroma + 12); battle.log = "A milkshake. Vitas brightens — at the usual cost of dignity."; }
  enemyTurn();
}

function enemyTurn() {
  if (!battle || battle.foe.hp <= 0) return;
  if (battle.foe.bound) { battle.foe.bound = false; battle.log += " Bound — the foe misses a stroke."; battle.menu = "main"; renderBattle(); return; }
  let dmg = Math.max(1, battle.foe.atk - Math.floor(state.lv / 2) + Math.floor(Math.random() * 3));
  const lastRel = SPECTRUM.relation(state.hero === "hal" ? "red" : "blue", battle.foe.hue);
  if (lastRel === "clash") dmg = Math.max(1, Math.floor(dmg * 0.7));
  state.hp -= dmg;
  battle.log += " " + battle.foe.name + " paints " + dmg + "!";
  if (battle.foe.dark && Math.random() < 0.4) {
    const steal = SPECTRUM.order[Math.floor(Math.random() * 6)];
    battle.foe.stolen = steal;
    battle.log += " Dark Chroma sips " + steal + ".";
  }
  battle.menu = "main";
  battle.caster = (state.party.includes("wanda") && battle.caster === "hal") ? "wanda" : "hal";
  if (state.hp <= 0) {
    state.hp = 1;
    battle.log = "You drop. The blue portal flickers you home.";
    renderBattle();
    setTimeout(() => {
      endBattle(false);
      state.map = "portal";
      state.x = 4 * TS; state.y = 6 * TS;
      state.hp = Math.max(8, Math.floor(state.maxHp / 2));
      say("wanda", "We lived. That's a kind of Chroma.");
    }, 700);
    return;
  }
  renderBattle();
}

function winBattle() {
  if (!battle || battle.resolved) return;
  battle.resolved = true;
  battle.log = battle.foe.name + " loses the Chroma!";
  state.xp += battle.foe.xp;
  state.chroma = Math.min(state.maxChroma, state.chroma + 4);
  if (state.xp >= state.lv * 28) {
    state.xp = 0; state.lv++;
    state.maxHp += 6; state.hp = state.maxHp;
    state.maxChroma += 3; state.chroma = state.maxChroma;
    battle.log += " Level up!";
  }
  const cb = battle.onWin;
  renderBattle();
  setTimeout(() => { endBattle(true); if (cb) cb(); }, 550);
}

function endBattle(won) {
  battleEl.classList.remove("show");
  battleEl.innerHTML = "";
  battle = null;
  mode = "explore";
  encounterCool = won ? 90 : 40;
  renderHud();
  save();
}

function spawnFx(color) {
  fx.push({ c: SPECTRUM.hex[color] || "#fff", t: 18, x: W * 0.62, y: 90 });
}

function isHot(ch) {
  return !!ch && "YTROGBVUDC*SH+".includes(ch);
}
function interact() {
  if (mode !== "explore") return;
  const cx = Math.floor((state.x + 8) / TS);
  const cy = Math.floor((state.y + 8) / TS);
  const dx = state.dir === "left" ? -1 : state.dir === "right" ? 1 : 0;
  const dy = state.dir === "up" ? -1 : state.dir === "down" ? 1 : 0;
  const spots = [[cx + dx, cy + dy], [cx, cy], [cx, cy - 1], [cx, cy + 1], [cx - 1, cy], [cx + 1, cy]];
  for (const [tx, ty] of spots) {
    const row = curMap().grid[ty];
    const t = row && row[tx];
    if (isHot(t)) { handleTile(t, tx, ty); return; }
  }
  say("", "Nothing humming here.");
}

function unlock(color, lines, then) {
  if (!state.colors[color]) {
    state.colors[color] = true;
    save();
  }
  sayMany(lines, then);
}

function handleTile(t, tx, ty) {
  const ch = state.ch;
  if (t === "Y" && state.map === "portal") {
    if (!state.flags.metWanda) {
      state.flags.metWanda = true;
      if (!state.party.includes("wanda")) state.party.push("wanda");
      unlock("blue", [
        ["wandy", "You fell out of a hole. I'm Wandy. Wanda McFaren, if you're filling out forms."],
        ["hal", "Hal. That portal was blue. This whole street is blue. That's not a metaphor."],
        ["wandy", "Uncle Blish lives in the leaning house. If you're lost, he's the professional version."]
      ], () => {
        setGoal("Leave the street through the door. Uncle Blish is next.");
        save();
      });
      return;
    }
    say("wanda", "The street is still the wrong blue. That's how you know you're not home.");
    return;
  }
  if (t === "D") {
    if (state.map === "portal") {
      if (!state.flags.metWanda) { say("hal", "The girl with the paintbrush first. She saw the portal."); return; }
      if (ch === 0) { advanceChapter(); return; }
      loadChapter(Math.max(1, ch));
      return;
    }
    if (state.map === "blish") {
      if (!state.flags.metBlish) { say("blish", "Talk to me before you use my door. The stairs have opinions."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "thrift") {
      if (!state.flags.bossMisha) { say("merlin", "The back corner isn't done with you."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "museum") {
      if (!state.flags.metFyodor) { say("em", "The man in black hasn't seen the portrait yet."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "lab") {
      if (!state.flags.labLesson) { say("hal", "The chart first. If you skip the chart, you skip surviving."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "chase") {
      if (!state.flags.bossSergio) { say("hal", "Sergio is still in the street. Dark blue. Don't pretend you don't see it."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "gala") {
      if (!state.flags.galaReady) { say("em", "Fyodor has not noticed us yet. That is the point. Talk to him."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "whitewave") { say("fyodor", "There is no door off the White Wavelength. Not for you."); return; }
    say("", "The door waits until this Wavelength is settled.");
    return;
  }
  if (t === "O" && state.map === "blish") {
    if (!state.flags.metBlish) {
      state.flags.metBlish = true;
      sayMany([
        ["blish", "The house leans because I asked it to. Sit. Or don't. The floor votes."],
        ["hal", "Fyodor's people opened a portal behind my father. I landed here with a tie bar that isn't a tie bar."],
        ["blish", "Then you landed in the right crumbling house. Merlin's thrift still sells things that used to be Wands."],
        ["wanda", "I need a brush anyway. Mine is having a bad bristle day."]
      ], () => { setGoal("Leave by the door. Merlin's thrift is waiting."); save(); });
      return;
    }
    say("blish", "If the second floor becomes a first floor, that's a Tuesday.");
    return;
  }
  if (t === "O") {
    say("other", "A Fractling is not a ghost. It is you, on another Wavelength, wearing a different role.");
    return;
  }
  if (t === "T" && state.map === "thrift") {
    if (!state.flags.gotBrush) {
      state.flags.gotBrush = true;
      unlock("blue", [
        ["merlin", "A dime from 1954 and a Donald Duck Cola cap. And that battered brush in the dark corner."],
        ["wanda", "It's just having a bad bristle day."],
        ["hal", "Wands look like anything. Paintbrush, knitting needle, teddy bear, pencil. That one is humming white."]
      ]);
      return;
    }
    say("merlin", "Abracadabra, Wanda. Tell your friends. I almost can't afford my own salary.");
    return;
  }
  if (t === "+" && state.map === "thrift") {
    unlock("orange", [
      ["hal", "A rubber duck. Mostly yellow, with a hint of orange. Chroma doesn't care if it's undignified."],
      ["wanda", "Saved by a duck. I'm putting that on a bottle cap."]
    ]);
    state.colors.yellow = true;
    save();
    return;
  }
  if (t === "+" && state.map === "blish") {
    say("blish", "Don't sit on the boxes. They contain previous versions of the house.");
    return;
  }
  if (t === "R" && state.map === "thrift") {
    if (!state.flags.gotBrush) { say("misha", "Look at the shelves, children. I am only an old woman."); return; }
    unlock("green", [
      ["misha", "Hello, Hally. A knitting needle, if you must know. Now — the Sixth Wand. Where is it?"],
      ["hal", "For the man with the green pencil."],
      ["misha", "Red Chroma does not like to be stung."]
    ], () => {
      state.colors.purple = true;
      save();
      if (!state.flags.bossMisha) startBattle("misha", () => {
        state.flags.bossMisha = true;
        save();
        sayMany([
          ["hal", "Green cancelled red. Purple left a haze. Yellow plus a hint of orange mixed with the residue. Chain reaction."],
          ["misha", "I shall tell the others what you want on your tombstone."],
          ["merlin", "The door's that way. I don't want to know."]
        ], () => setGoal("Leave the thrift. The portrait is waiting."));
      });
      else say("merlin", "The old woman isn't here. The licorice smell is.");
    });
    return;
  }
  if (t === "R") {
    say("misha", "A knitting needle is still a Wand. Don't trust old ladies automatically.");
    return;
  }
  if (t === "G" && (state.map === "museum" || state.map === "gala")) {
    sayMany([
      ["em", "Black and white is a wardrobe, not a truce. I am a Drawer — I pull magic. I do not throw it."],
      ["wanda", "And I keep painting a man whose smile the fire stole."]
    ]);
    return;
  }
  if (t === "G") {
    say("em", "The world is your canvas. Leave your mark — perhaps not on the principal's desks.");
    return;
  }
  if (t === "V" && state.map === "museum") {
    if (!state.flags.metFyodor) {
      state.flags.metFyodor = true;
      sayMany([
        ["fyodor", "A powerful portrait. I will buy it. Tomorrow will look different."],
        ["em", "Fyodor. Not Frodo. Though I suppose they both had... never mind."],
        ["wanda", "He walks like the painting. Or the painting walks like him."],
        ["hal", "Superwielder. He wants every Wand, and the White Wavelength as a prize."]
      ], () => { setGoal("Leave the gallery. The Red lab can explain the rest."); save(); });
      return;
    }
    say("fyodor", "The poorest live like princes on the White Wavelength. I intend to collect the key.");
    return;
  }
  if (t === "V" && state.map === "gala") {
    if (!state.flags.galaReady) {
      state.flags.galaReady = true;
      state.colors.white = true;
      save();
      sayMany([
        ["fyodor", "Emmaline. It has been too long. You wear the years more kindly than I do."],
        ["em", "Wanda, do not answer. I will speak. He must believe the face."],
        ["fyodor", "Unmasked. Of course. A girl in her mother's skin, and a white Wand pretending to be a tie bar."],
        ["hal", "Then we mix. Yellow and a stolen red spark make orange. Orange against her blue."]
      ], () => setGoal("The door is a Wavelength now. Walk through. Meet him as himself."));
      return;
    }
    say("fyodor", "I am already the giant in the next room. Come finish the sentence.");
    return;
  }
  if (t === "V") {
    say("", "A purple memory of a door.");
    return;
  }
  if (t === "C" && state.map === "lab") {
    if (!state.flags.labLesson) {
      state.flags.labLesson = true;
      SPECTRUM.order.forEach((c) => { state.colors[c] = true; });
      save();
      sayMany([
        ["hal", "Three primaries: red, yellow, blue. Three secondaries: green, purple, orange. They cancel the Wand across from them."],
        ["hal", "Red versus green. Yellow versus purple. Blue versus orange. Black and white keep the rest in check."],
        ["wanda", "Your Wand is white, so you're one of the dangerous ones. Hard to believe of a guy with a milkshake addiction."],
        ["hal", "Wielders, Drawers, Blotters, Seers, the Blinded, Superwielders. You are a Wielder, Wandy. Rare on Blue."]
      ], () => setGoal("The door. Sergio is already in the street with Dark Chroma."));
      return;
    }
    say("hal", "The chart does not get kinder on a second reading.");
    return;
  }
  if (t === "C") {
    say("em", "A canvas. Or a chart. Both are maps if you squint.");
    return;
  }
  if (t === "B" && state.map === "chase") {
    unlock("orange", [
      ["sergio", "Hallard. The White Wand does not get to hide in a girl's paintbox."],
      ["hal", "Dark blue Chroma. Complementary orange will sting it. Unmatched color only feeds him."]
    ], () => {
      if (!state.flags.bossSergio) startBattle("sergio", () => {
        state.flags.bossSergio = true;
        save();
        sayMany([
          ["hal", "He'll report to Fyodor. The gala is still the only door into the museum that isn't a trap."],
          ["wanda", "Then we go incognito. I hate evening gowns. I hate them Wandafully."]
        ], () => setGoal("Leave the chase. The secret gala is tonight."));
      });
      else say("hal", "Sergio's Dark Chroma is a stain on the asphalt. Keep walking.");
    });
    return;
  }
  if (t === "B") {
    say("sergio", "Dark is not evil. It is the other half of the painting.");
    return;
  }
  if (t === "U") {
    if (state.map !== "whitewave") {
      say("fyodor", "Not yet. The White Wavelength is a prize, not a hallway.");
      return;
    }
    if (!state.flags.final) {
      state.flags.final = true;
      state.colors.white = true;
      save();
      startBattle("fyodor", () => {
        state.flags.won = true;
        finishGame();
      });
    }
    return;
  }
  if (t === "*") {
    say("hal", "A Wavelength seam. White is not a seventh color — it is the Wand that keeps the others from eating the painting.");
    return;
  }
  if (t === "S" || t === "H") {
    const chatter = {
      portal: ["Blue city, blue air, blue rules. Don't drink the tap water until you know which Spectrum bottled it."],
      blish: ["The stairs still lead up. That is not guaranteed in this house."],
      thrift: ["Don't buy the toaster. It might be a Wand. It might just be a toaster. Both are dangerous."],
      museum: ["Guests in black and white. Wanda and Em are the only red blotches on the portrait."],
      lab: ["Do not spill the spectrum ink. Chromatists have searched every Wavelength for a stain remover."],
      chase: ["The street remembers the car. Sergio does too."],
      gala: ["If you applaud correctly, the rotunda is a door. If you don't, it is only a party."],
      whitewave: ["The poorest live like princes here. That is why he wants the key."]
    };
    say("", (chatter[state.map] || ["..."])[0]);
    return;
  }
  say("", "Nothing humming here.");
}

function randomFoe() {
  const byMap = {
    portal: "haze", thrift: "spark", museum: "residue",
    lab: "agent", chase: "blot", gala: "agent", whitewave: "blot"
  };
  return byMap[state.map];
}

function tryEncounter() {
  if (encounterCool > 0) { encounterCool--; return; }
  if (!randomFoe()) return;
  if (mode !== "explore") return;
  if (Math.random() > 0.018) return;
  encounterCool = 70;
  startBattle(randomFoe());
}

function goTitle() {
  mode = "title";
  battle = null;
  hudEl.classList.remove("show");
  goalEl.classList.remove("show");
  titleUI.classList.add("show");
  endingUI.classList.remove("show");
  pauseEl.classList.remove("show");
  battleEl.classList.remove("show");
  document.getElementById("btnContinue").style.opacity = loadSave() ? "1" : ".45";
}

function startNew() {
  state = newState();
  loadChapter(0);
  renderHud();
  ensureAudio();
  canvas.focus();
}

function startContinue() {
  const s = loadSave();
  if (!s) { say("", "No saved Wavelength."); return; }
  state = s;
  mode = "explore";
  titleUI.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(chapter().goal);
  renderHud();
  ensureAudio();
}

function showHow() {
  sayMany([
    ["", "Move with arrows or WASD. Confirm with Z or Space. Menu with X."],
    ["", "Combat is Chroma — magical color. Primaries: red, yellow, blue. Secondaries: green, purple, orange. Complementary hues COUNTER: red↔green, yellow↔purple, blue↔orange."],
    ["", "Same hues resonate. Adjacent hues mix and leave residue. Black + white is the most powerful reaction. Dark Chroma drinks unmatched color."],
    ["", "Hal's native hue is yellow; his Wand reads white. Wanda's is blue. Vitas fuels every burst. Wands can look like a paintbrush, a knitting needle, a duck, a pencil."]
  ]);
}

/* drawing */
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); }

function drawTile(kind, sx, sy, pal) {
  rect(sx, sy, TS, TS, pal.floor);
  if (kind === "#") {
    rect(sx, sy, TS, TS, pal.wall);
    rect(sx + 1, sy + 1, TS - 2, 3, "#0004");
    rect(sx + 2, sy + 6, 12, 2, pal.acc);
  } else if (kind === "T") {
    rect(sx + 2, sy + 6, 12, 8, "#5a3a22");
    rect(sx + 3, sy + 4, 10, 3, "#8a5a32");
  } else if (kind === "+") {
    rect(sx + 1, sy + 4, 14, 10, "#6a4058");
    rect(sx + 2, sy + 5, 12, 4, "#d8c0c8");
  } else if (kind === "C") {
    rect(sx + 3, sy + 6, 10, 8, "#8a5a20");
    rect(sx + 3, sy + 6, 10, 2, pal.light);
  } else if (kind === "S") {
    rect(sx + 2, sy + 2, 12, 12, "#5a4030");
    rect(sx + 4, sy + 4, 8, 8, "#2a2018");
  } else if (kind === "H") {
    rect(sx + 1, sy + 1, 14, 14, "#4a3040");
    rect(sx + 5, sy + 4, 6, 8, "#1a1018");
  } else if (kind === "~") {
    rect(sx, sy, TS, TS, "#163a68");
    rect(sx, sy + ((anim / 8 | 0) % 2) * 2, TS, 2, "#3a78e0");
  } else if (kind === "=") {
    rect(sx, sy, TS, TS, "#3a3a44");
    rect(sx, sy + 7, TS, 2, "#2a2a30");
  } else if (kind === ",") {
    rect(sx, sy, TS, TS, "#16351c");
    px(sx + 4, sy + 6, "#3cb464"); px(sx + 10, sy + 11, "#2a8040");
  } else if (kind === "*") {
    rect(sx + 4, sy + 3, 8, 11, "#f4f0ff");
    rect(sx + 6, sy + 1, 4, 14, pal.light);
  } else if (kind === "D") {
    rect(sx + 3, sy + 2, 10, 14, "#5a3020");
    px(sx + 11, sy + 9, pal.light);
  } else if ("ROYGBVU".includes(kind)) {
    const mapHue = { R: "red", O: "orange", Y: "yellow", G: "green", B: "blue", V: "purple", U: "black" };
    const c = SPECTRUM.hex[mapHue[kind]];
    rect(sx + 2, sy + 2, 12, 12, c);
    rect(sx + 5, sy + 5, 6, 6, "#fff8");
    if ((anim / 10 | 0) % 2) rect(sx + 1, sy + 1, 14, 14, c + "55");
  }
}

function drawActor(who, ax, ay, dir, walking) {
  const a = ACTORS[who];
  const bob = walking ? ((anim / 6 | 0) % 2) : 0;
  const y = ay - 2 - bob;
  rect(ax + 5, y + 2, 6, 5, a.hair);
  rect(ax + 5, y + 5, 6, 5, a.skin);
  rect(ax + 4, y + 10, 8, 6, a.coat);
  rect(ax + 6, y + 16, 2, 3, "#2a1820");
  rect(ax + 9, y + 16, 2, 3, "#2a1820");
  if (dir === "left") px(ax + 6, y + 7, "#1a1010");
  else if (dir === "right") px(ax + 9, y + 7, "#1a1010");
  else { px(ax + 6, y + 7, "#1a1010"); px(ax + 9, y + 7, "#1a1010"); }
  px(ax + 7, y + 12, a.acc);
}

function drawWorld() {
  const m = curMap();
  const pal = MAP_PAL[state.map] || MAP_PAL.portal;
  cam.x = Math.max(0, Math.min(m.w * TS - W, state.x - W / 2 + 8));
  cam.y = Math.max(0, Math.min(m.h * TS - H, state.y - H / 2 + 8));
  rect(0, 0, W, H, pal.wall);
  for (let ty = 0; ty < m.h; ty++) {
    for (let tx = 0; tx < m.w; tx++) {
      const sx = tx * TS - cam.x, sy = ty * TS - cam.y;
      if (sx < -TS || sy < -TS || sx > W || sy > H) continue;
      drawTile(m.grid[ty][tx], sx, sy, pal);
    }
  }
  if (state.party.includes("wanda") && state.hero === "hal") {
    drawActor("wanda", state.x - cam.x - 10, state.y - cam.y, state.dir, state.moving);
  }
  drawActor(state.hero, state.x - cam.x, state.y - cam.y, state.dir, state.moving);
  if (state.party.includes("hal") && state.hero === "wanda") {
    drawActor("hal", state.x - cam.x + 12, state.y - cam.y, state.dir, state.moving);
  }
  fx = fx.filter((p) => {
    p.t--;
    ctx.globalAlpha = Math.max(0, p.t / 18);
    rect(p.x - (18 - p.t), p.y - (18 - p.t) / 2, 6, 6, p.c);
    ctx.globalAlpha = 1;
    return p.t > 0;
  });
}

function tick(t) {
  const dt = Math.min(40, t - last); last = t;
  anim++;
  if (mode === "explore" || mode === "card" || mode === "battle") musicTick();
  if (dialogEl.classList.contains("show") && typing.length < typeFull.length) {
    typeT += dt;
    while (typeT > 16 && typing.length < typeFull.length) {
      typing += typeFull[typing.length];
      typeT -= 16;
    }
    renderDialog();
  }
  if ((mode === "explore" || mode === "card") && !dialogEl.classList.contains("show")) {
    if (mode === "card") mode = "explore";
    let vx = 0, vy = 0;
    if (keys.left || keys.a) vx = -1;
    if (keys.right || keys.d) vx = 1;
    if (keys.up || keys.w) vy = -1;
    if (keys.down || keys.s) vy = 1;
    state.moving = !!(vx || vy);
    if (vx) state.dir = vx < 0 ? "left" : "right";
    else if (vy) state.dir = vy < 0 ? "up" : "down";
    const sp = 1.15;
    if (vx && !blocked(state.x + vx * sp, state.y)) state.x += vx * sp;
    if (vy && !blocked(state.x, state.y + vy * sp)) state.y += vy * sp;
    tryEncounter();
    renderHud();
  }
  if (mode !== "title" && mode !== "ending" && state) drawWorld();
  else if (mode === "title") drawTitle();
  requestAnimationFrame(tick);
}

function drawTitle() {
  rect(0, 0, W, H, "#100814");
  for (let i = 0; i < 6; i++) {
    const c = SPECTRUM.order[i];
    rect(18 + i * 38, 36 + Math.sin((anim + i * 12) / 14) * 4, 28, 10, SPECTRUM.hex[c]);
  }
  drawActor("hal", 88, 70, "down", true);
  drawActor("wanda", 148, 70, "down", true);
}

function confirm() {
  if (dialogEl.classList.contains("show")) { nextLine(); return; }
  if (mode === "title") return;
  if (mode === "explore") interact();
}

function keyOn(k, down) {
  const raw = String(k || "").toLowerCase();
  const map = {
    arrowleft: "left", arrowright: "right", arrowup: "up", arrowdown: "down",
    left: "left", right: "right", up: "up", down: "down"
  };
  const id = map[raw] || raw;
  if (down) keys[id] = true; else keys[id] = false;
  if (!down) return;
  if (id === "z" || id === " " || id === "enter" || id === "ok") confirm();
  if (id === "x" || id === "escape" || id === "menu") {
    if (mode === "pause" || mode === "codex") { closeMenu(); codexEl.classList.remove("show"); mode = "explore"; }
    else openMenu();
  }
}

window.addEventListener("keydown", (e) => {
  keyOn(e.key, true);
  if (e.code && e.code.startsWith("Arrow")) keyOn(e.code, true);
  const k = String(e.key || "").toLowerCase();
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","z","x"].includes(k) || k === " ") e.preventDefault();
});
window.addEventListener("keyup", (e) => {
  keyOn(e.key, false);
  if (e.code && e.code.startsWith("Arrow")) keyOn(e.code, false);
});
stage.addEventListener("pointerdown", () => canvas.focus());
document.querySelectorAll("#mobile b[data-k]").forEach((b) => {
  const k = b.dataset.k;
  const go = (d) => (e) => { e.preventDefault(); keyOn(k, d); };
  b.addEventListener("pointerdown", go(true));
  b.addEventListener("pointerup", go(false));
  b.addEventListener("pointerleave", go(false));
});

function fit() {
  const pad = window.matchMedia("(pointer: coarse)").matches ? 150 : 24;
  const s = Math.max(1, Math.floor(Math.min((window.innerWidth - 16) / W, (window.innerHeight - pad) / H)));
  stage.style.width = (W * s) + "px";
  stage.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function beep(freq, dur) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "square";
  o.frequency.value = freq;
  g.gain.value = 0.04;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
function musicTick() {
  if (!audioCtx || (anim % 22)) return;
  const scale = [262, 330, 392, 523, 392, 330, 294, 392];
  const hueShift = state ? (SPECTRUM.index(Object.keys(state.colors).pop() || "yellow") || 0) * 8 : 0;
  beep(scale[(anim / 22 | 0) % scale.length] + hueShift, 0.07);
}

document.getElementById("btnNew").onclick = startNew;
document.getElementById("btnContinue").onclick = startContinue;
document.getElementById("btnHow").onclick = showHow;
document.getElementById("btnAgain").onclick = goTitle;

window.WANDAFUL_SPECTRUM = SPECTRUM;
window.WANDAFUL_FOES = FOES;
window.WANDAFUL = {
  get mode() { return mode; },
  get state() { return state; },
  get battle() { return battle; },
  SPECTRUM, MAPS, CHAPTERS, BLOCK, FOES,
  startNew, interact, keyOn, nextLine, startBattle, castColor, battleAct, handleTile, winBattle,
  explore() { mode = "explore"; dialogEl.classList.remove("show"); dialogQ.length = 0; }
};

goTitle();
requestAnimationFrame(tick);
</script>
