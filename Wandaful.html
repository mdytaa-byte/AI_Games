<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Wandaful — 16-bit RPG</title>
  <style>
    :root { --gold:#f0d060; --pale:#fff6d8; --ink:#14081c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: #08040e; color: var(--pale);
      font-family: "Courier New", Courier, ui-monospace, monospace;
      overflow: hidden; user-select: none; touch-action: none;
    }
    #wrap { position: absolute; inset: 0; display: grid; place-items: center; }
    #stage {
      position: relative; image-rendering: pixelated; image-rendering: crisp-edges;
      box-shadow: 0 0 0 3px #3a1848, 0 0 0 6px #f0d060, 0 18px 50px rgba(180,40,90,.35);
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    .overlay { position: absolute; inset: 0; display: none; pointer-events: none; }
    .overlay.show { display: block; }
    #titleUI, #endingUI {
      pointer-events: auto; text-align: center; padding: 16px 12px 10px; color: var(--pale);
      background:
        radial-gradient(circle at 50% 30%, rgba(255,70,110,.28), transparent 46%),
        radial-gradient(circle at 18% 70%, rgba(70,140,255,.22), transparent 34%),
        linear-gradient(#1a0820, #08040e 60%, #1c0a28);
    }
    #titleUI h1, #endingUI h1 {
      margin: 0; font-size: 28px; letter-spacing: .18em; color: #ffe58a;
      text-shadow: 3px 3px 0 #6a1040, -1px 0 #ff4a8a;
    }
    #titleUI .sub, #endingUI .sub { margin: 6px 0 14px; color: #ffb4d0; font-size: 11px; letter-spacing: .1em; }
    .menu-btn {
      pointer-events: auto; display: block; width: min(280px, 86%); margin: 7px auto;
      padding: 8px 10px; border: 3px solid var(--gold); background: linear-gradient(#6a1848, #2a0820);
      color: var(--pale); font: 700 13px "Courier New", monospace; letter-spacing: .08em;
      cursor: pointer; text-shadow: 2px 2px #000;
    }
    .menu-btn:hover, .menu-btn:focus { filter: brightness(1.2); outline: none; }
    #dialog {
      position: absolute; left: 6px; right: 6px; bottom: 6px; min-height: 58px;
      border: 3px solid var(--gold); background: rgba(16,6,22,.94); color: var(--pale);
      padding: 7px 10px 8px; font-size: 12px; line-height: 1.35; pointer-events: auto;
      text-shadow: 1px 1px #000; display: none; z-index: 40;
    }
    #dialog.show { display: block; }
    #dialog .who { color: var(--gold); font-weight: 700; letter-spacing: .06em; }
    #dialog .next { position: absolute; right: 8px; bottom: 4px; color: var(--gold); animation: blink 1s steps(2) infinite; }
    #hud, #goal { position: absolute; left: 6px; right: 6px; pointer-events: none; text-shadow: 1px 1px #000; z-index: 4; }
    #hud { top: 6px; display: none; font-size: 10px; justify-content: space-between; gap: 8px; }
    #hud.show { display: flex; }
    .hud-card { border: 2px solid #f0d060; background: rgba(16,6,22,.86); padding: 4px 7px; min-width: 108px; }
    .hpbar { height: 5px; background: #2a1830; margin-top: 3px; }
    .hpbar > i { display: block; height: 100%; background: linear-gradient(#7dff9a, #1f9a4a); }
    .hpbar.low > i { background: linear-gradient(#ff7a62, #b41e2e); }
    .chromabar > i { background: linear-gradient(#7ec8ff, #3a6ad0); }
    #goal { top: 46px; display: none; font-size: 10px; color: #ffd0e8; }
    #goal.show { display: block; }
    #pause, #battle, #codex {
      position: absolute; inset: 0; display: none; pointer-events: auto;
      background: rgba(6,2,10,.76); z-index: 32;
    }
    #pause.show, #battle.show, #codex.show { display: grid; place-items: center; }
    .panel {
      width: min(320px, 94%); border: 3px solid var(--gold); background: #160816;
      padding: 10px; color: var(--pale); font-size: 12px;
    }
    .panel.wide { width: min(360px, 96%); }
    .panel h2 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .1em; }
    .panel button, .blist button, .choice {
      display: block; width: 100%; margin: 4px 0; padding: 6px; border: 2px solid #c9a33a;
      background: #3a1430; color: var(--pale); font: 700 12px "Courier New", monospace;
      cursor: pointer; text-align: left;
    }
    .panel button:hover, .blist button:hover, .choice:hover { filter: brightness(1.18); }
    .blist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .brow { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .bstat { flex: 1; border: 2px solid #8a4068; padding: 5px; background: #100610; }
    .hue-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; box-shadow: 0 0 6px currentColor; }
    .log { min-height: 32px; color: #ffe8c8; font-size: 11px; line-height: 1.35; margin: 6px 0; }
    #mobile {
      display: none; position: absolute; left: 0; right: 0; bottom: 8px; height: 132px;
      pointer-events: none; justify-content: space-between; padding: 0 12px;
    }
    .pad, .ab { pointer-events: auto; }
    .pad { display: grid; grid-template-columns: 44px 44px 44px; grid-template-rows: 44px 44px 44px; gap: 4px; }
    .pad b, .ab b {
      display: grid; place-items: center; border: 2px solid #f0d060; background: rgba(40,10,36,.8);
      color: #fff6d8; font-size: 14px; font-weight: 700;
    }
    .pad b:nth-child(1), .pad b:nth-child(3), .pad b:nth-child(7), .pad b:nth-child(9) { visibility: hidden; }
    .ab { display: flex; gap: 10px; align-items: flex-end; }
    .ab b { width: 54px; height: 54px; border-radius: 50%; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (max-width: 820px), (pointer: coarse) {
      #mobile { display: flex; }
      #wrap { align-items: start; padding-top: 8px; }
    }
  </style>
</head>

/* ------------------------------------------------------------------ */
/*  Color combat — ordinary objects channel magic across Wavelengths. */
/*  Colors stand for different things. Complementary hues CLASH.     */
/*  Same hues RESONATE. Adjacent hues MIX. Darkness (Umbra) drinks    */
/*  unmatched color. Hal and Wanda's talents clash until they master  */
/*  them together as a Chorus (white).                                */
/* ------------------------------------------------------------------ */
const SPECTRUM = {
  order: ["red", "orange", "yellow", "green", "blue", "violet"],
  hex: {
    red: "#e23a3a", orange: "#f08a28", yellow: "#f0d030",
    green: "#3cb464", blue: "#3a78e0", violet: "#8a4ae0",
    white: "#f4f0ff", umbra: "#1a1018"
  },
  meaning: {
    red: "Force", orange: "Change", yellow: "Light",
    green: "Life", blue: "Thought", violet: "Door"
  },
  conduit: {
    red: "chili-brick", orange: "copper coin", yellow: "attic lamp",
    green: "jade leaf", blue: "ink bottle", violet: "ribbon key"
  },
  warm: ["red", "orange", "yellow"],
  cool: ["green", "blue", "violet"],
  index(c) { return this.order.indexOf(c); },
  opposite(c) {
    const i = this.index(c);
    return i < 0 ? null : this.order[(i + 3) % 6];
  },
  relation(atk, def) {
    if (atk === "white") return "chorus";
    if (def === "umbra") return "umbra";
    const a = this.index(atk), d = this.index(def);
    if (a < 0 || d < 0) return "glance";
    const dist = Math.min((a - d + 6) % 6, (d - a + 6) % 6);
    if (dist === 0) return "resonate";
    if (dist === 1) return "mix";
    if (dist === 2) return "glance";
    return "clash";
  },
  mixName(a, b) {
    const pair = [a, b].sort().join("+");
    return ({
      "orange+red": "Spark",
      "orange+yellow": "Glare",
      "green+yellow": "Bloom",
      "blue+green": "Tide",
      "blue+violet": "Dusk",
      "red+violet": "Bind"
    })[pair] || "Blend";
  },
  affinity(caster, color) {
    if (color === "white") return 1.25;
    if (caster === "hal") return this.warm.includes(color) ? 1.25 : 0.85;
    if (caster === "wanda") return this.cool.includes(color) ? 1.25 : 0.85;
    return 1;
  },
  resolve(opts) {
    const { color, foeHue, caster, level, stolen, both } = opts;
    const rel = this.relation(color, foeHue);
    const aff = both
      ? (this.affinity("hal", color) + this.affinity("wanda", color)) / 2
      : this.affinity(caster, color);
    const lv = Math.max(1, level || 1);
    let dmg = 6 + lv * 2;
    let heal = 0;
    let steal = false;
    let status = null;
    let log = "";
    if (rel === "clash") {
      dmg = Math.round((10 + lv * 3) * aff * (both ? 1.35 : 1));
      log = "CLASH! Opposite Wavelengths strike true.";
    } else if (rel === "resonate") {
      dmg = Math.round((3 + lv) * aff);
      steal = true;
      log = "RESONATE. The hues lock. You seize the Wavelength.";
    } else if (rel === "mix") {
      dmg = Math.round((7 + lv * 2) * aff);
      status = this.mixName(color, foeHue);
      log = "MIX into " + status + ".";
    } else if (rel === "chorus") {
      dmg = Math.round((14 + lv * 4) * (both ? 1.2 : 1));
      log = "CHORUS. Hal and Wanda braid every Wavelength.";
    } else if (rel === "umbra") {
      if (color === "white" || (stolen && color === this.opposite(stolen))) {
        dmg = Math.round((12 + lv * 3) * (color === "white" ? 1.3 : 1.15));
        log = color === "white"
          ? "White light refuses the Unpainting."
          : "The stolen hue is thrown back as a clash.";
      } else {
        dmg = 0;
        heal = 6 + lv;
        log = "Umbra drinks the unmatched color.";
      }
    } else {
      dmg = Math.round((5 + lv) * aff);
      log = "A glancing Wavelength. Little purchase.";
    }
    return { rel, dmg: Math.max(0, dmg), heal, steal, status, log };
  }
};

function gridFrom(rows) {
  return { w: rows[0].length, h: rows.length, grid: rows };
}
function fillMap(w, h, wall, floor, extra) {
  const rows = [];
  for (let y = 0; y < h; y++) {
    let r = "";
    for (let x = 0; x < w; x++) {
      if (extra && extra[y] && extra[y][x] && extra[y][x] !== " ") r += extra[y][x];
      else if (x === 0 || y === 0 || x === w - 1 || y === h - 1) r += wall;
      else r += floor;
    }
    rows.push(r);
  }
  return gridFrom(rows);
}

const BLOCK_DOOR = "D";
let keys = Object.create(null);
let mode = "title";
let state = null;
let dialogQ = [];
let dialogCb = null;
let typing = "";
let typeFull = "";
let typeT = 0;
let cam = { x: 0, y: 0 };
let anim = 0;
let last = 0;
let battle = null;
let audioCtx = null;
let musicTimer = 0;
let encounterCool = 0;
let fx = [];

function deep(o) { return JSON.parse(JSON.stringify(o)); }
function hasColor(c) { return !!(state && state.colors && state.colors[c]); }
function colorCount() {
  return SPECTRUM.order.filter((c) => hasColor(c)).length;
}

function newState() {
  return {
    ch: 0, hero: "hal",
    x: 4 * TS, y: 7 * TS, dir: "down", moving: false,
    hp: 42, maxHp: 42, chroma: 20, maxChroma: 20, xp: 0, lv: 1,
    items: { candy: 3, prismdrop: 1 },
    colors: { yellow: true },
    flags: {},
    party: ["hal", "wanda"],
    map: "attic",
    notes: {}
  };
}

function chapter() { return CHAPTERS[state.ch]; }
function curMap() { return MAPS[state.map]; }
function tileAt(px, py) {
  const m = curMap();
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (ty < 0 || tx < 0 || ty >= m.h || tx >= m.w) return "#";
  return m.grid[ty][tx];
}
function blocked(px, py) {
  const pts = [[px + 3, py + 10], [px + 12, py + 10], [px + 3, py + 15], [px + 12, py + 15]];
  return pts.some(([x, y]) => BLOCK.has(tileAt(x, y)));
}

function say(who, text) {
  dialogQ.push({ who, text });
  if (!dialogEl.classList.contains("show")) nextLine();
}
function sayMany(lines, cb) {
  lines.forEach((l) => dialogQ.push({ who: l[0], text: l[1] }));
  dialogCb = cb || null;
  if (!dialogEl.classList.contains("show")) nextLine();
}
function nextLine() {
  if (typing.length < typeFull.length) { typing = typeFull; renderDialog(); return; }
  const n = dialogQ.shift();
  if (!n) {
    dialogEl.classList.remove("show");
    typeFull = typing = "";
    const cb = dialogCb; dialogCb = null;
    if (cb) cb();
    return;
  }
  const actor = ACTORS[n.who] || { name: n.who };
  dialogEl.querySelector(".who").textContent = actor.name.toUpperCase();
  typeFull = n.text;
  typing = "";
  dialogEl.classList.add("show");
  renderDialog();
}
function renderDialog() { dialogEl.querySelector(".txt").textContent = typing; }

function setGoal(t) {
  goalEl.textContent = t ? "QUEST: " + t : "";
  goalEl.classList.toggle("show", mode === "explore" && !!t);
}

function loadChapter(i, extraIntro) {
  state.ch = i;
  const ch = CHAPTERS[i];
  state.hero = ch.hero;
  state.map = ch.map;
  state.x = ch.spawn[0] * TS;
  state.y = ch.spawn[1] * TS;
  state.dir = "down";
  state.maxHp = 42 + state.lv * 5;
  state.hp = state.maxHp;
  state.chroma = state.maxChroma;
  mode = "explore";
  titleUI.classList.remove("show");
  endingUI.classList.remove("show");
  pauseEl.classList.remove("show");
  battleEl.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(ch.goal);
  save();
  const lines = [["", "CHAPTER " + (state.ch + 1)], ["", ch.title], ...ch.intro];
  if (extraIntro) lines.push(...extraIntro);
  mode = "card";
  sayMany(lines, () => { mode = "explore"; });
}

function advanceChapter() {
  if (state.ch >= CHAPTERS.length - 1) { finishGame(); return; }
  loadChapter(state.ch + 1);
}

function finishGame() {
  mode = "ending";
  hudEl.classList.remove("show");
  goalEl.classList.remove("show");
  sayMany([
    ["unp", "Color is a habit. Darkness is honest."],
    ["wanda", "Darkness is what you get when you stop looking."],
    ["hal", "We kept every Wavelength. Even the ones that clash."],
    ["prism", "The multiverse stays painted. Ordinary objects keep their secret doors."]
  ], () => {
    endingUI.classList.add("show");
    document.getElementById("endingText").textContent =
      "Hal and Wanda master their clashing talents. The Unpainter's palette is empty. Six Wavelengths remain open, and the attic lamp is only a lamp again — until the next time an ordinary object starts to hum.";
    localStorage.removeItem(SAVE_KEY);
  });
}

function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function renderHud() {
  if (!state || mode === "title" || mode === "ending") { hudEl.classList.remove("show"); return; }
  hudEl.classList.add("show");
  const low = state.hp <= state.maxHp * 0.3;
  const hero = ACTORS[state.hero];
  hudEl.innerHTML =
    `<div class="hud-card"><b>${hero.name}</b>  Lv${state.lv}
      <div class="hpbar${low ? " low" : ""}"><i style="width:${Math.max(0, state.hp / state.maxHp * 100)}%"></i></div>
      <div class="hpbar chromabar"><i style="width:${Math.max(0, state.chroma / state.maxChroma * 100)}%"></i></div>
    </div>
    <div class="hud-card">WANDA
      <div style="margin-top:4px;font-size:9px;letter-spacing:.04em">${SPECTRUM.order.map((c) =>
        `<span class="hue-dot" style="background:${hasColor(c) ? SPECTRUM.hex[c] : "#332"}"></span>`
      ).join("")}</div>
    </div>`;
}

function showChoices(opts) {
  pauseEl.classList.add("show");
  pauseEl.innerHTML = `<div class="panel"><h2>CHOOSE</h2>${opts.map((o, i) =>
    `<button data-i="${i}">${o[0]}</button>`).join("")}</div>`;
  pauseEl.querySelectorAll("button").forEach((b) => {
    b.onclick = () => {
      pauseEl.classList.remove("show");
      pauseEl.innerHTML = "";
      opts[+b.dataset.i][1]();
    };
  });
}

function openMenu() {
  if (mode !== "explore") return;
  mode = "pause";
  pauseEl.classList.add("show");
  pauseEl.innerHTML = `<div class="panel">
    <h2>PAUSE</h2>
    <button data-a="codex">SPECTRUM CODEX</button>
    <button data-a="item">ITEMS</button>
    <button data-a="save">SAVE</button>
    <button data-a="title">TITLE</button>
    <button data-a="close">CLOSE</button>
  </div>`;
  pauseEl.querySelectorAll("button").forEach((b) => b.onclick = () => menuAct(b.dataset.a));
}
function closeMenu() {
  pauseEl.classList.remove("show");
  pauseEl.innerHTML = "";
  if (mode === "pause") mode = "explore";
}
function menuAct(a) {
  if (a === "close") { closeMenu(); return; }
  if (a === "save") { save(); closeMenu(); say("", "The attic remembers this page."); return; }
  if (a === "title") { closeMenu(); goTitle(); return; }
  if (a === "codex") { closeMenu(); openCodex(); return; }
  if (a === "item") {
    pauseEl.innerHTML = `<div class="panel"><h2>ITEMS</h2>
      <p>Candy ${state.items.candy || 0} — restore HP.</p>
      <p>Prism drop ${state.items.prismdrop || 0} — restore Chroma.</p>
      <button data-a="close">CLOSE</button></div>`;
    pauseEl.querySelector("button").onclick = () => menuAct("close");
  }
}

function openCodex() {
  mode = "codex";
  const rows = SPECTRUM.order.map((c) => {
    const known = hasColor(c);
    const opp = SPECTRUM.opposite(c);
    return `<div style="margin:5px 0;padding:5px;border:2px solid ${known ? SPECTRUM.hex[c] : "#443"};background:#100810">
      <b style="color:${known ? SPECTRUM.hex[c] : "#776"}">${c.toUpperCase()}</b>
      ${known ? " — " + SPECTRUM.meaning[c] + ". Conduit: " + SPECTRUM.conduit[c] + ". Clashes with " + opp + "." : " — a locked Wavelength."}
    </div>`;
  }).join("");
  codexEl.classList.add("show");
  codexEl.innerHTML = `<div class="panel wide"><h2>SPECTRUM CODEX</h2>
    <p style="font-size:11px;line-height:1.4;color:#ffd8e8">Ordinary objects channel magic across color-linked dimensions. Same hue resonates. Opposite hue clashes. Adjacent hues mix. Umbra drinks unmatched color. Hal favors warm Wavelengths; Wanda favors cool. Together they can Chorus.</p>
    ${rows}
    <button id="cx">CLOSE</button></div>`;
  document.getElementById("cx").onclick = () => {
    codexEl.classList.remove("show");
    codexEl.innerHTML = "";
    mode = "explore";
  };
}

function startBattle(id, onWin) {
  const foe = deep(FOES[id]);
  if (!foe) return;
  foe.maxHp = foe.hp;
  battle = { foe, onWin, log: foe.name + " takes a hue!", menu: "main", caster: state.hero, both: false };
  mode = "battle";
  beep(520, 0.08);
  renderBattle();
}

function renderBattle() {
  const b = battle;
  if (!b) return;
  const f = b.foe;
  const hue = SPECTRUM.hex[f.hue] || "#888";
  const colors = SPECTRUM.order.map((c) => {
    const locked = !hasColor(c);
    return `<button data-sp="${c}" ${locked ? "disabled" : ""} style="border-color:${locked ? "#444" : SPECTRUM.hex[c]}">${locked ? "—" : c.toUpperCase()}</button>`;
  }).join("");
  let body = "";
  if (b.menu === "main") {
    body = `<div class="blist">
      <button data-act="color">WAVELENGTH</button>
      <button data-act="clash">CLASH / CHORUS</button>
      <button data-act="item">ITEM</button>
      <button data-act="run">RUN</button>
    </div>`;
  } else if (b.menu === "color") {
    body = `<div class="blist">${colors}</div><button data-back="1">BACK</button>
      <p style="font-size:10px;color:#c090a8">Caster: ${ACTORS[b.caster].name}. Z to confirm a hue.</p>`;
  } else if (b.menu === "item") {
    body = `<button data-it="candy">CANDY (${state.items.candy || 0})</button>
      <button data-it="prismdrop">PRISM DROP (${state.items.prismdrop || 0})</button>
      <button data-back="1">BACK</button>`;
  }
  battleEl.classList.add("show");
  battleEl.innerHTML = `<div class="panel wide">
    <div class="brow">
      <div class="bstat"><b>${ACTORS[b.caster].name}</b><div class="hpbar"><i style="width:${state.hp / state.maxHp * 100}%"></i></div>Chroma ${state.chroma}</div>
      <div class="bstat"><b style="color:${hue}">${f.name}</b><div class="hpbar"><i style="width:${f.hp / f.maxHp * 100}%;background:${hue}"></i></div>Hue: ${f.hue}${f.stolen ? " · stole " + f.stolen : ""}</div>
    </div>
    <div class="log">${b.log}</div>
    ${body}
  </div>`;
  battleEl.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => battleAct(el.dataset.act));
  battleEl.querySelectorAll("[data-sp]").forEach((el) => el.onclick = () => castColor(el.dataset.sp, false));
  battleEl.querySelectorAll("[data-it]").forEach((el) => el.onclick = () => battleItem(el.dataset.it));
  battleEl.querySelectorAll("[data-back]").forEach((el) => { el.onclick = () => { battle.menu = "main"; renderBattle(); }; });
}

function battleAct(act) {
  if (!battle || battle.foe.hp <= 0) return;
  if (act === "color") { battle.menu = "color"; renderBattle(); return; }
  if (act === "item") { battle.menu = "item"; renderBattle(); return; }
  if (act === "run") {
    if (battle.foe.boss) { battle.log = "The hue will not let you leave."; renderBattle(); return; }
    if (Math.random() < 0.65) { endBattle(false); say("", "You slip a wavelength sideways."); return; }
    battle.log = "The color sticks."; enemyTurn(); return;
  }
  if (act === "clash") {
    if (colorCount() < 2) { battle.log = "You need two Wavelengths to clash."; renderBattle(); return; }
    if (state.chroma < 6) { battle.log = "Not enough Chroma to braid talents."; renderBattle(); return; }
    const warm = SPECTRUM.warm.find((c) => hasColor(c));
    const cool = SPECTRUM.cool.find((c) => hasColor(c));
    if (battle.foe.hue === "umbra") {
      if (colorCount() >= 6 && state.chroma >= 8) {
        state.chroma -= 8;
        castColor("white", true);
        return;
      }
      const rebound = battle.foe.stolen ? SPECTRUM.opposite(battle.foe.stolen) : null;
      if (rebound && hasColor(rebound)) {
        state.chroma -= 6;
        castColor(rebound, true);
        return;
      }
      battle.log = "Umbra drinks unmatched color. Clash with the opposite of what it stole, or Chorus with every hue.";
      renderBattle();
      return;
    }
    if (warm && cool) {
      state.chroma -= 6;
      const use = SPECTRUM.opposite(battle.foe.hue);
      const color = hasColor(use) ? use : (SPECTRUM.warm.includes(battle.foe.hue) ? cool : warm);
      castColor(color, true);
      return;
    }
    battle.log = "Warm and cool must both be unlocked.";
    renderBattle();
  }
}

function castColor(color, both) {
  if (!battle || battle.resolved) return;
  const cost = color === "white" ? 8 : (both ? 6 : 3);
  if (!both && state.chroma < cost) { battle.log = "Chroma too thin."; renderBattle(); return; }
  if (!both) state.chroma -= cost;
  const res = SPECTRUM.resolve({
    color, foeHue: battle.foe.hue, caster: battle.caster,
    level: state.lv, stolen: battle.foe.stolen, both
  });
  battle.foe.hp -= res.dmg;
  if (res.heal) battle.foe.hp = Math.min(battle.foe.maxHp, battle.foe.hp + res.heal);
  if (res.steal && battle.foe.hue !== "umbra") {
    battle.foe.stolen = battle.foe.hue;
    battle.foe.hue = color;
  }
  if (res.status === "Tide") battle.foe.atk = Math.max(2, battle.foe.atk - 2);
  if (res.status === "Bloom") state.hp = Math.min(state.maxHp, state.hp + 6);
  if (res.status === "Bind") battle.foe.bound = true;
  battle.log = (both ? "Hal and Wanda — " : ACTORS[battle.caster].name + " — ") + color.toUpperCase() + ". " + res.log +
    (res.dmg ? " " + res.dmg + " damage." : "") + (res.heal ? " Foe mends " + res.heal + "." : "");
  beep(color === "white" ? 880 : 340 + SPECTRUM.index(color) * 70, 0.09);
  spawnFx(color);
  if (battle.foe.hp <= 0) { winBattle(); return; }
  enemyTurn();
}

function battleItem(id) {
  if (!state.items[id]) { battle.log = "None left."; renderBattle(); return; }
  state.items[id]--;
  if (id === "candy") { state.hp = Math.min(state.maxHp, state.hp + 18); battle.log = "Candy. Color returns to your face."; }
  else { state.chroma = Math.min(state.maxChroma, state.chroma + 12); battle.log = "A drop of Prism. Chroma brightens."; }
  enemyTurn();
}

function enemyTurn() {
  if (!battle || battle.foe.hp <= 0) return;
  if (battle.foe.bound) { battle.foe.bound = false; battle.log += " Bound — the foe misses a stroke."; battle.menu = "main"; renderBattle(); return; }
  let dmg = Math.max(1, battle.foe.atk - Math.floor(state.lv / 2) + Math.floor(Math.random() * 3));
  const lastRel = SPECTRUM.relation(state.hero === "hal" ? "red" : "blue", battle.foe.hue);
  if (lastRel === "clash") dmg = Math.max(1, Math.floor(dmg * 0.7));
  state.hp -= dmg;
  battle.log += " " + battle.foe.name + " paints " + dmg + "!";
  if (battle.foe.hue === "umbra" && Math.random() < 0.4) {
    const steal = SPECTRUM.order[Math.floor(Math.random() * 6)];
    battle.foe.stolen = steal;
    battle.log += " It sips " + steal + ".";
  }
  battle.menu = "main";
  battle.caster = battle.caster === "hal" ? "wanda" : "hal";
  if (state.hp <= 0) {
    state.hp = 1;
    battle.log = "You drop. The attic lamp flickers you home.";
    renderBattle();
    setTimeout(() => {
      endBattle(false);
      state.map = "attic";
      state.x = 4 * TS; state.y = 7 * TS;
      state.hp = Math.max(8, Math.floor(state.maxHp / 2));
      say("wanda", "We lived. That is a kind of color.");
    }, 700);
    return;
  }
  renderBattle();
}

function winBattle() {
  if (!battle || battle.resolved) return;
  battle.resolved = true;
  battle.log = battle.foe.name + " loses its hue!";
  state.xp += battle.foe.xp;
  state.chroma = Math.min(state.maxChroma, state.chroma + 4);
  if (state.xp >= state.lv * 28) {
    state.xp = 0; state.lv++;
    state.maxHp += 6; state.hp = state.maxHp;
    state.maxChroma += 3; state.chroma = state.maxChroma;
    battle.log += " Level up!";
  }
  const cb = battle.onWin;
  renderBattle();
  setTimeout(() => { endBattle(true); if (cb) cb(); }, 550);
}

function endBattle(won) {
  battleEl.classList.remove("show");
  battleEl.innerHTML = "";
  battle = null;
  mode = "explore";
  encounterCool = won ? 90 : 40;
  renderHud();
  save();
}

function spawnFx(color) {
  fx.push({ c: SPECTRUM.hex[color] || "#fff", t: 18, x: W * 0.62, y: 90 });
}

function interact() {
  if (mode !== "explore") return;
  const dx = state.dir === "left" ? -1 : state.dir === "right" ? 1 : 0;
  const dy = state.dir === "up" ? -1 : state.dir === "down" ? 1 : 0;
  const tx = Math.floor((state.x + 8) / TS) + dx;
  const ty = Math.floor((state.y + 8) / TS) + dy;
  const here = tileAt(state.x + 8, state.y + 8);
  const face = curMap().grid[ty] && curMap().grid[ty][tx];
  const t = face || here;
  handleTile(t, tx, ty);
}

function unlock(color, lines, then) {
  if (!state.colors[color]) {
    state.colors[color] = true;
    save();
  }
  sayMany(lines, then);
}

function handleTile(t, tx, ty) {
  const ch = state.ch;
  if (t === "Y" && state.map === "attic") {
    if (!state.flags.lamp) {
      state.flags.lamp = true;
      unlock("yellow", [
        ["hal", "The lamp isn't brighter. It's... more yellow."],
        ["wanda", "Yellow is Light. Ordinary glass, ordinary wick — and a door."],
        ["primer", "Same hue resonates. Opposite hue clashes. Remember that, or the next mote will."],
        ["hal", "There's a mote. Of course there's a mote."]
      ], () => startBattle("mote", () => {
        setGoal("Leave the attic. The street is flushing red.");
        state.flags.atticDone = true;
        save();
        say("wanda", "We should see if the rest of the house is still the right colors.");
      }));
      return;
    }
    say("hal", "The lamp is still a lamp. That is the whole miracle.");
    return;
  }
  if (t === "D") {
    if (state.map === "attic") {
      if (!state.flags.atticDone) { say("wanda", "The lamp first. If we ignore a humming object, it gets louder."); return; }
      if (ch === 0) { advanceChapter(); return; }
      loadChapter(Math.max(1, ch));
      return;
    }
    if (state.map === "prism" && ch === 7) {
      if (colorCount() < 6) { say("prism", "Six doors. You have " + colorCount() + ". The Unpainter is counting too."); return; }
      advanceChapter();
      return;
    }
    if (state.map === "umbra") { say("unp", "There is no backstage from here."); return; }
    if (ch < CHAPTERS.length - 1 && MAPS[CHAPTERS[Math.min(ch + 1, CHAPTERS.length - 1)].map]) {
      if (state.flags["boss" + ch]) { advanceChapter(); return; }
    }
    say("", "The door waits until this Wavelength is settled.");
    return;
  }
  if (t === "R" && state.map !== "street" && state.map !== "prism") {
    say("", "A red memory, not a door.");
    return;
  }
  if (t === "R" && state.map === "prism") {
    say("prism", "Force still shouts in the crystal. Save it for the Unpainter.");
    return;
  }
  if (t === "R") {
    unlock("red", [
      ["hal", "A brick, a chili, a scrape of rusted paint. Force."],
      ["wanda", "Red shouts. That's your talent, Hal. Don't let it shout at the wrong wall."]
    ], () => {
      if (!state.flags.boss1) startBattle("ember", () => {
        state.flags.boss1 = true; save();
        sayMany([["hal", "The street remembers being asphalt."], ["wanda", "Next market. Orange never sits still."]], () => advanceChapter());
      });
      else say("hal", "The rift is quieter. Force is a muscle. It can rest.");
    });
    return;
  }
  if (t === "O" && state.map === "prism") {
    say("prism", "Change flickers in the copper vein. It will not sit still even here.");
    return;
  }
  if (t === "O" && state.map !== "market") {
    say("", "Orange without a market is only rust.");
    return;
  }
  if (t === "O") {
    unlock("orange", [
      ["wanda", "A copper coin that will not keep a date. Change."],
      ["clerk", "Spend it and it becomes a different coin. That's orange for you."]
    ], () => {
      if (!state.flags.boss2) startBattle("coppers", () => {
        state.flags.boss2 = true; save();
        say("wanda", "Library next. Light is less polite than Force.");
        advanceChapter();
      });
      else say("clerk", "The fruit is staying fruit. Mostly.");
    });
    return;
  }
  if (t === "Y" && state.map === "prism") {
    say("prism", "Light sits in the yellow facet, asking the same question the attic lamp asked.");
    return;
  }
  if (t === "Y" && state.map === "library") {
    unlock("yellow", [
      ["page", "The Primer is short because the rules are short."],
      ["page", "Resonate to seize a hue. Clash to break one. Mix to invent a third. Umbra drinks anything unmatched."],
      ["hal", "And Chorus?"],
      ["page", "That is not in the book. That is the two of you."]
    ], () => {
      if (!state.flags.boss3) startBattle("lantern", () => {
        state.flags.boss3 = true; save();
        advanceChapter();
      });
    });
    return;
  }
  if (t === "G" && state.map === "prism") {
    say("prism", "Life in crystal is a slow green. It will wait.");
    return;
  }
  if (t === "G" && state.map !== "green") {
    say("", "Green wants soil.");
    return;
  }
  if (t === "G") {
    unlock("green", [
      ["gard", "A jade leaf, still deciding whether to be plant or stone. Life."],
      ["wanda", "Green is mine as much as blue. It mends. It also overgrows."]
    ], () => {
      if (!state.flags.boss4) startBattle("root", () => {
        state.flags.boss4 = true; save();
        advanceChapter();
      });
    });
    return;
  }
  if (t === "B" && state.map === "prism") {
    say("prism", "Thought pools in the blue facet. Do not rush it.");
    return;
  }
  if (t === "B" && state.map !== "harbor") {
    say("", "Blue wants water and quiet.");
    return;
  }
  if (t === "B") {
    unlock("blue", [
      ["dock", "Ink in a bottle that remembers every letter it was almost."],
      ["wanda", "Thought. If we rush it, it ices over."]
    ], () => {
      if (!state.flags.boss5) startBattle("harbor", () => {
        state.flags.boss5 = true; save();
        advanceChapter();
      });
    });
    return;
  }
  if (t === "V" && state.map === "prism") {
    say("prism", "Door-light. The last ribbon before the gallery.");
    return;
  }
  if (t === "V" && state.map !== "theater") {
    say("", "Violet wants a threshold.");
    return;
  }
  if (t === "V") {
    unlock("violet", [
      ["usher", "A ribbon that is also a key. Door."],
      ["hal", "If violet opens, it can also shut us in with him."],
      ["wanda", "Then we walk through together."]
    ], () => {
      if (!state.flags.boss6) startBattle("usher", () => {
        state.flags.boss6 = true; save();
        advanceChapter();
      });
    });
    return;
  }
  if (t === "U") {
    if (state.map !== "prism" && state.map !== "umbra") {
      say("", "A hole where a color used to be.");
      return;
    }
    if (state.map === "prism") {
      sayMany([
        ["prism", "He is already unpainting the gallery."],
        ["wanda", "Umbra drinks unmatched color. Clash with what he stole, or Chorus with everything."]
      ], () => { state.flags.readyFinal = true; save(); });
      return;
    }
    if (!state.flags.final) {
      state.flags.final = true;
      startBattle("unpainter", () => {
        state.flags.won = true;
        finishGame();
      });
    }
    return;
  }
  if (t === "C" && state.map === "attic") {
    say("mom", "If you find a humming object, tell me before you put it in your pocket. Or after. I know you.");
    return;
  }
  if (t === "*" ) {
    say("prism", "White is not a seventh color. White is all six refusing to be lonely.");
    return;
  }
  if (t === "S" || t === "H") {
    const chatter = {
      attic: ["The stairs still lead down. That is not guaranteed anymore."],
      street: ["Red isn't angry. Red is just done waiting."],
      market: ["Don't buy the oranges. They might become clocks."],
      library: ["Silence, please. Light is trying to read."],
      green: ["Do not water the Wavelength. It waters back."],
      harbor: ["The tide is thinking. Give it a minute."],
      theater: ["The curtain is a door if you applaud correctly."],
      prism: ["Stand in the middle if you want every color at once. It will hurt, usefully."],
      umbra: ["There is nothing here on purpose."]
    };
    say("", (chatter[state.map] || ["..."])[0]);
    return;
  }
  say("", "Nothing humming here.");
}

function randomFoe() {
  const byMap = {
    street: "scarlet", market: "rustfox", library: "glare",
    green: "thorn", harbor: "ripple", theater: "curtain", umbra: "blot"
  };
  return byMap[state.map];
}

function tryEncounter() {
  if (encounterCool > 0) { encounterCool--; return; }
  if (!randomFoe()) return;
  if (mode !== "explore") return;
  if (Math.random() > 0.018) return;
  encounterCool = 70;
  startBattle(randomFoe());
}

function goTitle() {
  mode = "title";
  battle = null;
  hudEl.classList.remove("show");
  goalEl.classList.remove("show");
  titleUI.classList.add("show");
  endingUI.classList.remove("show");
  pauseEl.classList.remove("show");
  battleEl.classList.remove("show");
  document.getElementById("btnContinue").style.opacity = loadSave() ? "1" : ".45";
}

function startNew() {
  state = newState();
  loadChapter(0);
  renderHud();
  ensureAudio();
}

function startContinue() {
  const s = loadSave();
  if (!s) { say("", "No saved Wavelength."); return; }
  state = s;
  mode = "explore";
  titleUI.classList.remove("show");
  hudEl.classList.add("show");
  setGoal(chapter().goal);
  renderHud();
  ensureAudio();
}

function showHow() {
  sayMany([
    ["", "Move with arrows or WASD. Confirm with Z or Space. Menu with X."],
    ["", "Combat is color. Pick a Wavelength. Opposite hues CLASH for heavy damage. Same hues RESONATE and steal the foe's color. Adjacent hues MIX."],
    ["", "Hal is stronger in red, orange, yellow. Wanda is stronger in green, blue, violet. Clash/Chorus uses both talents."],
    ["", "Umbra, the Unpainter's hue, drinks unmatched color. Throw back what he stole, or Chorus with every Wavelength."]
  ]);
}

/* drawing */
function px(x, y, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, 1, 1); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x | 0, y | 0, w, h); }

function drawTile(kind, sx, sy, pal) {
  rect(sx, sy, TS, TS, pal.floor);
  if (kind === "#") {
    rect(sx, sy, TS, TS, pal.wall);
    rect(sx + 1, sy + 1, TS - 2, 3, "#0004");
    rect(sx + 2, sy + 6, 12, 2, pal.acc);
  } else if (kind === "T") {
    rect(sx + 2, sy + 6, 12, 8, "#5a3a22");
    rect(sx + 3, sy + 4, 10, 3, "#8a5a32");
  } else if (kind === "+") {
    rect(sx + 1, sy + 4, 14, 10, "#6a4058");
    rect(sx + 2, sy + 5, 12, 4, "#d8c0c8");
  } else if (kind === "C") {
    rect(sx + 3, sy + 6, 10, 8, "#8a5a20");
    rect(sx + 3, sy + 6, 10, 2, pal.light);
  } else if (kind === "S") {
    rect(sx + 2, sy + 2, 12, 12, "#5a4030");
    rect(sx + 4, sy + 4, 8, 8, "#2a2018");
  } else if (kind === "H") {
    rect(sx + 1, sy + 1, 14, 14, "#4a3040");
    rect(sx + 5, sy + 4, 6, 8, "#1a1018");
  } else if (kind === "~") {
    rect(sx, sy, TS, TS, "#163a68");
    rect(sx, sy + ((anim / 8 | 0) % 2) * 2, TS, 2, "#3a78e0");
  } else if (kind === "=") {
    rect(sx, sy, TS, TS, "#3a3a44");
    rect(sx, sy + 7, TS, 2, "#2a2a30");
  } else if (kind === ",") {
    rect(sx, sy, TS, TS, "#16351c");
    px(sx + 4, sy + 6, "#3cb464"); px(sx + 10, sy + 11, "#2a8040");
  } else if (kind === "*") {
    rect(sx + 4, sy + 3, 8, 11, "#f4f0ff");
    rect(sx + 6, sy + 1, 4, 14, pal.light);
  } else if (kind === "D") {
    rect(sx + 3, sy + 2, 10, 14, "#5a3020");
    px(sx + 11, sy + 9, pal.light);
  } else if ("ROYGBVU".includes(kind)) {
    const mapHue = { R: "red", O: "orange", Y: "yellow", G: "green", B: "blue", V: "violet", U: "umbra" };
    const c = SPECTRUM.hex[mapHue[kind]];
    rect(sx + 2, sy + 2, 12, 12, c);
    rect(sx + 5, sy + 5, 6, 6, "#fff8");
    if ((anim / 10 | 0) % 2) rect(sx + 1, sy + 1, 14, 14, c + "55");
  }
}

function drawActor(who, ax, ay, dir, walking) {
  const a = ACTORS[who];
  const bob = walking ? ((anim / 6 | 0) % 2) : 0;
  const y = ay - 2 - bob;
  rect(ax + 5, y + 2, 6, 5, a.hair);
  rect(ax + 5, y + 5, 6, 5, a.skin);
  rect(ax + 4, y + 10, 8, 6, a.coat);
  rect(ax + 6, y + 16, 2, 3, "#2a1820");
  rect(ax + 9, y + 16, 2, 3, "#2a1820");
  if (dir === "left") px(ax + 6, y + 7, "#1a1010");
  else if (dir === "right") px(ax + 9, y + 7, "#1a1010");
  else { px(ax + 6, y + 7, "#1a1010"); px(ax + 9, y + 7, "#1a1010"); }
  px(ax + 7, y + 12, a.acc);
}

function drawWorld() {
  const m = curMap();
  const pal = MAP_PAL[state.map] || MAP_PAL.attic;
  cam.x = Math.max(0, Math.min(m.w * TS - W, state.x - W / 2 + 8));
  cam.y = Math.max(0, Math.min(m.h * TS - H, state.y - H / 2 + 8));
  rect(0, 0, W, H, pal.wall);
  for (let ty = 0; ty < m.h; ty++) {
    for (let tx = 0; tx < m.w; tx++) {
      const sx = tx * TS - cam.x, sy = ty * TS - cam.y;
      if (sx < -TS || sy < -TS || sx > W || sy > H) continue;
      drawTile(m.grid[ty][tx], sx, sy, pal);
    }
  }
  if (state.party.includes("wanda") && state.hero === "hal") {
    drawActor("wanda", state.x - cam.x - 10, state.y - cam.y, state.dir, state.moving);
  }
  drawActor(state.hero, state.x - cam.x, state.y - cam.y, state.dir, state.moving);
  if (state.party.includes("hal") && state.hero === "wanda") {
    drawActor("hal", state.x - cam.x + 12, state.y - cam.y, state.dir, state.moving);
  }
  fx = fx.filter((p) => {
    p.t--;
    ctx.globalAlpha = Math.max(0, p.t / 18);
    rect(p.x - (18 - p.t), p.y - (18 - p.t) / 2, 6, 6, p.c);
    ctx.globalAlpha = 1;
    return p.t > 0;
  });
}

function tick(t) {
  const dt = Math.min(40, t - last); last = t;
  anim++;
  if (mode === "explore" || mode === "card" || mode === "battle") musicTick();
  if (dialogEl.classList.contains("show") && typing.length < typeFull.length) {
    typeT += dt;
    while (typeT > 16 && typing.length < typeFull.length) {
      typing += typeFull[typing.length];
      typeT -= 16;
    }
    renderDialog();
  }
  if (mode === "explore" && !dialogEl.classList.contains("show")) {
    let vx = 0, vy = 0;
    if (keys.left || keys.a) vx = -1;
    if (keys.right || keys.d) vx = 1;
    if (keys.up || keys.w) vy = -1;
    if (keys.down || keys.s) vy = 1;
    state.moving = !!(vx || vy);
    if (vx) state.dir = vx < 0 ? "left" : "right";
    else if (vy) state.dir = vy < 0 ? "up" : "down";
    const sp = 1.15;
    if (vx && !blocked(state.x + vx * sp, state.y)) state.x += vx * sp;
    if (vy && !blocked(state.x, state.y + vy * sp)) state.y += vy * sp;
    tryEncounter();
    renderHud();
  }
  if (mode !== "title" && mode !== "ending" && state) drawWorld();
  else if (mode === "title") drawTitle();
  requestAnimationFrame(tick);
}

function drawTitle() {
  rect(0, 0, W, H, "#100814");
  for (let i = 0; i < 6; i++) {
    const c = SPECTRUM.order[i];
    rect(18 + i * 38, 36 + Math.sin((anim + i * 12) / 14) * 4, 28, 10, SPECTRUM.hex[c]);
  }
  drawActor("hal", 88, 70, "down", true);
  drawActor("wanda", 148, 70, "down", true);
}

function confirm() {
  if (dialogEl.classList.contains("show")) { nextLine(); return; }
  if (mode === "title") return;
  if (mode === "explore") interact();
}

function keyOn(k, down) {
  const map = { arrowleft: "left", arrowright: "right", arrowup: "up", arrowdown: "down" };
  const id = map[k] || k;
  if (down) keys[id] = true; else keys[id] = false;
  if (!down) return;
  if (id === "z" || id === " " || id === "enter" || id === "ok") confirm();
  if (id === "x" || id === "escape" || id === "menu") {
    if (mode === "pause" || mode === "codex") { closeMenu(); codexEl.classList.remove("show"); mode = "explore"; }
    else openMenu();
  }
}

window.addEventListener("keydown", (e) => {
  keyOn(e.key.toLowerCase(), true);
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","z","x"].includes(e.key.toLowerCase()) || e.key === " ") e.preventDefault();
});
window.addEventListener("keyup", (e) => keyOn(e.key.toLowerCase(), false));
document.querySelectorAll("#mobile b[data-k]").forEach((b) => {
  const k = b.dataset.k;
  const go = (d) => (e) => { e.preventDefault(); keyOn(k, d); };
  b.addEventListener("pointerdown", go(true));
  b.addEventListener("pointerup", go(false));
  b.addEventListener("pointerleave", go(false));
});

function fit() {
  const pad = window.matchMedia("(pointer: coarse)").matches ? 150 : 24;
  const s = Math.max(1, Math.floor(Math.min((window.innerWidth - 16) / W, (window.innerHeight - pad) / H)));
  stage.style.width = (W * s) + "px";
  stage.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function beep(freq, dur) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = "square";
  o.frequency.value = freq;
  g.gain.value = 0.04;
  o.connect(g); g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + dur);
}
function musicTick() {
  if (!audioCtx || (anim % 22)) return;
  const scale = [262, 330, 392, 523, 392, 330, 294, 392];
  const hueShift = state ? (SPECTRUM.index(Object.keys(state.colors).pop() || "yellow") || 0) * 8 : 0;
  beep(scale[(anim / 22 | 0) % scale.length] + hueShift, 0.07);
}

document.getElementById("btnNew").onclick = startNew;
document.getElementById("btnContinue").onclick = startContinue;
document.getElementById("btnHow").onclick = showHow;
document.getElementById("btnAgain").onclick = goTitle;

window.WANDAFUL_SPECTRUM = SPECTRUM;
window.WANDAFUL_FOES = FOES;

goTitle();
requestAnimationFrame(tick);
</script>
